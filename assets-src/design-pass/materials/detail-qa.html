<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm material QA</title><style>body{margin:0;background:#e7e2d4;font:13px system-ui}header{height:34px;display:flex;align-items:center;gap:14px;padding:0 10px}iframe{border:0;display:block;zoom:.78}pre{font:11px monospace;margin:3px 10px;white-space:pre-wrap}</style><header><b>Переносы декора · QA</b><label>Экран <select id="size"><option value="1180">1180 × 820</option><option value="390">390 × 844</option></select></label><label>Участок <select id="area"><option value="house">Дом</option><option value="stable">Конюшня</option><option value="pig">Свиньи</option><option value="wide">Вся ферма</option><option value="garden">Огород</option><option value="yard">Двор</option></select></label><label>Свет <select id="phase"><option value="day">День</option><option value="night">Ночь</option></select></label><label>Качество <select id="quality"><option value="1">1</option><option value="2">2</option></select></label><button id="focus">Обновить ракурс</button><span id="status">Загрузка</span></header><iframe id="game" width="1180" height="820" src="/?q=1"></iframe><pre id="report"></pre><script type="module">
import {Vector3} from '/node_modules/three/build/three.module.js';
import {PATHS,MUD} from '/src/farm-decor.ts';
const errors=[];let g;const f=document.getElementById('game'),size=document.getElementById('size');
const state=document.getElementById('status'),report=document.getElementById('report');
const areas={house:[[-49,-31],[-31,-14]],stable:[[36,-12],[54,5]],pig:[[18,-31],[37,-8]],wide:[[-54,-37],[54,37]],garden:[[-9,16],[36,36]],yard:[[-18,-13],[18,12]]};const area=document.getElementById('area'),phase=document.getElementById('phase'),quality=document.getElementById('quality');const points=()=>areas[area.value].map(([x,z])=>new Vector3(x,0,z));
function focus(){if(!g)return;const ps=points();g.map.hooks.focus(ps);g.map.hooks.focus(ps,true);state.textContent='Готово: '+area.value;report.textContent=JSON.stringify({viewport:[f.width,f.height],area:area.value,phase:g.map.phase,nightAmount:g.map.nightAmount,quality:g.stage.quality,clientWidth:f.contentDocument.documentElement.clientWidth,scrollWidth:f.contentDocument.documentElement.scrollWidth,paths:PATHS.length,pigLanePresent:PATHS.some(p=>p.points[0][0]===27&&p.points[0][1]===-9),mud:MUD,errors},null,0)}
document.getElementById('focus').onclick=focus;area.onchange=focus;phase.onchange=()=>{g?.map.setPhase(phase.value);g?.voice.stop();focus()};quality.onchange=()=>{g=null;f.src='/?q='+quality.value};
size.onchange=()=>{f.width=size.value;f.height=size.value==='390'?'844':'820';requestAnimationFrame(()=>requestAnimationFrame(()=>focus()))};
f.addEventListener('load',()=>{f.contentWindow.addEventListener('error',e=>errors.push(e.message));f.contentWindow.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));const t=setInterval(async()=>{g=f.contentWindow.__game;if(!g)return;clearInterval(t);try{await g.startMap('farm',true);g.voice.stop();g.map.setPhase(phase.value);focus()}catch(e){state.textContent='Ошибка';report.textContent=String(e)}},200)});
</script></html>
