<!doctype html><html lang="ru"><meta charset="utf-8"><title>QA материалов</title><style>body{margin:0;background:#e8e2d5;font:13px system-ui}header{padding:7px;display:flex;gap:16px}iframe{border:0;display:block;zoom:.78}</style><header><label>Размер <select id="size"><option value="1180">1180 × 820</option><option value="390">390 × 844</option></select></label><span id="report">Загрузка</span></header><iframe id="preview" width="1180" height="820" src="candidate-review.html"></iframe><script>function check(){const d=preview.contentDocument;report.textContent=JSON.stringify({width:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,images:[...d.images].map(i=>({loaded:i.complete&&i.naturalWidth>0,size:[i.naturalWidth,i.naturalHeight]}))})}size.onchange=()=>{preview.width=size.value;preview.height=size.value==='390'?844:820;requestAnimationFrame(()=>requestAnimationFrame(check))};preview.onload=check;</script></html>
