<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Завод — настенный щит</title><style>body{margin:0;background:#e9e5d8;color:#263b3c;font:16px system-ui}main{max-width:850px;margin:auto;padding:18px}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0;line-height:1.45}.row{display:flex;gap:10px;flex-wrap:wrap}button{padding:10px 16px;font:inherit}#scene{width:100%;height:360px;background:#d6d6ce;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;height:100%}.asset{width:min(100%,420px);display:block;margin:auto;background:#c9c9be}small{display:block} @media(max-width:500px){main{padding:12px}#scene{height:300px}h1{font-size:20px}}</style><main><h1>Инструментальный щит · проверка ассета</h1><p>Фрагмент задней стены с фактическими высотами окна и трубы. Полная игровая расстановка пока не принята.</p><div class="row"><button id="game">Ракурс игры</button><button id="front">Прямой вид</button></div><div id="scene" aria-label="Трёхмерная проверка крепления щита"></div><p id="status">Загрузка…</p><img class="asset" src="/textures/kit/factory/factory-tool-board.webp" alt="Щит с семью инструментами, прозрачные поля сохранены"><small>WebP 512×333 · плоскость 2×1,30078125 · центр (−12;0,75;−25,38). Проверка зазора в игровом ракурсе, от стены 0,02.</small></main><script type="module">
import * as THREE from 'three';
const host=document.querySelector('#scene'),s=new THREE.Scene();s.background=new THREE.Color('#d6d6ce');
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=THREE.SRGBColorSpace;host.append(r.domElement);
const cam=new THREE.OrthographicCamera(-5,5,3,-3,.1,100);let front=false;
const basic=color=>new THREE.MeshBasicMaterial({color});
function box(size,pos,color){const o=new THREE.Mesh(new THREE.BoxGeometry(...size),basic(color));o.position.set(...pos);s.add(o);return o;}
box([8,5,.6],[0,2.5,0],'#e8dcc4');box([5,1.6,.1],[0,3.4,.35],'#9fd0e8');box([8,.02,4],[0,-.01,1.7],'#b3b0a5');
const pipe=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,8,12),basic('#9aa3ad'));pipe.rotation.z=Math.PI/2;pipe.position.set(0,2.2,.7);s.add(pipe);
const t=await new THREE.TextureLoader().loadAsync('/textures/kit/factory/factory-tool-board.webp');t.colorSpace=THREE.SRGBColorSpace;
const board=new THREE.Mesh(new THREE.PlaneGeometry(2,1.30078125),new THREE.MeshBasicMaterial({map:t,alphaTest:.5,transparent:false,depthTest:true,depthWrite:true,side:THREE.FrontSide}));board.position.set(0,.75,.32);s.add(board);
function draw(){const w=host.clientWidth,h=host.clientHeight,aspect=w/h,span=Math.max(6,9/aspect);cam.left=-span*aspect/2;cam.right=span*aspect/2;cam.top=span/2;cam.bottom=-span/2;cam.position.set(0,front?2.5:10.5,front?12:6.24);cam.lookAt(0,2.5,0);cam.updateProjectionMatrix();r.setSize(w,h,false);r.render(s,cam);document.querySelector('#status').textContent=(front?'Прямой вид':'Ракурс игры (Y:Z=1:0,78)')+' · текстура загружена · щит ниже трубы';}
document.querySelector('#front').onclick=()=>{front=true;draw()};document.querySelector('#game').onclick=()=>{front=false;draw()};window.addEventListener('resize',draw);draw();
</script></html>
