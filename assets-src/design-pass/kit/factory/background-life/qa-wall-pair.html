<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Завод — табличка и часы</title><style>body{margin:0;background:#e9e5d8;color:#263b3c;font:16px system-ui}main{max-width:850px;margin:auto;padding:16px}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0;line-height:1.4}.row{display:flex;gap:8px;flex-wrap:wrap}button{padding:9px 12px;font:inherit}#scene{height:330px;width:100%;background:#d6d6ce;border-radius:12px;overflow:hidden}canvas{display:block}.asset{display:block;max-width:100%;max-height:240px;margin:10px auto;background:#c9c9be}small{display:block} @media(max-width:500px){main{padding:10px}h1{font-size:20px}#scene{height:280px}}</style><main><h1>Завод · табличка и часы</h1><p>Стеновой фрагмент по размерам исходного кода. Проверка полной игры остаётся интегратору.</p><div class="row"><button id="signs">Табличка</button><button id="old">Часы — старое крепление</button><button id="clock">Часы — новое крепление</button><button id="ring">Звонок</button><button id="view">Прямой / игровой вид</button></div><div id="scene" aria-label="Проверка предметов на задней стене"></div><p id="status">Загрузка…</p><img class="asset" id="asset" alt="Текущая настенная картинка"><small>Новые часы: центр (0;3,4;−25,30), плоскость1,4×1,4. Стрелка остаётся отдельной. Табличка: (−8;0,9;−25,38), плоскость2,4×0,8015625.</small></main><script type="module">
import * as T from 'three';
const host=document.querySelector('#scene'),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=T.SRGBColorSpace;host.append(r.domElement);
const scene=new T.Scene();scene.background=new T.Color('#d6d6ce');const cam=new T.OrthographicCamera(-5,5,3,-3,.1,100);let front=false,mode='signs',phase=0;
const mat=color=>new T.MeshBasicMaterial({color});function m(geo,color,xyz,parent=scene){const o=new T.Mesh(geo,mat(color));o.position.set(...xyz);parent.add(o);return o;}
m(new T.BoxGeometry(10,5,.6),'#e8dcc4',[0,2.5,0]);for(const x of [-4,4])m(new T.BoxGeometry(5,1.6,.1),'#9fd0e8',[x,3.4,.35]);m(new T.BoxGeometry(10,.02,4),'#b3b0a5',[0,-.01,1.7]);const pipe=m(new T.CylinderGeometry(.18,.18,10,12),'#9aa3ad',[0,2.2,.7]);pipe.rotation.z=Math.PI/2;
const textures=await Promise.all(['factory-safety-signs','factory-wall-clock'].map(async name=>{const t=await new T.TextureLoader().loadAsync('/textures/kit/factory/'+name+'.webp');t.colorSpace=T.SRGBColorSpace;return t;}));
const pic=(i,w,h)=>new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:textures[i],alphaTest:.5,depthWrite:true,side:T.FrontSide}));
const sign=pic(0,2.4,.8015625);sign.position.set(0,.9,.32);scene.add(sign);
const fresh=new T.Group();fresh.position.set(0,3.4,.4);fresh.add(pic(1,1.4,1.4));scene.add(fresh);
function hand(parent){const g=new T.Group();g.position.z=.08;m(new T.BoxGeometry(.05,.45,.03),'#18213d',[0,.2,0],g);parent.add(g);return g;}
const newHand=hand(fresh),oldRoot=new T.Group();oldRoot.position.z=.1;scene.add(oldRoot);const oldFace=new T.Group();oldFace.position.y=2.6;oldRoot.add(oldFace);const dial=m(new T.CylinderGeometry(.6,.6,.12,24),'#ffffff',[0,0,0],oldFace);dial.rotation.x=Math.PI/2;m(new T.TorusGeometry(.6,.07,8,24),'#d8483c',[0,0,0],oldFace);hand(oldFace);for(const x of [-.38,.38])m(new T.SphereGeometry(.17,12,8,0,Math.PI*2,0,Math.PI/2),'#e0b040',[x,.62,0],oldFace);m(new T.BoxGeometry(.15,2.3,.15),'#8a90a0',[0,1.15,0],oldRoot);
function draw(){sign.visible=mode==='signs';fresh.visible=mode==='clock';oldRoot.visible=mode==='old';fresh.rotation.z=Math.sin(phase*60)*.12*Math.max(0,1-phase/1.6);fresh.position.y=3.4+Math.abs(Math.sin(phase*30))*.08*Math.max(0,1-phase/1.6);newHand.rotation.z=-phase*8;const w=host.clientWidth,h=host.clientHeight,aspect=w/h,span=Math.max(6,10.5/aspect);cam.left=-span*aspect/2;cam.right=span*aspect/2;cam.top=span/2;cam.bottom=-span/2;cam.position.set(0,front?2.5:10.5,front?12:6.24);cam.lookAt(0,2.5,0);cam.updateProjectionMatrix();r.setSize(w,h,false);r.render(scene,cam);document.querySelector('#asset').src='/textures/kit/factory/'+(mode==='signs'?'factory-safety-signs':'factory-wall-clock')+'.webp';document.querySelector('#status').textContent=({signs:'Табличка ниже трубы',old:'Исходные часы: геометрия скрыта стеной',clock:'Новое крепление: циферблат и отдельная стрелка перед стеной'})[mode]+' · '+(front?'прямой':'игровой')+' вид'+(phase?' · фаза звонка':'');}
for(const key of ['signs','old','clock'])document.querySelector('#'+key).onclick=()=>{mode=key;phase=0;draw()};document.querySelector('#view').onclick=()=>{front=!front;draw()};document.querySelector('#ring').onclick=()=>{mode='clock';phase=phase?0:.35;draw()};window.addEventListener('resize',draw);draw();
</script></html>
