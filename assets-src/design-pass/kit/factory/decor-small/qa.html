<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поддон и три бочки · QA</title>

<style>body{margin:0;background:#e8e4dd;color:#172239;font:14px system-ui}header,main{max-width:1100px;padding:12px;margin:auto}h1{font-size:22px;margin:0 0 8px}nav{display:flex;flex-wrap:wrap;gap:12px}a{color:#125f59}p{line-height:1.4}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:0;min-width:0}figcaption{padding:8px 0;line-height:1.5}.stage{position:relative;height:360px;overflow:hidden;background:#fff;border:1px solid #c7c2b9}.dark{background:#14202d}.floor{background-image:var(--floor);background-size:560px 560px}.sprite{position:absolute;left:50%;bottom:18px;height:auto;display:block;max-width:none;transform:translate(calc(-100% * var(--anchor-x)),calc(100% * (1 - var(--anchor-y))))}.small-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.small-grid .stage{height:200px}.small-label{font-size:12px;text-align:center;padding:5px}.small-title{grid-column:1/-1;margin:0}.note{font-size:12px;margin:8px 0}#summary{font-size:12px}@media(max-width:600px){header,main{padding:10px}main{grid-template-columns:1fr}h1{font-size:19px}.stage{height:340px}}</style>
<header><h1>Поддон и три бочки · фактические WebP</h1><nav><a href="?view=white">Белый фон</a><a href="?view=dark">Тёмный фон</a><a href="?view=floor">Пол цеха</a><a href="?view=small">32 / 70 px на единицу</a></nav><p class="note">Крупный просмотр контура и прозрачности. Игровой масштаб — в режиме 32 / 70.</p><p id="summary"></p></header><main id="main"></main>
<script type="module">
const [m,refs]=await Promise.all(['manifest.json','references.json'].map(p=>fetch(p,{cache:'no-store'}).then(r=>r.json()))),view=new URLSearchParams(location.search).get('view')??'white',floor=refs.find(r=>r.path.endsWith('factory-floor-b.webp'));document.documentElement.style.setProperty('--floor','url("/'+floor.path+'?v='+floor.sha256+'")');const bg=new Image();bg.src='/'+floor.path+'?v='+floor.sha256;await bg.decode();
summary.textContent=m.totalBytes+' bytes · исходная прозрачность · без добавленной тени';
for(const a of m.assets){const figure=document.createElement('figure'),caption=document.createElement('figcaption');caption.textContent=a.name+' · '+a.size.join('×')+' · видимая ширина '+a.visibleWorldWidth+' ед.';const src='/'+a.path+'?v='+a.sha256,decoded=new Image();decoded.src=src;await decoded.decode();
 function panel(ppu=null){const stage=document.createElement('div'),img=document.createElement('img');stage.className='stage '+(view==='small'||view==='floor'?'floor':view==='dark'?'dark':'');if(ppu)stage.style.backgroundSize=(8*ppu)+'px '+(8*ppu)+'px';img.src=src;img.alt=a.name;img.className='sprite';img.dataset.asset=a.name;img.dataset.ppu=ppu??'preview';img.style.width=(ppu?a.rectangleWorldSize[0]*ppu:300)+'px';img.style.setProperty('--anchor-x',a.anchor.normalisedTopLeft[0]);img.style.setProperty('--anchor-y',a.anchor.normalisedTopLeft[1]);stage.append(img);return stage;}
 if(view==='small'){const group=document.createElement('div');group.className='small-grid';for(const ppu of [32,70]){const f=document.createElement('figure'),label=document.createElement('div');label.className='small-label';label.textContent=ppu+' px/ед. · '+(a.visibleWorldWidth*ppu).toFixed(1)+' видимых px';f.append(panel(ppu),label);group.append(f);}figure.append(group,caption);}else figure.append(panel(),caption);main.append(figure);
}await Promise.all(Array.from(document.images).map(i=>i.decode()));document.body.dataset.ready='true';
</script></html>
