import * as T from 'three';import{Stage}from'/src/stage.ts';import{World}from'/src/world.ts';import{FactoryMap,FACTORY_MODELS}from'/src/factory.ts';import{loadModels,hasModel}from'/src/parts/assets.ts';import{loadKit,kitPieces,cards}from'/src/kit.ts';import{loadGround}from'/src/ground.ts';
const q=new URLSearchParams(location.search),fallback=q.has('fallback'),canvas=document.querySelector('canvas'),d=await(await fetch('./placement.json')).json();const found=new Map(),buckets=[],markers=new T.Group();markers.visible=false;let stage,map,art,loaded=false,view='all',version='new',shadow='real';
const candidates=[-40.5,-20.25,0,20.25,40.5].flatMap(x=>[-21.6,10.8].map(z=>[x,z]));const gold=new T.Color('#f2c230');
function selectGeometry(g,ids){const out=new T.BufferGeometry();for(const[name,a]of Object.entries(g.attributes)){const values=new a.array.constructor(ids.length*a.itemSize);ids.forEach((i,j)=>{for(let c=0;c<a.itemSize;c++)values[j*a.itemSize+c]=a.array[i*a.itemSize+c]});out.setAttribute(name,new T.BufferAttribute(values,a.itemSize,a.normalized));}out.computeBoundingBox();out.computeBoundingSphere();return out;}

function render(reframe=false){if(!loaded)return;stage.checkSize();const active=version==='new'&&!!art;for(const b of buckets){b.mesh.geometry=active?b.keep:b.original;b.proxy.visible=active;b.proxy.castShadow=shadow==='real';if(!active&&shadow==='none'){b.mesh.geometry=b.keep;b.proxy.visible=false;}}if(art)art.visible=active;
if(reframe){const selected=view==='all'?[...found.values()]:[[...found.values()][+view]];const pts=selected.flatMap(s=>[new T.Vector3(s.x-2,0,s.z-6.5),new T.Vector3(s.x+2,0,s.z+2)]);stage.frame(pts,true,92);if(view!=='all'&&innerWidth>=800){const s=selected[0];stage.setDistance(stage.distance*stage.pixelsPerUnit(new T.Vector3(s.x,0,s.z))/92);}}
for(let i=0;i<8;i++)stage.render();const rows=[...found.values()].map((s,i)=>{let anchor=null;if(art){const mesh=art.children[0],im=new T.Matrix4();mesh.getMatrixAt(i,im);anchor=new T.Vector3(d.at[0]/1024-.5+d.translate[0],(1-d.at[1]/768)*.75+d.translate[1],0).applyMatrix4(im).applyMatrix4(mesh.matrixWorld);}return{...s,anchor:anchor?.toArray(),anchorError:anchor?.distanceTo(new T.Vector3(s.x,0,s.z+.4)),projected:project(new T.Vector3(s.x,0,s.z+.4))}});const data={loaded,fallback,view,version,shadow,viewport:[innerWidth,innerHeight],overflow:document.documentElement.scrollWidth>innerWidth,quality:stage.quality,dpr:stage.renderer.getPixelRatio(),allModelsLoaded:FACTORY_MODELS.every(hasModel),columns:rows,artReady:!!art,artVisible:art?.visible||false,cardCastShadow:art?.children.map(m=>m.castShadow),buckets:buckets.map(b=>({originalTriangles:b.original.attributes.position.count/3,keptTriangles:b.keep.attributes.position.count/3,removedTriangles:b.only.attributes.position.count/3,proxyVisible:b.proxy.visible,proxyCast:b.proxy.castShadow,proxyColorWrite:b.proxy.material.colorWrite,proxyDepthWrite:b.proxy.material.depthWrite,unaffectedAttributesExact:b.unaffectedExact,shadowAttributesExact:b.shadowExact})),pickables:map.life.pickables().length,ppu:view==='all'?null:stage.pixelsPerUnit(new T.Vector3(rows[+view].x,0,rows[+view].z)),limits:'actual FactoryMap; fixture extracts only exact original pillar triangles after bake, no src changes; not Input/story/iPad/global occlusion'};document.body.dataset.result=JSON.stringify(data);document.querySelector('#status').textContent=`${rows.length} колонн · ${version} · ${shadow} · ${innerWidth}×${innerHeight}`;}
try{await loadGround();await loadKit('factory');await loadKit('farm',['blob-shadow']);await loadModels(FACTORY_MODELS);stage=new Stage(canvas);stage.renderer.setPixelRatio(1);stage.setInsets({top:8,bottom:8,left:8,right:8});const world=new World(stage);map=new FactoryMap(stage,world,{say(){},cheer(){},done(){},chime(){}});map.start();map.update(0);map.scenery.updateMatrixWorld(true);const originals=[];map.scenery.traverse(o=>{if(o.isMesh&&!o.isInstancedMesh&&!o.material.map&&o.geometry.attributes.color&&!o.geometry.index)originals.push(o)});
for(const m of originals){const g=m.geometry,p=g.attributes.position,c=g.attributes.color,keep=[],only=[];for(let t=0;t<p.count;t+=3){let spot=null;for(const[x,z]of candidates){let matches=true;for(let j=0;j<3;j++){const v=new T.Vector3().fromBufferAttribute(p,t+j).applyMatrix4(m.matrixWorld);if(Math.abs(Math.abs(v.x-x)-.4)>1e-5||Math.abs(Math.abs(v.z-z)-.4)>1e-5||Math.min(Math.abs(v.y),Math.abs(v.y-5))>1e-5||Math.abs(c.getX(t+j)-gold.r)>1e-6||Math.abs(c.getY(t+j)-gold.g)>1e-6||Math.abs(c.getZ(t+j)-gold.b)>1e-6){matches=false;break;}}if(matches){spot={x,z};break;}}if(spot){only.push(t,t+1,t+2);const key=spot.x+','+spot.z;if(!found.has(key))found.set(key,{...spot,triangles:0});found.get(key).triangles++;}else keep.push(t,t+1,t+2);}
if(only.length){const kept=selectGeometry(g,keep),removed=selectGeometry(g,only),mt=m.material.clone();mt.colorWrite=false;mt.depthWrite=false;const proxy=new T.Mesh(removed,mt);proxy.matrixAutoUpdate=false;proxy.matrix.copy(m.matrix);proxy.castShadow=true;proxy.raycast=()=>{};m.parent.add(proxy);let unaffectedExact=true,shadowExact=true;for(const[name,a]of Object.entries(g.attributes)){keep.forEach((v,i)=>{for(let c=0;c<a.itemSize;c++)if(a.array[v*a.itemSize+c]!==kept.attributes[name].array[i*a.itemSize+c])unaffectedExact=false});only.forEach((v,i)=>{for(let c=0;c<a.itemSize;c++)if(a.array[v*a.itemSize+c]!==removed.attributes[name].array[i*a.itemSize+c])shadowExact=false});}buckets.push({mesh:m,original:g,keep:kept,only:removed,proxy,unaffectedExact,shadowExact});}}
if(!found.size||[...found.values()].some(s=>s.triangles!==12))throw Error('Unexpected pillar topology '+JSON.stringify([...found.values()]));const tex=fallback?null:kitPieces('factory','factory-pillar-painted')[0];if(tex){art=cards([...found.values()].map(s=>({x:s.x,z:s.z+.4,size:d.fullWidth})),[tex]);for(const m of art.children){m.geometry.translate(...d.translate);m.raycast=()=>{};}map.scenery.add(art);}const sel=document.querySelector('#view');[...found.values()].forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}: ${s.x}, ${s.z}`;sel.append(o);const dot=new T.Mesh(new T.SphereGeometry(.06,8,6),new T.MeshBasicMaterial({color:'#ff1060',depthTest:false}));dot.position.set(s.x,0,s.z+.4);dot.renderOrder=90;markers.add(dot)});stage.world.add(markers);loaded=true;sel.onchange=e=>{view=e.target.value;render(true)};document.querySelector('#version').onchange=e=>{version=e.target.value;render()};document.querySelector('#shadow').onchange=e=>{shadow=e.target.value;render()};document.querySelector('#anchors').onclick=()=>{markers.visible=!markers.visible;render()};addEventListener('resize',()=>render(true));render(true);}catch(e){document.body.dataset.error=e.stack;document.querySelector('#status').textContent=e.message;console.error(e)}
</script></html>
