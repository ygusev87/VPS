<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}canvas{display:block;width:100vw;height:100vh}</style><canvas></canvas><script type="module">
import * as T from 'three';
const kind='pillar';const d={dimensions:[.8,5,.8],yaw:0};const g=new T.Mesh(new T.BoxGeometry(.8,5,.8),new T.MeshStandardMaterial({color:'#f2c230',roughness:.6}));g.position.y=2.5;
const scene=new T.Scene();scene.background=new T.Color('#eeeae2');scene.add(g);const r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});r.setPixelRatio(1);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.NeutralToneMapping;scene.add(new T.HemisphereLight(0xffffff,0x7b7c75,1.2));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(-7,12,5);scene.add(sun);const camera=new T.OrthographicCamera();const view=new T.Vector3(0,1,.78).normalize();
function render(){r.setSize(innerWidth,innerHeight);const b=new T.Box3().setFromObject(g),center=b.getCenter(new T.Vector3());camera.position.copy(center).addScaledVector(view,20);camera.lookAt(center);camera.updateMatrixWorld(true);const corners=[];for(const x of[b.min.x,b.max.x])for(const y of[b.min.y,b.max.y])for(const z of[b.min.z,b.max.z])corners.push(new T.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse));const bx=new T.Box3().setFromPoints(corners),aspect=innerWidth/innerHeight,hh=Math.max((bx.max.y-bx.min.y)/2,(bx.max.x-bx.min.x)/2/aspect)*1.2;camera.left=-hh*aspect;camera.right=hh*aspect;camera.top=hh;camera.bottom=-hh;camera.near=.01;camera.far=100;camera.updateProjectionMatrix();r.render(scene,camera);function px(v){const p=v.project(camera);return[(p.x+1)*innerWidth/2,(1-p.y)*innerHeight/2]};const actual=new T.Box3().setFromObject(g,true);document.body.dataset.result=JSON.stringify({actualBounds:{min:actual.min.toArray(),max:actual.max.toArray(),size:actual.getSize(new T.Vector3()).toArray()},kind,...d,view:view.toArray(),bounds:{min:b.min.toArray(),max:b.max.toArray(),size:b.getSize(new T.Vector3()).toArray()},frontAnchor:px(new T.Vector3(0,0,b.max.z)),centerAnchor:px(new T.Vector3(0,0,0)),ppu:innerHeight/(2*hh),viewport:[innerWidth,innerHeight]});}addEventListener('resize',render);render();
</script></html>
