<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory primary references</title><style>*{box-sizing:border-box}body{margin:0;background:#ece7dc;font:15px system-ui;color:#263a3a}header{padding:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}select{font:inherit;padding:8px}main{padding:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border:1px solid #d6cdbb;padding:8px}.card img{display:block;width:100%;height:230px;object-fit:contain}.card p{margin:6px}#single img{display:block;width:100%;max-height:530px;object-fit:contain;background:white}#status{font:12px monospace;padding:10px}h1{font-size:17px;margin:0}@media(max-width:600px){.grid{grid-template-columns:1fr}.card img{height:230px}#single img{max-height:440px}}</style><header><h1>Корпуса станков — референсы будущих GLB</h1><label>Вид <select id="model"><option value="all">Все4</option><option value="factory-cabinet">Щиток: пустой лоток</option><option value="safety-press">Пресс: пустая рама</option><option value="lathe">Токарный: пустой пролёт</option><option value="hoist">Подъёмник: без кабины</option></select></label></header><main><div id="all" class="grid"></div><div id="single" hidden><img alt="Selected factory body"><p></p></div><p>Это изображения для изготовления3D, не игровые модели. Подвижные детали будут отдельными. Внешних3D-заказов ещё нет.</p></main><div id="status"></div><script>
const specs=[['factory-cabinet','Горизонтальный лоток под2×2; дверца отдельно/кодом.'],['safety-press','Статичная рама и наковальня; нет ползуна и кнопок.'],['lathe','Станина, бабки; нет заготовки/шпинделя/стрелки.'],['hoist','Шахта, направляющие, сетка; нет кабины.']];const errors=[];let loaded=0;
function status(){document.querySelector('#status').textContent=JSON.stringify({mode:document.querySelector('select').value,viewport:[innerWidth,innerHeight],scroll:document.documentElement.scrollWidth,loaded,errors})}
for(const [n,t] of specs){const d=document.createElement('div');d.className='card';const im=new Image;im.alt=n;im.src='/previews/'+n+(['lathe','factory-cabinet'].includes(n)?'-v2':'')+'.webp';im.onload=()=>{loaded++;status()};im.onerror=()=>{errors.push(n);status()};const p=document.createElement('p');p.textContent=n+' — '+t;d.append(im,p);document.querySelector('#all').append(d)}
document.querySelector('select').onchange=e=>{const v=e.target.value,a=document.querySelector('#all'),s=document.querySelector('#single');a.hidden=v!=='all';a.style.display=v==='all'?'grid':'none';s.hidden=v==='all';if(v!=='all'){const im=s.querySelector('img');im.onload=status;im.src='/previews/'+v+(['lathe','factory-cabinet'].includes(v)?'-v2':'')+'.webp';im.alt=v;s.querySelector('p').textContent=specs.find(x=>x[0]===v)[1]}status()};window.onresize=status;window.onerror=m=>{errors.push(String(m));status()};
</script></html>
