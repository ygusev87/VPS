<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Завод — полосы и масло</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#eeeade;color:#202734;font:14px system-ui}h1{font-size:20px;margin:0 0 6px}p{margin:5px 0}button,select{font:inherit;padding:6px}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.card{background:#faf7ef;border:1px solid #bab5a9;border-radius:8px;padding:8px;flex:1;min-width:100px}.sample{position:relative;overflow:hidden;height:408px;background:#e2e0d6}.strip{height:100%;margin:auto;background-repeat:repeat-y;background-size:100% var(--period);background-image:var(--image);width:var(--width)}.guide{position:absolute;top:var(--period);width:100%;border-top:1px dotted #e34545;pointer-events:none}.oil{height:230px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap}.oil img{width:50%;height:100%;object-fit:contain}.floor .sample{background:#e2e0d6 url('/public/textures/kit/factory/factory-floor-a.webp') center/400px}.dark .sample{background:#25323b}.white .sample{background:#fff}.overview{--scale:32}.detail{--scale:70}.note{font-size:12px;color:#565b62}.oilset{display:grid;grid-template-columns:1fr 1fr;gap:10px}.oilset .card{min-width:0}@media(max-width:500px){.row{gap:4px}.card{padding:4px}h2{font-size:14px}.oilset{grid-template-columns:1fr}.sample{height:408px}.oil{height:180px}}
</style><body class="floor detail"><h1>Завод · разметка, рельсы, масло</h1><header><label>Фон <select id="bg"><option value="floor">Пол цеха</option><option value="white">Белый</option><option value="dark">Тёмный</option></select></label><label>Масштаб <select id="scale"><option value="detail">70 px / ед.</option><option value="overview">32 px / ед.</option></select></label><label>Вид <select id="view"><option value="all">Все</option><option value="strips">Полосы</option><option value="oil">Масло</option></select></label><button id="lines">Скрыть метки шва</button><span id="dimensions"></span></header><p class="note">Пунктир отмечает только место повтора; сами пиксели ассетов не меняются. Это статическая приёмка, не игровой кадр.</p><div class="row" id="strips"></div><div class="oilset"><div class="card"><h2>Масло · текущий фон</h2><div class="sample oil"><img src="/public/textures/kit/factory/oil-patch-a.webp"><img src="/public/textures/kit/factory/oil-patch-b.webp"></div></div><div class="card"><h2>Масло · близко</h2><div class="sample oil"><img style="width:100%" src="/public/textures/kit/factory/oil-patch-a.webp"></div></div></div><script>
const rows=[['walkway-strip','Дорожка',1.76,6.4],['hazard-strip','Опасная зона',.336,4.36],['rail-strip','Колея 0,7',.7*412/226.5,4.2]];let guides=true;
function draw(){const s=document.getElementById('scale').value==='detail'?70:32;document.body.className=document.getElementById('bg').value+' '+document.getElementById('scale').value;document.getElementById('strips').innerHTML=rows.map(([n,t,w,p])=>`<div class="card"><h2>${t}</h2><p class="note">${n}</p><div class="sample" style="--period:${p*s}px;--width:${w*s}px;--image:url('/public/textures/kit/factory/${n}.webp')"><div class="strip"></div>${guides?'<i class="guide"></i>':''}</div></div>`).join('');document.getElementById('strips').style.display=document.getElementById('view').value==='oil'?'none':'flex';document.querySelector('.oilset').style.display=document.getElementById('view').value==='strips'?'none':'grid';document.getElementById('dimensions').textContent=innerWidth+'×'+innerHeight;}document.getElementById('view').onchange=draw;document.getElementById('bg').onchange=draw;document.getElementById('scale').onchange=draw;document.getElementById('lines').onclick=()=>{guides=!guides;draw()};onresize=draw;draw();
</script></body></html>
