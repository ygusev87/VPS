<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Завод — стеллаж и погрузчик</title><style>*{box-sizing:border-box}body{font:14px system-ui;margin:0;padding:12px;background:#eeeade;color:#26313b}h1{font-size:20px;margin:0 0 8px}h2{font-size:17px}select{font:inherit;padding:5px}header{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.card{padding:8px;border:1px solid #b5b0a4;border-radius:8px;background:#faf7ef}.large,.small{background:#e2e0d6 url('/public/textures/kit/factory/factory-floor-a.webp') center/400px;display:flex;align-items:flex-end;justify-content:center;gap:16px}.large{height:280px}.large img{max-height:265px;max-width:96%;object-fit:contain}.small{height:155px;align-items:center}.white .large,.white .small{background:#fff}.dark .large,.dark .small{background:#25323b}.small img{max-width:none;height:auto;flex:none}p{margin:5px 0;color:#51565e;font-size:12px}@media(max-width:600px){.gallery{grid-template-columns:1fr}.large{height:240px}.large img{max-height:230px}.small{height:155px}.card{padding:6px}}</style><body class="floor"><h1>Завод · складской декор</h1><header><label>Фон <select id="bg"><option value="floor">Пол цеха</option><option value="white">Белый</option><option value="dark">Тёмный</option></select></label><label>Карточка <select id="which"><option value="all">Обе</option><option value="rack-steel-card">Стеллаж</option><option value="forklift-card">Погрузчик</option></select></label><span id="dims"></span></header><p>Внизу —32 и70px/ед. Прозрачность исходная. Это приёмка ассетов, не игровой кадр.</p><main class="gallery" id="gallery"></main><script>
let rows=[];const names={'rack-steel-card':'Стеллаж ·3,2ед.','forklift-card':'Погрузчик ·3,1ед.'};function draw(){document.body.className=document.getElementById('bg').value;const choice=document.getElementById('which').value;document.getElementById('gallery').innerHTML=rows.filter(r=>choice==='all'||r.name===choice).map(r=>`<section class="card"><h2>${names[r.name]}</h2><p>${r.width}×${r.height} · ${r.bytes}B</p><div class="large"><img src="/${r.output}" alt="${names[r.name]}"></div><p>32px/ед. и70px/ед.; низ по видимой альфе</p><div class="small"><img style="width:${r.recommendedCardSize*32}px" src="/${r.output}"><img style="width:${r.recommendedCardSize*70}px" src="/${r.output}"></div></section>`).join('');document.getElementById('dims').textContent=innerWidth+'×'+innerHeight}fetch('manifest.json').then(r=>r.json()).then(m=>{rows=m.images;draw()});document.getElementById('bg').onchange=draw;document.getElementById('which').onchange=draw;onresize=draw;</script></body></html>
