const query=new URLSearchParams(location.search);let zoom=92;let view=query.get('view')||'west',version=query.get('version')||'new',stage,map,world,loaded=false;const fallback=query.has('fallback'),all=[],events=[],markers=new T.Group();markers.visible=false;const defs=(await(await fetch('./placement.json')).json()).definitions;const canvas=document.querySelector('canvas');document.querySelector('#view').value=view;document.querySelector('#version').value=version;

stage.world.add(markers);loaded=true;document.querySelector('#view').onchange=e=>{view=e.target.value;render(true)};document.querySelector('#version').onchange=e=>{version=e.target.value;render()};document.querySelector('#zoom').onchange=e=>{zoom=+e.target.value;render(true)};document.querySelector('#anchor').onclick=()=>{markers.visible=!markers.visible;render()};document.querySelector('#power').onchange=e=>{const mode=e.target.value;map.panel.hum=mode==='green'?1:0;map.box.closed=mode==='green';map.phase=mode.startsWith('amber')?'evening':'day';map.eveLit=false;map.time=mode==='amber-on'?.2:.8;for(let i=0;i<60;i++)map.tick(1/60);if(mode==='off')for(const l of map.cabinetLamps)l.m.emissiveIntensity=0;events.push({event:'fixture-power',mode});render()};document.querySelector('#advance').onclick=()=>{map.life.update(.175,0);map.tick(.175);events.push({event:'life-update',dt:.175});render()};document.querySelector('#rest').onclick=()=>{map.life.update(1.7,0);map.tick(1.7);events.push({event:'life-update',dt:1.7});render()};canvas.onpointerdown=e=>{const rect=canvas.getBoundingClientRect(),ray=new T.Raycaster();ray.setFromCamera(new T.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1),stage.camera);const hits=ray.intersectObjects(map.life.pickables(),false);const hit=hits[0];events.push({event:'pointer',xy:[e.clientX,e.clientY],hit:hit?.object.uuid,hitName:hit?.object.name,accepted:hit?map.life.tap(hit.object):false});render()};addEventListener('resize',()=>render(true));for(let i=0;i<60;i++)map.tick(1/60);render(true);}catch(e){document.body.dataset.error=e.stack;document.querySelector('#status').textContent=e.message;console.error(e)}
