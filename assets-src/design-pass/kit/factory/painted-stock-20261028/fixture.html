<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Склад цеха · первая рисованная партия</title><style>body{margin:0;font:13px system-ui;background:#ece0ca;color:#263e31}header{height:96px;padding:8px;box-sizing:border-box}select,button{padding:5px;margin:2px}canvas{display:block;width:100%;height:calc(100vh - 96px)}#status{font-size:11px}@media(max-width:600px){header{height:124px}canvas{height:calc(100vh - 124px)}}</style><header><b>Рисованный склад · реальный FactoryMap / Stage</b><br><select id="view" aria-label="Предмет"><option value="rack">Стеллаж</option><option value="pallet">Поддон с ящиками</option><option value="barrels">Бочки</option><option value="whole">Весь цех</option></select><select id="version" aria-label="Версия"><option value="new">Новая камера</option><option value="old">Прежний рисунок</option></select><button id="anchor">Показать основания</button><div id="status">Загрузка…</div></header><canvas></canvas><script type="module">
import * as T from 'three';import{Stage}from'/src/stage.ts';import{World}from'/src/world.ts';import{FactoryMap,FACTORY_MODELS}from'/src/factory.ts';import{loadModels,hasModel}from'/src/parts/assets.ts';import{loadKit,kitPieces,cards,patches}from'/src/kit.ts';import{loadGround}from'/src/ground.ts';
const query=new URLSearchParams(location.search);let view=query.get('view')||'rack',version=query.get('version')||'new',stage,map,world,loaded=false;const oldGroups=new Set(),newGroups=[],markers=new T.Group(),all=[];markers.visible=false;const ny=1/Math.hypot(1,.78),nz=.78/Math.hypot(1,.78);const defs={rack:{old:'rack-steel-card',w:1024,h:768,span:869,anchor:[512.5,604],depth:1.4,referenceWidth:5.5},pallet:{old:'pallet-card',w:768,h:576,span:489,anchor:[384.5,519],depth:1.7,referenceWidth:2.4},barrels:{old:'barrels-card',w:768,h:576,span:428,anchor:[384,526],depth:2.3,referenceWidth:2.6}};
document.querySelector('#view').value=view;document.querySelector('#version').value=version;
function addNewBatch(kind,spots){const d=defs[kind],tex=kitPieces('factory','factory-'+kind+'-painted')[0];if(!tex)throw Error('Missing '+kind);const dx=.5-d.anchor[0]/d.w,dy=(d.anchor[1]/d.h-1)*d.h/d.w;const g=cards(spots.map(s=>({...s,size:s.size*d.w/d.span})),[tex]);g.children[0].geometry.translate(dx,dy,0);map.scenery.add(g);newGroups.push(g);const blob=kitPieces('farm','blob-shadow')[0];if(blob){const shadow=patches(spots.map(s=>({x:s.x+s.size*.08,z:s.z-d.depth*s.size/d.referenceWidth*.25,size:s.size*.55})),[blob],.009,3);map.scenery.add(shadow);newGroups.push(shadow);}for(const spot of spots){const w=spot.size*d.w/d.span,h=w*d.h/d.w,ax=(d.anchor[0]/d.w-.5)*w,ay=(1-d.anchor[1]/d.h)*h;const pin=new T.Mesh(new T.SphereGeometry(.05,12,8),new T.MeshBasicMaterial({color:'#ff1654',depthTest:false}));pin.position.set(spot.x,.025,spot.z);pin.renderOrder=80;markers.add(pin);const anchorWorld=new T.Vector3(ax+dx*w,ay+dy*w,0).applyQuaternion(new T.Quaternion().setFromUnitVectors(new T.Vector3(0,0,1),new T.Vector3(0,ny,nz))).add(new T.Vector3(spot.x,0,spot.z));all.push({kind,...spot,canvasWidth:w,canvasHeight:h,geometryAnchorOffset:[dx,dy,0],groupY:0,cardSpot:[spot.x,spot.z],anchorWorld:anchorWorld.toArray(),anchorError:anchorWorld.distanceTo(new T.Vector3(spot.x,0,spot.z))});}}

function render(){if(!loaded)return;stage.checkSize();oldGroups.forEach(g=>g.visible=version==='old');newGroups.forEach(g=>g.visible=version==='new');const selected=all.filter(p=>p.kind===view);const s=selected[0];let pts;if(view==='whole')pts=[new T.Vector3(-54,0,-35),new T.Vector3(54,0,35)];else{const width=s.size+2.4,depth=defs[view].depth*s.size/defs[view].referenceWidth;pts=[new T.Vector3(s.x-width/2,0,s.z-depth-3.5),new T.Vector3(s.x+width/2,0,s.z+1.6)];}stage.frame(pts,true,92);if(view!=="whole"&&innerWidth>=800){const at=new T.Vector3(s.x,0,s.z);stage.setDistance(stage.distance*stage.pixelsPerUnit(at)/92);}for(let i=0;i<6;i++)stage.render();const data={loaded,view,version,viewport:[innerWidth,innerHeight],overflow:document.documentElement.scrollWidth>innerWidth,quality:stage.quality,pixelRatio:stage.renderer.getPixelRatio(),ppu:stage.pixelsPerUnit(new T.Vector3(s?.x||0,0,s?.z||0)),allModelsLoaded:FACTORY_MODELS.every(hasModel),missingModels:FACTORY_MODELS.filter(n=>!hasModel(n)),anchorsVisible:markers.visible,cardBatches:newGroups.filter((_,i)=>i%2===0).map(g=>({instances:g.children[0].count})),instances:all,selected:s,sourceMode:'actual FactoryMap with only fixture substitutions; no gameplay Input or electrical run'};document.body.dataset.result=JSON.stringify(data);document.querySelector('#status').textContent=`${view} · ${version} · ${innerWidth}×${innerHeight} · ${data.ppu.toFixed(1)}px/ед. · экземпляров ${all.length} · Δ опор ${Math.max(...all.map(p=>p.anchorError)).toExponential(1)}`;}
try{await loadGround();await loadKit('factory');await loadKit('farm',['blob-shadow']);await loadModels(FACTORY_MODELS);stage=new Stage(document.querySelector('canvas'));stage.renderer.setPixelRatio(1);stage.setInsets({top:8,bottom:8,left:8,right:8});world=new World(stage);map=new FactoryMap(stage,world,{say(){},cheer(){},done(){},chime(){}});map.start();map.update(0);map.scenery.updateMatrixWorld(true);const pending=[];map.scenery.traverse(o=>{if(!o.isInstancedMesh)return;for(const[k,d]of Object.entries(defs)){if(o.material?.map!==kitPieces('factory',d.old)[0])continue;oldGroups.add(o.parent.parent);for(let i=0;i<o.count;i++){const m=new T.Matrix4(),p=new T.Vector3(),q=new T.Quaternion(),s=new T.Vector3();o.getMatrixAt(i,m);m.premultiply(o.matrixWorld);m.decompose(p,q,s);pending.push([k,{x:p.x,z:p.z,size:s.x}]);}}});for(const k of Object.keys(defs))addNewBatch(k,pending.filter(([kind])=>kind===k).map(([,spot])=>spot));if(!all.length)throw Error('No existing stock cards');stage.world.add(markers);loaded=true;document.querySelector('#view').onchange=e=>{view=e.target.value;render()};document.querySelector('#version').onchange=e=>{version=e.target.value;render()};document.querySelector('#anchor').onclick=()=>{markers.visible=!markers.visible;render()};addEventListener('resize',render);render();}catch(e){document.body.dataset.error=e.stack;document.querySelector('#status').textContent=e.message;console.error(e)}
</script></html>
