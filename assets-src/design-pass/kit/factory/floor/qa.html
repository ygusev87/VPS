<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пол цеха · повтор и швы</title>
<style>body{margin:0;background:#e9e4da;color:#18213d;font:14px system-ui}header,main{max-width:1100px;margin:auto;padding:12px}h1{font-size:21px;margin:0 0 6px}p{line-height:1.4;margin:5px 0}nav{display:flex;gap:8px;flex-wrap:wrap}a{color:#12615b}figure{margin:0}figcaption{padding:5px;font-size:12px}.square{width:100%;aspect-ratio:1;background-size:50% 50%;background-repeat:repeat}.single{background-size:100% 100%}.phase{background-position:25% 25%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.seam-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.join{height:320px;background-repeat:repeat;background-size:2048px 2048px;background-position:center center}.join.tb{background-position:center center}.legend{font-size:12px}.asset-title{font-weight:600;margin:12px 0 6px}pre{white-space:pre-wrap;font-size:11px}details{margin-top:12px}@media(max-width:600px){header,main{padding:10px}.grid,.seam-grid{grid-template-columns:1fr}h1{font-size:18px}.join{height:280px}}</style>
<header><h1>Пол цеха · фактические WebP</h1><nav><a href="?view=repeat">Повтор 2×2</a><a href="?view=phase">Сдвинутая фаза</a><a href="?view=seams">Стыки 100%</a><a href="?view=single">По одной плитке</a></nav><p id="summary"></p></header><main id="main"></main>
<script type="module">
const m=await fetch('manifest.json',{cache:'no-store'}).then(r=>r.json()),view=new URLSearchParams(location.search).get('view')??'repeat';summary.textContent='2048×2048 · 8×8 игровых единиц · '+m.totalBytes+' bytes суммарно';main.className=view==='seams'?'':'grid';
for(const a of m.assets){const f=document.createElement('figure'),src='/'+a.path+'?v='+a.sha256;const img=new Image();img.src=src;await img.decode();const label=document.createElement('figcaption');label.textContent=a.name+' · '+a.bytes+' bytes';if(view==='seams'){const title=document.createElement('p');title.className='asset-title';title.textContent=a.name;f.append(title);const g=document.createElement('div');g.className='seam-grid';for(const axis of ['lr','tb']){const wrap=document.createElement('figure'),d=document.createElement('div'),c=document.createElement('figcaption');d.className='join '+axis;d.style.backgroundImage='url("'+src+'")';d.style.backgroundPosition=axis==='lr'?'calc(50% + 1024px) center':'center calc(50% + 1024px)';c.textContent=axis==='lr'?'Лево/право: стык по центру':'Верх/низ: стык по центру';d.dataset.asset=a.name;d.dataset.axis=axis;wrap.append(d,c);g.append(wrap);}f.append(g);}else{const d=document.createElement('div');d.className='square '+(view==='single'?'single':view==='phase'?'phase':'');d.style.backgroundImage='url("'+src+'")';d.dataset.asset=a.name;f.append(d,label);}main.append(f);}
document.body.dataset.ready='true';
</script></html>
