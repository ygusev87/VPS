<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Станки · новая ось · GLB</title><style>body{margin:0;background:#eee7db;color:#25313b;font:14px system-ui}header{height:106px;padding:8px;box-sizing:border-box}button{padding:7px;margin:2px}canvas{display:block}#status{font-size:12px}</style><header><b>Новая ось · настоящие GLB</b><br><button id="machine">Станок</button><button id="view">Вид</button><button id="phase">Фаза 0°</button><div id="status">Загрузка…</div></header><script type="module">
import * as T from 'three';
import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';
import {loadModels,model} from '/src/parts/assets.ts';
import {Lathe,ShaftMotor,LATHE_SHAFT_AT} from '/src/parts/workshop.ts';
import {Gear} from '/src/parts/factory.ts';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#eee7db');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x8a7e70,1.5));const light=new T.DirectionalLight(0xffffff,2.4);light.position.set(3,7,5);scene.add(light);const camera=new T.PerspectiveCamera(35,1,.01,100);
let group,lathe,motor,gears,kind='lathe',view=0,phase=0;
function render(){if(!group)return;renderer.setSize(innerWidth,innerHeight-106);camera.aspect=innerWidth/(innerHeight-106);camera.updateProjectionMatrix();const bounds=new T.Box3().setFromObject(group),center=bounds.getCenter(new T.Vector3()),radius=bounds.getSize(new T.Vector3()).length()/2;const half=Math.min(T.MathUtils.degToRad(camera.fov/2),Math.atan(Math.tan(T.MathUtils.degToRad(camera.fov/2))*camera.aspect));const direction=new T.Vector3(...[[-.4,.85,1],[.001,1,.001],[-.25,.24,-1]][view]).normalize();camera.position.copy(center).addScaledVector(direction,radius/Math.sin(half)*1.08);camera.lookAt(center);gears.forEach(g=>g.wheel.rotation.y=phase*Math.PI/2);renderer.render(scene,camera);const axis=lathe.gearAt(),other=motor.gearAt();document.querySelector('#status').textContent=`${kind} · GLB 3/3 · ось ${axis.x.toFixed(2)},${axis.y.toFixed(2)},${axis.z.toFixed(2)} · пара ${axis.distanceTo(other).toFixed(2)} · вид ${view}`;document.querySelector('#phase').textContent=`Фаза ${phase*90}°`;window.fixtureResult={kind,modelsLoaded:true,axis:axis.toArray(),motorAxis:other.toArray(),separation:axis.distanceTo(other),view,phaseDegrees:phase*90,viewport:[innerWidth,innerHeight],overflow:document.documentElement.scrollWidth>innerWidth,assemblyBounds:{min:bounds.min.toArray(),max:bounds.max.toArray()}};}
function build(){if(group)scene.remove(group);group=new T.Group();lathe=new Lathe(kind==='grinder');motor=new ShaftMotor();motor.root.position.set(LATHE_SHAFT_AT.x-1.4,0,LATHE_SHAFT_AT.z+.35);gears=[new Gear(kind==='lathe'?true:'small'),new Gear(kind==='lathe'?'small':true)];gears[0].root.position.set(LATHE_SHAFT_AT.x,0,LATHE_SHAFT_AT.z);gears[1].root.position.set(LATHE_SHAFT_AT.x-1.4,0,LATHE_SHAFT_AT.z);group.add(lathe.root,motor.root,...gears.map(g=>g.root));scene.add(group);render();}
try{await loadModels(['lathe','grinder','shaft-motor']);for(const n of ['lathe','grinder','shaft-motor'])if(!model(n,{}))throw Error('GLB missing: '+n);build();document.querySelector('#machine').onclick=()=>{kind=kind==='lathe'?'grinder':'lathe';build()};document.querySelector('#view').onclick=()=>{view=(view+1)%3;render()};document.querySelector('#phase').onclick=()=>{phase=(phase+1)%4;render()};addEventListener('resize',render);}catch(e){document.querySelector('#status').textContent='ОШИБКА: '+e.message;console.error(e);}
</script></html>
