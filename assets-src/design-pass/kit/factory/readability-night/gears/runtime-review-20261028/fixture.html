<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Приёмка runtime Gear</title><style>body{margin:0;background:#eee7db;color:#25313b;font:14px system-ui}header{height:106px;padding:8px;box-sizing:border-box}button{padding:7px;margin:2px}canvas{display:block}#status{font-size:12px}</style><header><b>Runtime Gear · установка и вращение</b><br><button id="machine">Станок</button><button id="view">Вид</button><button id="phase">Шаг 0.5 с</button><div id="status">Загрузка…</div></header><script type="module">
import * as T from 'three';
import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';
import {loadModels,model} from '/src/parts/assets.ts';
import {Lathe,ShaftMotor,LATHE_SHAFT_AT} from '/src/parts/workshop.ts';
import {Gear,fitGear,turnGears} from '/src/parts/factory.ts';import {contain} from '/assets-src/design-pass/kit/factory/machines-3d/gears-cosmetic/containment.mjs';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#eee7db');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x8a7e70,1.5));const light=new T.DirectionalLight(0xffffff,2.4);light.position.set(3,7,5);scene.add(light);const camera=new T.OrthographicCamera(-1,1,1,-1,.01,100);
const params=new URLSearchParams(location.search);let group,lathe,motor,gears,kind=params.get('kind')||'lathe',view=Number(params.get('view')||0),phase=0;
function render(){if(!group)return;renderer.setSize(innerWidth,innerHeight-106);const aspect=innerWidth/(innerHeight-106);const bounds=new T.Box3().setFromObject(group),center=bounds.getCenter(new T.Vector3());const direction=new T.Vector3(...[[-.4,.85,1],[.001,1,.001],[-.25,.24,-1]][view]).normalize();camera.position.copy(center).addScaledVector(direction,30);camera.up.set(0,1,0);if(view===1)camera.up.set(0,0,-1);camera.lookAt(center);camera.updateMatrixWorld(true);let ex=0,ey=0;for(const x of[bounds.min.x,bounds.max.x])for(const y of[bounds.min.y,bounds.max.y])for(const z of[bounds.min.z,bounds.max.z]){const p=new T.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse);ex=Math.max(ex,Math.abs(p.x));ey=Math.max(ey,Math.abs(p.y));}const half=Math.max(ey,ex/aspect)*1.07;camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();group.updateMatrixWorld(true);renderer.render(scene,camera);const axis=lathe?.gearAt()||gears[0].gearAt(),other=motor?.gearAt()||axis;document.querySelector('#status').textContent=`${kind} · GLB · ось ${axis.x.toFixed(2)},${axis.y.toFixed(2)},${axis.z.toFixed(2)} · пара ${axis.distanceTo(other).toFixed(2)} · вид ${view}`;const result={kind,modelsLoaded:true,axis:axis.toArray(),motorAxis:other.toArray(),separation:axis.distanceTo(other),view,viewport:[innerWidth,innerHeight],overflow:document.documentElement.scrollWidth>innerWidth,assemblyBounds:{min:bounds.min.toArray(),max:bounds.max.toArray()}};result.gearChecks=gears.map(g=>{const axis=g.gearAt(),points=[],indices=[];g.wheel.traverse(o=>{if(!o.isMesh)return;const a=o.geometry.attributes.position,offset=points.length;for(let i=0;i<a.count;i++)points.push(new T.Vector3().fromBufferAttribute(a,i).applyMatrix4(o.matrixWorld).sub(axis).toArray());indices.push(...Array.from(o.geometry.index.array,i=>i+offset));});return {logicalRadius:g.gearR,axis:axis.toArray(),rotationY:g.wheel.rotation.y,containment:contain(points,indices,g.gearR)};});result.elapsedSeconds=phase;result.fallback=fallback;result.snap=snapChecks;result.runtime=gears.map(g=>({kind:g.kind,logicalRadius:g.gearR,turn:g.turn,rotationY:g.wheel.rotation.y,wheelMeshes:meshCount(g.wheel),sceneOffset:g.wheel.children[0].position.toArray(),sceneScale:g.wheel.children[0].scale.toArray()}));document.body.dataset.result=JSON.stringify(result);document.body.dataset.loaded='true';}
function build(){if(group)scene.remove(group);group=new T.Group();if(kind==='medium'){lathe=null;motor=null;gears=[new Gear(false)];group.add(gears[0].root);}else{lathe=new Lathe(kind==='grinder');motor=new ShaftMotor();motor.root.position.set(LATHE_SHAFT_AT.x-1.4,0,LATHE_SHAFT_AT.z+.35);gears=[new Gear(kind==='lathe'?true:'small'),new Gear(kind==='lathe'?'small':true)];gears[0].root.position.set(LATHE_SHAFT_AT.x,0,LATHE_SHAFT_AT.z);gears[1].root.position.set(LATHE_SHAFT_AT.x-1.4,0,LATHE_SHAFT_AT.z);group.add(lathe.root,motor.root,...gears.map(g=>g.root));}scene.add(group);snapChecks=[];if(lathe){for(const g of gears){g.root.position.x+=.13;g.root.position.z+=.07;const moved=fitGear(g,[lathe,motor,...gears]);snapChecks.push({kind:g.kind,moved,axis:g.gearAt().toArray()});}}phase=0;render();}
let snapChecks=[];const meshCount=g=>{let n=0;g.traverse(o=>n+=Number(!!o.isMesh));return n};const fallback=['small',false,true].map(size=>{const g=new Gear(size);return {kind:g.kind,wheelMeshes:meshCount(g.wheel)}});try{await loadModels(['lathe','grinder','shaft-motor','factory-gear-small','factory-gear-medium','factory-gear-big']);for(const n of ['lathe','grinder','shaft-motor','factory-gear-small','factory-gear-medium','factory-gear-big'])if(!model(n,{}))throw Error('GLB missing: '+n);build();document.querySelector('#machine').onclick=()=>{kind=kind==='lathe'?'grinder':'lathe';build()};document.querySelector('#view').onclick=()=>{view=(view+1)%3;render()};document.querySelector('#phase').onclick=()=>{if(motor){motor.drive=()=>2;turnGears([motor,...gears,lathe]);}else{gears[0].turn=2;}for(let j=0;j<60;j++)for(const g of gears)g.update(1/120);phase+=.5;render()};addEventListener('resize',render);}catch(e){document.querySelector('#status').textContent='ОШИБКА: '+e.message;document.body.dataset.error=e.message;console.error(e);}
</script></html>
