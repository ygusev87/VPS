<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Задания завода · иконки</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e4d7;color:#263b3c;font:16px system-ui}main{padding:14px;max-width:1120px;margin:auto}h1{font-size:23px;margin:0 0 8px}p{margin:6px 0 12px}button{padding:8px 14px;font:inherit;margin:0 8px 12px 0}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.card{background:#fff9e9;border:1px solid #c9c1ad;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;min-height:216px}.card img{width:176px;height:164px;object-fit:contain;max-width:100%}.card span{font-size:14px;margin-top:5px;text-align:center}.small .card{min-height:126px}.small img{width:90px;height:90px}.dark .card{background:#2c3642;color:#fff}.status{font-size:13px}@media(max-width:600px){main{padding:9px}h1{font-size:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.small .card{min-height:119px;padding:5px}.card span{font-size:12px}.small img{width:90px;height:90px}}</style><main><h1>Задания завода · 10 картинок</h1><button id="size">Размер 90 / 176</button><button id="bg">Светлый / тёмный</button><div class="grid"></div><p class="status">Статическая проверка силуэта. Облачко и касания в игре проверяет интегратор.</p></main><script>
const items=[['dark-lamp','Включить лампу'],['empty-belt','Запустить ленту'],['gears','Медленная передача'],['gears-fast','Быстрая передача'],['two-hands','Две руки вместе'],['triangle-plug','Треугольная вилка'],['square-plug','Квадратная вилка'],['box-lorry','Коробка в кузов'],['coil','Рулон на ленту'],['gray-toy','Покрасить мишку']];for(const[id,label]of items){const c=document.createElement('div');c.className='card';const img=document.createElement('img');img.src='/textures/kit/factory/factory-bubble-'+id+'.webp';img.alt=label;const s=document.createElement('span');s.textContent=label;c.append(img,s);document.querySelector('.grid').append(c)}document.querySelector('#size').onclick=()=>document.body.classList.toggle('small');document.querySelector('#bg').onclick=()=>document.body.classList.toggle('dark');
</script></html>
