<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Следы износа — проверка декалей</title><style>*{box-sizing:border-box}body{margin:0;background:#e6e1d6;color:#243c3e;font:16px system-ui}main{max-width:1144px;margin:auto;padding:14px}h1{font-size:21px;margin:0 0 9px}button{font:inherit;padding:9px 12px;margin:0 6px 8px 0}#scene{height:580px}canvas{display:block;width:100%;height:100%}p{font-size:13px;line-height:1.45;margin:8px 0}@media(max-width:500px){#scene{height:620px}main{padding:10px}h1{font-size:18px}}</style><main><h1>Следы износа пола · четыре декали</h1><button id="theme">Светлый / тёмный пол</button><button id="angle">Сверху / наклон</button><div id="scene"></div><p id="status">Загрузка…</p><p>A — пятно; B — мазок; C — кольцо; D — пыль. На узком экране сверху вниз. Это стенд Three.js, не игровая карта.</p></main><script type="module">
import * as T from '/node_modules/three/build/three.module.js';
const host=document.querySelector('#scene'),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=T.SRGBColorSpace;host.append(renderer.domElement);const scene=new T.Scene(),camera=new T.OrthographicCamera(-6,6,6,-6,.1,100),floors=[],groups=[];let dark=false,tilt=false;
const report=await(await fetch('./report.json')).json(),loader=new T.TextureLoader();const floorMap=await loader.loadAsync('/public/textures/kit/factory/factory-floor-a.webp');floorMap.colorSpace=T.SRGBColorSpace;
for(const [i,j] of report.items.entries()){const g=new T.Group(),floor=new T.Mesh(new T.PlaneGeometry(5.4,4.5),new T.MeshBasicMaterial({map:floorMap,color:0xffffff}));floor.rotation.x=-Math.PI/2;g.add(floor);floors.push(floor);const map=await loader.loadAsync('/'+j.publicPath);map.colorSpace=T.SRGBColorSpace;const m=new T.Mesh(new T.PlaneGeometry(...j.worldSize),new T.MeshBasicMaterial({map,transparent:true,opacity:j.suggestedOpacity,depthWrite:false,depthTest:true,side:T.FrontSide}));m.rotation.x=-Math.PI/2;m.position.y=.015;g.add(m);scene.add(g);groups.push(g);}
function draw(){const w=host.clientWidth,h=host.clientHeight,portrait=w<500;for(let i=0;i<4;i++)groups[i].position.set(portrait?0:(i%2?2.85:-2.85),0,portrait?(i-1.5)*4.8:(i<2?-2.5:2.5));const worldW=portrait?5.8:11.6,worldH=portrait?19.5:10.2,aspect=w/h,span=Math.max(worldH,worldW/aspect);camera.left=-span*aspect/2;camera.right=span*aspect/2;camera.top=span/2;camera.bottom=-span/2;camera.position.set(0,22,tilt?12:.001);camera.lookAt(0,0,0);camera.updateProjectionMatrix();scene.background=new T.Color(dark?'#3a4146':'#d4d1c6');floors.forEach(f=>f.material.color.set(dark?'#434b53':'#ffffff'));renderer.setSize(w,h,false);renderer.render(scene,camera);document.querySelector('#status').textContent=`${dark?'Тёмный':'Светлый'} · ${tilt?'Наклон':'Сверху'} · ${w}×${h} · 4/4 loaded · opacity .42/.40/.38/.22`;}
document.querySelector('#theme').onclick=()=>{dark=!dark;draw()};document.querySelector('#angle').onclick=()=>{tilt=!tilt;draw()};window.addEventListener('resize',draw);draw();
</script></html>
