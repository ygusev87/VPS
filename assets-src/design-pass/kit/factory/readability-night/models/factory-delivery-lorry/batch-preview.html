<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Завод — четыре новые модели</title><style>body{margin:0;background:#ece7df;color:#193039;font-family:Arial,sans-serif}h1{margin:18px 24px 0;font-size:23px}p{margin:6px 24px;font-size:13px}canvas{position:absolute;left:0;top:68px}#labels{position:absolute;top:68px;inset-inline:0;bottom:0;display:grid;grid-template-columns:repeat(2,1fr);pointer-events:none}#labels div{padding-top:12px;text-align:center;font-weight:bold;font-size:15px}</style><h1>Завод: новая партия моделей</h1><p>Готовые GLB · 4 объекта · 272 КБ суммарно</p><div id="labels"></div><script type="module">
import * as T from 'three';import {loadModels,model as runtimeModel} from '/src/parts/assets.ts';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const items=[['factory-delivery-lorry','Грузовик с тремя коробками'],['factory-product-bear','Мишка для окраски'],['factory-product-box','Готовая коробка'],['factory-product-billet','Деревянная заготовка']];
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;renderer.setSize(innerWidth,innerHeight-68);renderer.setScissorTest(true);document.body.append(renderer.domElement);const env=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture,models=[];
for(const[name,label]of items){const el=document.createElement('div');el.textContent=label;document.querySelector('#labels').append(el);await loadModels([name]);const asset=runtimeModel(name,{});if(!asset)throw Error('Missing model '+name);asset.traverse(o=>{if(o.isMesh)o.material.envMapIntensity=1.2});const scene=new T.Scene();scene.background=new T.Color('#ece7df');scene.environment=env;scene.add(asset);if(name==='factory-delivery-lorry'){await loadModels(['factory-product-box']);const cargo=await(await fetch('./cargo.json')).json();for(const a of cargo.anchors){const box=runtimeModel('factory-product-box',{});box.position.set(a.x,a.bottom,a.z);scene.add(box);}}asset.updateMatrixWorld(true);models.push({scene,bounds:new T.Box3().setFromObject(asset)});}
for(let i=0;i<models.length;i++){const {scene,bounds}=models[i],w=innerWidth/2,h=(innerHeight-68)/2,cam=new T.OrthographicCamera(-1,1,1,-1,.01,100),centre=bounds.getCenter(new T.Vector3());cam.position.copy(centre).add(new T.Vector3(...(i===0?[-3,2.6,-4]:[3,3.2,5])).normalize().multiplyScalar(10));cam.lookAt(centre);cam.updateMatrixWorld(true);let ex=0,ey=0;for(const x of[bounds.min.x,bounds.max.x])for(const y of[bounds.min.y,bounds.max.y])for(const z of[bounds.min.z,bounds.max.z]){const p=new T.Vector3(x,y,z).applyMatrix4(cam.matrixWorldInverse);ex=Math.max(ex,Math.abs(p.x));ey=Math.max(ey,Math.abs(p.y));}const aspect=w/(h-38),half=Math.max(ey,ex/aspect)*1.13;cam.left=-half*aspect;cam.right=half*aspect;cam.top=half;cam.bottom=-half;cam.updateProjectionMatrix();renderer.setViewport((i%2)*w,(1-Math.floor(i/2))*h,w,h-38);renderer.setScissor((i%2)*w,(1-Math.floor(i/2))*h,w,h-38);renderer.render(scene,cam);}document.body.dataset.runtimeLoader='src/parts/assets.ts';document.body.dataset.loaded='true';document.body.dataset.modelCount=models.length;
</script></html>
