<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Покрытие конвейера</title><style>body{margin:0;background:#e9e5d8;color:#263b3c;font:16px system-ui}main{max-width:1060px;margin:auto;padding:16px}h1{font-size:22px;margin:0}p{line-height:1.4}button{font:inherit;padding:10px 14px;margin-right:8px}#scene{height:360px;overflow:hidden;border-radius:12px}canvas{display:block}.repeat{height:100px;background:url('/textures/kit/factory/factory-conveyor-deck.webp') repeat-x;background-size:300px 100px;border:1px solid #aaa}img{max-width:100%;width:512px;display:block;margin:auto}@media(max-width:500px){main{padding:10px}h1{font-size:20px}#scene{height:300px}}</style><main><h1>Конвейер · рисованная поверхность</h1><p>Сверху новый рисунок, снизу прежняя тёмная полоса. Это отдельный стенд: установка в полную игру ещё предстоит.</p><button id="view">Вид сверху / игровой</button><div id="scene"></div><p id="status">Загрузка…</p><div class="repeat" aria-label="Четыре соседних повторения рисунка"></div><p>Повтор по длине: 4,2 м × 1,4 м. Ниже исходный WebP 512 × 171.</p><img src="/textures/kit/factory/factory-conveyor-deck.webp" alt="Покрытие конвейера"></main><script type="module">
import * as T from 'three';
const host=document.querySelector('#scene'),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=T.SRGBColorSpace;host.append(r.domElement);const scene=new T.Scene();scene.background=new T.Color('#d0cfc5');const camera=new T.OrthographicCamera(-8,8,5,-5,.1,100);let top=false;
const floor=new T.Mesh(new T.PlaneGeometry(17,8),new T.MeshBasicMaterial({color:'#bcbdb6'}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const texture=await new T.TextureLoader().loadAsync('/textures/kit/factory/factory-conveyor-deck.webp');texture.colorSpace=T.SRGBColorSpace;texture.wrapS=T.RepeatWrapping;texture.repeat.set(3,1);texture.anisotropy=Math.min(4,r.capabilities.getMaxAnisotropy());
for(const z of [-1.5,1.5]){const box=new T.Mesh(new T.BoxGeometry(12.6,.3,1.4),new T.MeshBasicMaterial({color:'#424852'}));box.position.set(0,.35,z);scene.add(box);if(z<0){const plane=new T.Mesh(new T.PlaneGeometry(12.6,1.4),new T.MeshBasicMaterial({map:texture,depthWrite:true}));plane.rotation.x=-Math.PI/2;plane.position.set(0,.502,z);scene.add(plane);}}
function draw(){const w=host.clientWidth,h=host.clientHeight,aspect=w/h;const span=Math.max(7,14/aspect);camera.left=-span*aspect/2;camera.right=span*aspect/2;camera.top=span/2;camera.bottom=-span/2;camera.position.set(0,top?15:12,top?.001:8);camera.lookAt(0,0,0);camera.updateProjectionMatrix();r.setSize(w,h,false);r.render(scene,camera);document.querySelector('#status').textContent=(top?'Вид сверху':'Игровой наклон')+' · 3 повтора на верхней ленте · '+w+' × '+h;}
document.querySelector('#view').onclick=()=>{top=!top;draw()};window.addEventListener('resize',draw);draw();
</script></html>
