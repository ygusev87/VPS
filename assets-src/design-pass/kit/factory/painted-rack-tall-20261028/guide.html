<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}canvas{display:block;width:100vw;height:100vh}</style><canvas></canvas><script type="module">
import * as T from 'three';
const kind=new URLSearchParams(location.search).get('kind')||'rack';const scene=new T.Scene();scene.background=new T.Color('#eeeae2');const r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});r.setPixelRatio(1);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.NeutralToneMapping;scene.add(new T.HemisphereLight(0xffffff,0x7b7c75,1.2));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(-7,12,5);scene.add(sun);const g=new T.Group();scene.add(g);function box(w,h,d,x,y,z,c){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshStandardMaterial({color:c,roughness:.7}));m.position.set(x,y,z);g.add(m);return m;}function cylinder(rad,h,x,y,z,c){const m=new T.Mesh(new T.CylinderGeometry(rad,rad,h,48),new T.MeshStandardMaterial({color:c,roughness:.65}));m.position.set(x,y,z);g.add(m);return m;}
let width,depth;
if(kind==='rack'){width=5.5;depth=1.4;for(const x of [-2.6,2.6])for(const z of [-.6,.6]){box(.15,4.2,.15,x,2.1,z,'#1a6672');box(.3,.08,.28,x,.04,z,'#154d5c');}for(const y of [.2,1.8,3.4]){box(5.3,.13,1.25,0,y,0,'#da8b2c');box(5.08,.06,1.15,0,y+.095,0,'#9aabb1');}for(let j=0;j<5;j++){const m=cylinder(.115,4.5,0,2.02,-.4+j*.2,'#9eacb4');m.rotation.z=Math.PI/2;}for(let j=0;j<4;j++)box(3.5,.12,.14,-.4,3.60,-.34+j*.19,'#aebbc3');for(const x of [-1.25,1.25]){const m=cylinder(.41,.7,x,.72,0,'#758b94');m.rotation.x=Math.PI/2;}}
if(kind==='pallet'){width=2.4;depth=1.7;for(const x of [-.95,0,.95])box(.23,.2,1.7,x,.1,0,'#b9854b');for(const z of [-.72,-.36,0,.36,.72])box(2.4,.12,.2,0,.26,z,'#ca9d60');box(1.02,.85,1.3,-.55,.745,0,'#b6864f');box(1.02,.85,1.3,.55,.745,0,'#c29559');box(1.04,.65,.95,0,1.495,-.15,'#c79c61');}
if(kind==='barrels'){width=2.6;depth=2.3;for(const [x,z,c]of[[0,-.6,'#1a7079'],[-.65,.6,'#267a91'],[.65,.6,'#366c7b']]){cylinder(.61,1.5,x,.75,z,c);for(const y of [.06,.48,1.05,1.45])cylinder(.625,.055,x,y,z,'#879a9f');cylinder(.09,.025,x-.18,1.515,z+.25,'#b1b8ae');}}
const camera=new T.OrthographicCamera();const view=new T.Vector3(0,1,.78).normalize();function render(){r.setSize(innerWidth,innerHeight);const b=new T.Box3().setFromObject(g),center=b.getCenter(new T.Vector3());camera.position.copy(center).addScaledVector(view,20);camera.lookAt(center);camera.updateMatrixWorld(true);const corners=[];for(const x of[b.min.x,b.max.x])for(const y of[b.min.y,b.max.y])for(const z of[b.min.z,b.max.z])corners.push(new T.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse));const bx=new T.Box3().setFromPoints(corners),aspect=innerWidth/innerHeight,hh=Math.max((bx.max.y-bx.min.y)/2,(bx.max.x-bx.min.x)/2/aspect)*1.2;camera.left=-hh*aspect;camera.right=hh*aspect;camera.top=hh;camera.bottom=-hh;camera.near=.01;camera.far=100;camera.updateProjectionMatrix();r.render(scene,camera);const p=new T.Vector3(0,0,depth/2).project(camera);document.body.dataset.result=JSON.stringify({kind,width,depth,view:view.toArray(),anchor:[(p.x+1)*innerWidth/2,(1-p.y)*innerHeight/2],viewport:[innerWidth,innerHeight]});}addEventListener('resize',render);render();
</script></html>
