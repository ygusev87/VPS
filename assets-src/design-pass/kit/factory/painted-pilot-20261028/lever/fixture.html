<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пульт · пилот рисованного корпуса</title><style>body{margin:0;background:#ece0ca;font:13px system-ui}header{height:108px;box-sizing:border-box;padding:8px}button,select{padding:6px;margin:2px}canvas{width:100%;height:calc(100vh - 108px);display:block}#status{font-size:11px}@media(max-width:600px){header{height:136px}canvas{height:calc(100vh - 136px)}}</style><header><b>Пульт · корпус и живые органы управления</b><br><select id="version" aria-label="Корпус"><option value="old">Текущий GLB</option><option value="card">Рисованный корпус</option></select><select id="zoom" aria-label="Масштаб"><option value="92">Игровой 92 px/ед.</option><option value="125">Диагностика 125 px/ед.</option></select><button id="left">Назад</button><button id="stop">Стоп</button><button id="right">Вперёд</button><div id="status">Загрузка</div></header><canvas></canvas><script type="module">
import * as T from 'three';import{Stage}from'/src/stage.ts';import{Reverser}from'/src/parts/workshop.ts';import{loadModels,hasModel}from'/src/parts/assets.ts';import{loadKit,kitPieces}from'/src/kit.ts';
const q=new URLSearchParams(location.search);let version=q.get('version')||'old',ppu=Number(q.get('ppu')||92),part,stage,art,old,guide;document.querySelector('#version').value=version;document.querySelector('#zoom').value=String(ppu);const dir=new T.Vector3(0,1,.78).normalize();
function buildGuide(){const g=new T.Group();const body=new T.Mesh(new T.BoxGeometry(1.5,.35,1.1),new T.MeshStandardMaterial({color:'#318689',roughness:.6}));body.position.y=.335;g.add(body);const lid=new T.Mesh(new T.BoxGeometry(1.5,.015,1.1),new T.MeshStandardMaterial({color:'#b6bdc1',roughness:.6}));lid.position.y=.515;g.add(lid);const socket=new T.Mesh(new T.TorusGeometry(.12,.025,8,32),new T.MeshStandardMaterial({color:'#303030'}));socket.rotation.x=-Math.PI/2;socket.position.set(0,.537,-.35);g.add(socket);return g;}
function proj(p){const v=stage.project(part.root.localToWorld(p.clone()));return{x:v.x,y:v.y};}
function render(){if(!part)return;stage.checkSize();stage.frame([new T.Vector3(-2.3,0,-1.65),new T.Vector3(2.3,0,1.65)],true,ppu);old.visible=version==='old';part.lever.traverse(o=>{if(o.isMesh){o.material.transparent=version==='card';o.material.depthTest=version!=='card';o.material.depthWrite=version!=='card';o.renderOrder=version==='card'?30:0;o.userData.noAO=version==='card';}});part.body.children.filter(o=>part.marks.includes(o.material)).forEach(o=>{o.material.depthTest=version!=='card';o.renderOrder=version==='card'?31:0});if(art)art.visible=version==='card';guide.visible=version==='guide';part.lever.visible=version!=='guide';part.body.children.filter(o=>o.userData.plate).forEach(o=>o.visible=version!=='guide');part.terminals.forEach(t=>t.post.visible=version!=='guide');part.overlay=version!=='guide';if(version==='guide')part.marks.forEach(m=>{m.opacity=1;m.transparent=false;m.emissiveIntensity=.1});for(let frame=0;frame<6;frame++)stage.render();const d={loaded:true,version,viewport:[innerWidth,innerHeight],overflow:document.documentElement.scrollWidth>innerWidth,ppuRequested:ppu,ppuActual:stage.pixelsPerUnit(new T.Vector3()),scale:part.root.scale.toArray(),art:{position:art?.position.toArray(),width:2.22,alphaTest:.45,overlayDepthTest:false},pos:part.pos,leverAngle:part.lever.rotation.z,axis:proj(part.lever.position),markers:[-1,0,1].map(p=>({pos:p,point:part.posPoint(p).toArray(),screen:proj(part.posPoint(p))})),terminals:part.terminals.map(t=>({key:t.key,at:t.post.position.toArray()})),footprint:part.footprint(),hasModel:hasModel('lever-box')};document.body.dataset.result=JSON.stringify(d);document.querySelector('#status').textContent=`${version} · ${innerWidth}×${innerHeight} · ${d.ppuActual.toFixed(1)}px/ед. · положение ${part.pos}`;}
function pose(p){part.tap(null,part.root.localToWorld(new T.Vector3(p*.5,.56,.3)));for(let j=0;j<60;j++)part.update(1/60);render();}
try{await loadModels(['lever-box']);stage=new Stage(document.querySelector('canvas'));stage.renderer.setPixelRatio(1);stage.setInsets({top:8,bottom:8,left:12,right:12});part=new Reverser();part.root.scale.setScalar(1.7);stage.world.add(part.root);old=part.body.children.find(o=>o.isGroup&&Math.abs(o.position.y-.16)<1e-8&&o.children.some(c=>c.isGroup));if(!old)throw Error('GLB group not found');const originalFootprint=part.footprint();guide=buildGuide();guide.visible=false;await loadKit('factory',['factory-lever-body']);const tex=kitPieces('factory','factory-lever-body')[0];if(!tex)throw Error('public lever image missing');tex.colorSpace=T.SRGBColorSpace;tex.anisotropy=8;art=new T.Mesh(new T.PlaneGeometry(2.22,2.22*683/1024),new T.MeshBasicMaterial({map:tex,alphaTest:.45,side:T.FrontSide}));art.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),dir);art.position.set(0,.508,.1324);art.userData.noAO=false;part.body.add(art);pose(0);const canvas=document.querySelector('canvas'),ray=new T.Raycaster();canvas.onpointerdown=e=>{const b=canvas.getBoundingClientRect();ray.setFromCamera(new T.Vector2((e.clientX-b.left)/b.width*2-1,1-(e.clientY-b.top)/b.height*2),stage.camera);const hits=ray.intersectObjects(version==='card'?[art]:[old],true);if(hits.length&&part.controlAt(hits[0].object,hits[0].point)){part.tap(hits[0].object,hits[0].point);for(let j=0;j<60;j++)part.update(1/60);render();}};document.querySelector('#version').onchange=e=>{version=e.target.value;render()};document.querySelector('#zoom').onchange=e=>{ppu=+e.target.value;render()};document.querySelector('#left').onclick=()=>pose(-1);document.querySelector('#stop').onclick=()=>pose(0);document.querySelector('#right').onclick=()=>pose(1);addEventListener('resize',render);render();}catch(e){document.body.dataset.error=e.stack;document.querySelector('#status').textContent=e.message;console.error(e)}
</script></html>
