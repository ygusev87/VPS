<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}canvas{display:block;width:100vw;height:100vh}</style><canvas></canvas><script type="module">
import * as T from 'three';import{Reverser}from'/src/parts/workshop.ts';
const scene=new T.Scene();scene.background=new T.Color('#f4f3ed');const r=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});r.setPixelRatio(1);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.NeutralToneMapping;scene.add(new T.HemisphereLight(0xffffff,0x7b7c75,2));let sun=new T.DirectionalLight(0xffffff,3);sun.position.set(-7,12,5);scene.add(sun);let g=new T.Group();scene.add(g);let body=new T.Mesh(new T.BoxGeometry(1.5,.35,1.1),new T.MeshStandardMaterial({color:'#348e92',roughness:.7}));body.position.y=.335;g.add(body);let lid=new T.Mesh(new T.BoxGeometry(1.5,.015,1.1),new T.MeshStandardMaterial({color:'#8f979b',roughness:.7}));lid.position.y=.51;g.add(lid);let socket=new T.Mesh(new T.TorusGeometry(.09,.02,8,40),new T.MeshStandardMaterial({color:'#333b3c'}));socket.rotation.x=-Math.PI/2;socket.position.set(0,.54,-.35);g.add(socket);const p=new Reverser();const marks=p.body.children.filter(o=>p.marks.includes(o.material));marks.forEach(m=>g.add(m));const camera=new T.OrthographicCamera();function render(){r.setSize(innerWidth,innerHeight);const aspect=innerWidth/innerHeight,hh=.74;camera.left=-hh*aspect;camera.right=hh*aspect;camera.top=hh;camera.bottom=-hh;camera.near=.01;camera.far=100;const target=new T.Vector3(0,.35,0);camera.position.copy(target).addScaledVector(new T.Vector3(0,1,.78).normalize(),10);camera.lookAt(target);camera.updateProjectionMatrix();camera.updateMatrixWorld(true);r.render(scene,camera);document.body.dataset.points=JSON.stringify([socket,...marks].map(o=>{const p=o.position.clone().project(camera);return{x:(p.x+1)*innerWidth/2,y:(1-p.y)*innerHeight/2,world:o.position.toArray()}}))}addEventListener('resize',render);render();
</script></html>
