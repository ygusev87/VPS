<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Манометр · рисованная шкала</title><style>body{margin:0;background:#ece0ca;font:13px system-ui}header{height:110px;padding:8px;box-sizing:border-box}select,button{padding:6px;margin:2px}canvas{display:block;width:100%;height:calc(100vh - 110px)}#status{font-size:11px}@media(max-width:600px){header{height:142px}canvas{height:calc(100vh - 142px)}}</style><header><b>Манометр · рисунок и настоящая стрелка Lathe</b><br><select id="version" aria-label="Циферблат"><option value="card">Рисованный</option><option value="old">Прежний</option></select><select id="machine" aria-label="Станок"><option value="lathe">Токарный</option><option value="grinder">Точильный</option></select><select id="speed" aria-label="Скорость"><option value="0">Стоп</option><option value="1">Медленно 1</option><option value="4.5">Быстро 4.5</option><option value="6">Максимум 6</option></select><button id="zoom">Крупно</button><div id="status">Загрузка</div></header><canvas></canvas><script type="module">
import * as T from 'three';import{Stage}from'/src/stage.ts';import{Lathe,LATHE_SPEED}from'/src/parts/workshop.ts';import{loadModels}from'/src/parts/assets.ts';import{loadKit,kitPieces}from'/src/kit.ts';
const q=new URLSearchParams(location.search);let version=q.get('version')||'card',kind='lathe',speed=0,close=false,stage,part,dial,tex,art,face,rim,audit;document.querySelector('#version').value=version;
function build(){if(part)part.root.removeFromParent();part=new Lathe(kind==='grinder');stage.world.add(part.root);dial=part.needle.parent;[face,rim]=dial.children;const size=.67*512/(2*audit.circleRadiusPx),[u,v]=audit.circleCenterUv;const geo=new T.PlaneGeometry(size,size);geo.translate((.5-u)*size,(v-.5)*size,0);art=new T.Mesh(geo,new T.MeshBasicMaterial({map:tex,alphaTest:.45}));art.position.z=-.03;art.userData.noAO=false;dial.add(art);part.turn=speed;for(let j=0;j<180;j++)part.update(1/60);render();}
function render(){if(!part)return;stage.checkSize();face.visible=rim.visible=version==='old';art.visible=version==='card';dial.rotation.x=version==='card'?-Math.atan2(1,.78):-.55;part.band.material.transparent=version==='card';part.band.material.opacity=version==='card'?.42:1;part.band.material.depthWrite=version!=='card';part.band.material.needsUpdate=true;stage.frame(close?[new T.Vector3(-1.6,0,-.2),new T.Vector3(.2,0,.9)]:[new T.Vector3(-3,0,-1),new T.Vector3(2.4,0,1)],true,92);for(let j=0;j<6;j++)stage.render();const center=part.needle.getWorldPosition(new T.Vector3()),p=stage.project(center);const d={loaded:true,version,kind,speed,actualShown:part.shown,needleRadians:part.needle.rotation.z,needleVisualAngleDegrees:(90+part.needle.rotation.z*180/Math.PI+360)%360,want:part.want,bandGeometry:part.band.geometry.parameters,bandOpacity:part.band.material.opacity,axis:center.toArray(),axisScreen:[p.x,p.y],dialRotationX:dial.rotation.x,scale:dial.scale.toArray(),artWidth:.67*512/(2*audit.circleRadiusPx),centerUV:audit.circleCenterUv,viewport:[innerWidth,innerHeight],overflow:document.documentElement.scrollWidth>innerWidth,ppu:stage.pixelsPerUnit(new T.Vector3()),close};document.body.dataset.result=JSON.stringify(d);document.querySelector('#status').textContent=`${kind} · ${version} · ${innerWidth}×${innerHeight} · скорость ${speed} · зона ${part.want}`;}
try{await loadModels(['lathe','grinder']);await loadKit('factory',['factory-speed-dial']);tex=kitPieces('factory','factory-speed-dial')[0];if(!tex)throw Error('public dial image missing');tex.colorSpace=T.SRGBColorSpace;tex.anisotropy=8;audit=await(await fetch('./image-audit.json')).json();stage=new Stage(document.querySelector('canvas'));stage.setInsets({top:8,bottom:8,left:12,right:12});build();document.querySelector('#version').onchange=e=>{version=e.target.value;render()};document.querySelector('#machine').onchange=e=>{kind=e.target.value;build()};document.querySelector('#speed').onchange=e=>{speed=+e.target.value;part.turn=speed;for(let j=0;j<180;j++)part.update(1/60);render()};document.querySelector('#zoom').onclick=()=>{close=!close;render()};addEventListener('resize',render);}catch(e){document.body.dataset.error=e.stack;document.querySelector('#status').textContent=e.message;console.error(e)}
</script></html>
