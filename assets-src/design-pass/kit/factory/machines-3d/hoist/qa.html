<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Завод · подъёмник · приёмка</title><style>body{margin:0;background:#eee7db;font:14px system-ui;color:#25313b}header{height:84px;padding:8px;box-sizing:border-box}button{padding:6px 10px;margin:3px}canvas{display:block}</style><header><span id="status">Загрузка</span><br><button data-phase="0">Низ</button><button data-phase=".5">Середина</button><button data-phase="1">Верх</button><button id="view">Вид</button></header><script type="module">
import * as T from'three';import{RoomEnvironment}from'three/examples/jsm/environments/RoomEnvironment.js';import{loadModels,model}from'/src/parts/assets.ts';import{Lift}from'/src/parts/more.ts';
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(innerWidth,innerHeight-84);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.NeutralToneMapping;document.body.append(r.domElement);const scene=new T.Scene();scene.background=new T.Color('#eee7db');scene.environment=new T.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x8a7e70,1.5));const l=new T.DirectionalLight(0xffffff,2.4);l.position.set(3,7,5);scene.add(l);const camera=new T.PerspectiveCamera(35,innerWidth/(innerHeight-84),.01,100);let phase=0,viewMode=0;
try{await loadModels(['hoist']);const m=model('hoist',{height:3});if(!m)throw Error('GLB не загрузился');const lift=new Lift();const tower=lift.pulley.parent,floor=tower.children[18];for(const ch of tower.children)if(ch!==lift.pulley&&ch!==floor&&ch.geometry?.type!=='SphereGeometry')ch.visible=false;m.position.set(0,.16,-.25);lift.body.add(m);lift.pulley.position.y=2.96;scene.add(lift.root);function draw(){const y=.24+1.67*phase;lift.cabin.position.y=y;lift.rope.scale.y=2.88-(y+.72);lift.rope.position.y=(2.88+y+.72)/2;const target=new T.Vector3(0,1.45,-.2);camera.position.set(...[[4,4,6],[0,2,7],[-4,4,-6]][viewMode]).sub(target).multiplyScalar(Math.max(1,.85/camera.aspect)).add(target);camera.lookAt(target);r.render(scene,camera);document.querySelector('#status').textContent='Шахта GLB · кабина Lift · фаза '+phase;}document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{phase=Number(b.dataset.phase);draw()});document.querySelector('#view').onclick=()=>{viewMode=(viewMode+1)%3;draw()};draw();}catch(e){document.querySelector('#status').textContent='Ошибка: '+e.message;console.error(e)}
</script></html>
