<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Завод · модели · приёмка</title><style>body{margin:0;background:#eee7db;color:#25313b;font:14px system-ui}header{padding:8px;box-sizing:border-box;height:104px}canvas{display:block}button{padding:6px 9px;margin:2px}#status{display:block}</style><header><button id="lathe">Станок</button><button id="cabinet">Щиток</button><button id="view">Вид</button><span id="status">Загрузка</span><button data-phase="0">0°</button><button data-phase=".5">45°</button><button data-phase="1">90°</button></header><script type="module">
import * as T from 'three';import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';import {loadModels,model} from '/src/parts/assets.ts';import {Lathe,WireBox} from '/src/parts/workshop.ts';
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(innerWidth,innerHeight-104);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.NeutralToneMapping;document.body.append(r.domElement);const scene=new T.Scene();scene.background=new T.Color('#eee7db');scene.environment=new T.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x8a7e70,1.5));const light=new T.DirectionalLight(0xffffff,2.4);light.position.set(3,7,5);scene.add(light);const camera=new T.PerspectiveCamera(35,innerWidth/(innerHeight-104),.01,100);let current,viewMode=0,phase=0;
function draw(){const target=new T.Vector3(0,current.kind==='lathe'?.65:.2,0);camera.position.set(...[[3,4,5],[.1,6,.1],[0,1.6,6]][viewMode]).sub(target).multiplyScalar(Math.max(.9,(current.kind==='lathe'?.9:1.1)/camera.aspect)).add(target);camera.lookAt(target);if(current.kind==='lathe'){current.spindle.rotation.x=phase*Math.PI/2;current.spindle.position.y=.91+(phase===.5?.03:phase===1?-.03:0);}else current.tiles.forEach(t=>t.rotation.y=phase*Math.PI/2);r.render(scene,camera);document.querySelector('#status').textContent=current.kind+' · GLB загружен · фаза '+phase+' · вид '+viewMode;}
try{await loadModels(['lathe','factory-cabinet']);for(const n of ['lathe','factory-cabinet'])if(!model(n,{}))throw Error('Не загружен '+n);const lathe=new Lathe(),cabinet=new WireBox();function show(v){if(current)scene.remove(current.root);current=v;scene.add(current.root);draw();}document.querySelector('#lathe').onclick=()=>show(lathe);document.querySelector('#cabinet').onclick=()=>show(cabinet);document.querySelector('#view').onclick=()=>{viewMode=(viewMode+1)%3;draw()};document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{phase=Number(b.dataset.phase);draw()});show(lathe);}catch(e){document.querySelector('#status').textContent='Ошибка: '+e.message;console.error(e)}
</script></html>
