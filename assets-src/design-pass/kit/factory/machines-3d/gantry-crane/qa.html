<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Завод · портальный кран</title><style>body{margin:0;background:#eee7db;color:#25313b;font:14px system-ui}header{padding:8px;box-sizing:border-box;height:110px}canvas{display:block}button{padding:5px 8px;margin:2px}#status{display:block}</style><header><b>Портальный кран</b><button id="view">Вид</button><button id="height">Тележка</button><span id="status">Загрузка</span><button data-phase="0">Слева</button><button data-phase="1">Центр</button><button data-phase="2">Справа</button></header><script type="module">
import * as T from 'three';import{RoomEnvironment}from'three/examples/jsm/environments/RoomEnvironment.js';import{loadModels,model}from'/src/parts/assets.ts';import{Gantry}from'/src/parts/workshop.ts';
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(innerWidth,innerHeight-110);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.NeutralToneMapping;document.body.append(r.domElement);const scene=new T.Scene();scene.background=new T.Color('#eee7db');scene.environment=new T.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x8a7e70,1.5));const light=new T.DirectionalLight(0xffffff,2.4);light.position.set(3,9,5);scene.add(light);const camera=new T.OrthographicCamera();let part,view=0,phase=0,proposed=true;
function draw(){part.trolleyX=[-5.5,0,5.5][phase];part.hookY=[.7,4.6,.7][phase];part.animate(0);part.trolley.position.y=proposed?5.5:5.7;const aspect=innerWidth/(innerHeight-110),wide=view===1?4.4:19,high=view===1?3.4:10;const halfH=Math.max(high/2,wide/(2*aspect));camera.left=-halfH*aspect;camera.right=halfH*aspect;camera.top=halfH;camera.bottom=-halfH;camera.near=.1;camera.far=120;camera.updateProjectionMatrix();const target=new T.Vector3(view===1?part.trolleyX:-.7,view===1?5.1:3.1,0);camera.position.copy(target).add(new T.Vector3(...[[5,5,15],[2,1.3,8],[0,0,15],[-4,4,-15]][view]));camera.lookAt(target);r.render(scene,camera);document.querySelector('#status').textContent='Игровой Gantry · ширина15 · X '+part.trolleyX+' · крюкY '+part.hookY+' · тележкаY '+part.trolley.position.y.toFixed(1)+' · вид '+view;}
try{await loadModels(['gantry-crane']);if(!model('gantry-crane',{}))throw Error('GLB not loaded');part=new Gantry();scene.add(part.root);document.querySelector('#view').onclick=()=>{view=(view+1)%4;draw()};document.querySelector('#height').onclick=()=>{proposed=!proposed;draw()};document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{phase=Number(b.dataset.phase);draw()});draw();}catch(e){document.querySelector('#status').textContent='Ошибка: '+e.message;console.error(e)}
</script></html>
