<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Рука робота — проверка шарниров</title><style>body{margin:0;font:13px system-ui;background:#eee7db;color:#25313b}header{height:112px;padding:6px;box-sizing:border-box}button{padding:6px;margin:2px}canvas{display:block}#status{display:block}</style><header><button data-phase="0">Домой</button><button data-phase=".125">1/8</button><button data-phase=".25">Право</button><button data-phase=".375">3/8</button><button data-phase=".5">К линии</button><button data-phase=".75">Лево</button><button id="view">Вид</button><button id="play">Движение</button><span id="status">Загрузка</span></header><script type="module">
import*as T from'three';import{loadModels,model}from'/src/parts/assets.ts';import{RoomEnvironment}from'three/examples/jsm/environments/RoomEnvironment.js';import{basePlate}from'/src/parts/kit.ts';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight-112);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#eee7db');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x8a7e70,1.5));let light=new T.DirectionalLight(0xffffff,2.4);light.position.set(3,7,5);scene.add(light);
const scale=1.5,ppu=90,w=innerWidth/ppu,h=(innerHeight-112)/ppu;const camera=new T.OrthographicCamera(-w/2,w/2,h/2,-h/2,.01,100);let phase=0,view=0,playing=false,robot;
try{await loadModels(['robot-arm']);robot=model('robot-arm',{});if(!robot)throw Error('model not loaded');robot.children[0].position.set(0,0,0);robot.position.set(0,.16,-.15);const holder=new T.Group();holder.scale.setScalar(scale);holder.add(basePlate(1.8,1.6),robot);scene.add(holder);const turret=robot.getObjectByName('turret'),arm=robot.getObjectByName('arm'),claw=robot.getObjectByName('claw');if(!turret||!arm||!claw)throw Error('missing pivots');function draw(){turret.rotation.y=Math.sin(phase*Math.PI*2)*1.4;arm.rotation.z=-.3-Math.abs(Math.cos(phase*Math.PI*2))*.4;const target=new T.Vector3(.15,1.05,0);camera.position.copy(target).add(new T.Vector3(...[[3,4,7],[0,.2,7],[-3,3,-7]][view]));camera.lookAt(target);renderer.render(scene,camera);const b=new T.Box3().setFromObject(robot);document.querySelector('#status').textContent='Игровой загрузчик · ×1.5 · фаза '+phase.toFixed(3)+' · вид '+view+' · низY '+b.min.y.toFixed(3);}
document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{playing=false;phase=Number(b.dataset.phase);draw();});document.querySelector('#view').onclick=()=>{view=(view+1)%3;draw()};document.querySelector('#play').onclick=()=>{playing=!playing};let old=performance.now();function tick(now){if(playing){phase=(phase+(now-old)/1000*.35)%1;draw()}old=now;requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
}catch(e){document.querySelector('#status').textContent='ОШИБКА: '+e.message;console.error(e)}
</script></html>
