<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Косметические шестерни · GLB</title><style>body{margin:0;background:#eee7db;color:#25313b;font:14px system-ui}header{height:106px;padding:8px;box-sizing:border-box}button{padding:7px;margin:2px}canvas{display:block}#status{font-size:12px}</style><header><b>Новые шестерни · настоящие GLB</b><br><button id="machine">Станок</button><button id="view">Вид</button><button id="phase">Фаза 0°</button><div id="status">Загрузка…</div></header><script type="module">
import * as T from 'three';
import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';
import {loadModels,model} from '/src/parts/assets.ts';
import {Lathe,ShaftMotor,LATHE_SHAFT_AT} from '/src/parts/workshop.ts';
import {Gear} from '/src/parts/factory.ts';import {contain} from './containment.mjs';
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#eee7db');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x8a7e70,1.5));const light=new T.DirectionalLight(0xffffff,2.4);light.position.set(3,7,5);scene.add(light);const camera=new T.OrthographicCamera(-1,1,1,-1,.01,100);
const params=new URLSearchParams(location.search);let group,lathe,motor,gears,kind=params.get('kind')||'lathe',view=Number(params.get('view')||0),phase=Number(params.get('phase')||0);
function render(){if(!group)return;renderer.setSize(innerWidth,innerHeight-106);const aspect=innerWidth/(innerHeight-106);const bounds=new T.Box3().setFromObject(group),center=bounds.getCenter(new T.Vector3());const direction=new T.Vector3(...[[-.4,.85,1],[.001,1,.001],[-.25,.24,-1]][view]).normalize();camera.position.copy(center).addScaledVector(direction,30);camera.up.set(0,1,0);if(view===1)camera.up.set(0,0,-1);camera.lookAt(center);camera.updateMatrixWorld(true);let ex=0,ey=0;for(const x of[bounds.min.x,bounds.max.x])for(const y of[bounds.min.y,bounds.max.y])for(const z of[bounds.min.z,bounds.max.z]){const p=new T.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse);ex=Math.max(ex,Math.abs(p.x));ey=Math.max(ey,Math.abs(p.y));}const half=Math.max(ey,ex/aspect)*1.07;camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();gears.forEach((g,i)=>g.wheel.rotation.y=phase*Math.PI/180*(i===1?-gears[0].gearR/g.gearR:1));group.updateMatrixWorld(true);renderer.render(scene,camera);const axis=lathe?.gearAt()||gears[0].gearAt(),other=motor?.gearAt()||axis;document.querySelector('#status').textContent=`${kind} · GLB · ось ${axis.x.toFixed(2)},${axis.y.toFixed(2)},${axis.z.toFixed(2)} · пара ${axis.distanceTo(other).toFixed(2)} · вид ${view}`;document.querySelector('#phase').textContent=`Фаза ${phase}°`;const result={kind,modelsLoaded:true,axis:axis.toArray(),motorAxis:other.toArray(),separation:axis.distanceTo(other),view,phaseDegrees:phase,viewport:[innerWidth,innerHeight],overflow:document.documentElement.scrollWidth>innerWidth,assemblyBounds:{min:bounds.min.toArray(),max:bounds.max.toArray()}};result.gearChecks=gears.map(g=>{const axis=g.gearAt(),points=[],indices=[];g.wheel.traverse(o=>{if(!o.isMesh)return;const a=o.geometry.attributes.position,offset=points.length;for(let i=0;i<a.count;i++)points.push(new T.Vector3().fromBufferAttribute(a,i).applyMatrix4(o.matrixWorld).sub(axis).toArray());indices.push(...Array.from(o.geometry.index.array,i=>i+offset));});return {logicalRadius:g.gearR,axis:axis.toArray(),rotationY:g.wheel.rotation.y,containment:contain(points,indices,g.gearR)};});document.body.dataset.result=JSON.stringify(result);document.body.dataset.loaded='true';}
function replaceWheel(g,name){const asset=model(name,{});if(!asset)throw Error('Missing generated gear '+name);asset.children[0].position.set(0,0,0);g.wheel.clear();g.wheel.add(asset);}
function build(){if(group)scene.remove(group);group=new T.Group();if(kind==='medium'){lathe=null;motor=null;gears=[new Gear(false)];replaceWheel(gears[0],'factory-gear-medium');group.add(gears[0].root);}else{lathe=new Lathe(kind==='grinder');motor=new ShaftMotor();motor.root.position.set(LATHE_SHAFT_AT.x-1.4,0,LATHE_SHAFT_AT.z+.35);gears=[new Gear(kind==='lathe'?true:'small'),new Gear(kind==='lathe'?'small':true)];gears[0].root.position.set(LATHE_SHAFT_AT.x,0,LATHE_SHAFT_AT.z);gears[1].root.position.set(LATHE_SHAFT_AT.x-1.4,0,LATHE_SHAFT_AT.z);replaceWheel(gears[0],kind==='lathe'?'factory-gear-big':'factory-gear-small');replaceWheel(gears[1],kind==='lathe'?'factory-gear-small':'factory-gear-big');group.add(lathe.root,motor.root,...gears.map(g=>g.root));}scene.add(group);render();}
try{await loadModels(['lathe','grinder','shaft-motor','factory-gear-small','factory-gear-medium','factory-gear-big']);for(const n of ['lathe','grinder','shaft-motor'])if(!model(n,{}))throw Error('GLB missing: '+n);build();document.querySelector('#machine').onclick=()=>{kind=kind==='lathe'?'grinder':'lathe';build()};document.querySelector('#view').onclick=()=>{view=(view+1)%3;render()};document.querySelector('#phase').onclick=()=>{phase=(phase+45)%360;render()};addEventListener('resize',render);}catch(e){document.querySelector('#status').textContent='ОШИБКА: '+e.message;document.body.dataset.error=e.message;console.error(e);}
</script></html>
