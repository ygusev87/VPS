<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Три шестерни для мастерской</title><style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#eee7db;color:#28332f;font:16px system-ui}h1{font-size:30px;margin:0 0 8px}p{margin:0;color:#59635e}main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0}article{background:#f8f4eb;border-radius:20px;overflow:hidden}canvas{display:block;width:100%;height:350px}h2{font-size:21px;margin:0 22px 8px}article p{margin:0 22px 24px;font-size:14px}footer{font-size:14px;line-height:1.7}@media(max-width:650px){body{padding:18px}main{grid-template-columns:1fr}canvas{height:220px}}</style><h1>Шестерни для мастерской</h1><p>Три готовые 3D-модели · 28 октября 2026</p><main></main><footer>Центральная ось вращения · открытые спицы · скруглённые зубья<br>Проверены через загрузчик игры. Общий размер: 159 КБ.</footer><script type="module">
import * as T from 'three';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';import {loadModels,model} from '/src/parts/assets.ts';
const items=[['small','Малая · латунь','6 зубьев · 53,0 КБ'],['medium','Средняя · сталь','8 зубьев · 51,9 КБ'],['big','Большая · медь','14 зубьев · 53,7 КБ']];
try{await loadModels(items.map(i=>'factory-gear-'+i[0]));const views=[];for(const [key,title,detail]of items){const article=document.createElement('article');article.innerHTML='<canvas></canvas><h2>'+title+'</h2><p>'+detail+'</p>';document.querySelector('main').append(article);const canvas=article.querySelector('canvas'),renderer=new T.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;const scene=new T.Scene();scene.background=new T.Color('#f8f4eb');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;const wheel=model('factory-gear-'+key,{});if(!wheel)throw Error(key);wheel.children[0].position.set(0,0,0);scene.add(wheel);const camera=new T.OrthographicCamera(-1,1,1,-1,.01,30),bounds=new T.Box3().setFromObject(wheel),center=bounds.getCenter(new T.Vector3());camera.position.copy(center).add(new T.Vector3(3,4.3,5).normalize().multiplyScalar(10));camera.lookAt(center);camera.updateMatrixWorld(true);let ex=0,ey=0;for(const x of[bounds.min.x,bounds.max.x])for(const y of[bounds.min.y,bounds.max.y])for(const z of[bounds.min.z,bounds.max.z]){const v=new T.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse);ex=Math.max(ex,Math.abs(v.x));ey=Math.max(ey,Math.abs(v.y));}views.push(()=>{const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);const aspect=w/h,half=Math.max(ey,ex/aspect)*1.12;camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();renderer.render(scene,camera)});}function draw(){views.forEach(v=>v())}draw();addEventListener('resize',draw);document.body.dataset.loaded='true';}catch(e){document.body.dataset.error=e.message;console.error(e)}
</script></html>
