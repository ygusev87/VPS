<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Завод · пресс · приёмка</title><style>body{margin:0;background:#eee7db;color:#25313b;font:14px system-ui}header{padding:8px;box-sizing:border-box}canvas{display:block}button{padding:6px 12px;margin:3px}#status{display:block}</style><header>Пресс · настоящий корпус и кодовые кнопки/ползун <span id="status">Загрузка</span><button data-phase="0">Верх</button><button data-phase=".5">Середина</button><button data-phase="1">Низ</button><button id="view">Сверху / игровой</button></header><script type="module">
import * as T from 'three';import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';import {loadModels} from '/src/parts/assets.ts';import {SafetyPress} from '/src/parts/workshop.ts';
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setPixelRatio(1);r.setSize(innerWidth,innerHeight-92);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.NeutralToneMapping;document.body.append(r.domElement);
const scene=new T.Scene();scene.background=new T.Color('#eee7db');scene.environment=new T.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x8a7e70,1.5));const light=new T.DirectionalLight(0xffffff,2.4);light.position.set(3,7,5);scene.add(light);
const camera=new T.PerspectiveCamera(35,innerWidth/(innerHeight-92),.01,100);let top=false;
function view(){camera.position.set(...(top?[.1,7,.1]:[4,5,6])).sub(new T.Vector3(0,1,-.2)).multiplyScalar(Math.max(1,1.2/camera.aspect)).add(new T.Vector3(0,1,-.2));camera.lookAt(0,1,-.2);r.render(scene,camera);}
try{await loadModels(['safety-press']);const press=new SafetyPress();scene.add(press.root);press.root.updateMatrixWorld(true);const ram=press.ram;let phase=0;function draw(v){phase=v;ram.position.y=1.56-.75*v;document.querySelector('#status').textContent='Готово · фаза '+v+' · 3739 треугольников · 107740 Б';view();}document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>draw(Number(b.dataset.phase)));document.querySelector('#view').onclick=()=>{top=!top;view()};draw(0);}catch(e){document.querySelector('#status').textContent='Ошибка: '+e.message;console.error(e)}
</script></html>
