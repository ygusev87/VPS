<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Factory secondary · GLB QA</title><style>*{box-sizing:border-box}body{margin:0;background:#ece7df;color:#28343b;font:13px system-ui}header{padding:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}button,select,a{font:inherit;padding:5px 8px}#status{width:100%;white-space:pre-wrap}canvas{display:block;width:100%}</style><header><select id="model"><option>lever-box</option><option>rail-cart</option><option>socket-board</option><option>shaft-motor</option></select><button id="kind">Raw / Final</button><button id="view">Ракурс</button><button id="pose">Положение</button><button id="probes">Проверочные детали</button><span id="status">Загрузка настоящего GLB…</span></header><script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';
const q=new URLSearchParams(location.search),name=q.get('m')||'lever-box',raw=q.has('raw');
const status=document.querySelector('#status'),select=document.querySelector('#model');select.value=name;
select.onchange=()=>{q.set('m',select.value);location.search=q};document.querySelector('#kind').onclick=()=>{raw?q.delete('raw'):q.set('raw','1');location.search=q};
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#ece7df');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x938677,1.5));const light=new T.DirectionalLight(0xffffff,2.4);light.position.set(3,7,5);scene.add(light);
const camera=new T.OrthographicCamera(-1,1,1,-1,.01,100);let asset,view=0,phase=0,bounds,centre,span,stats;
const probeRoot=new T.Group();scene.add(probeRoot);probeRoot.visible=!raw;
function probe(g,position,color=0xdf713a){const o=new T.Mesh(g,new T.MeshStandardMaterial({color,roughness:.4,metalness:.5}));o.position.set(...position);probeRoot.add(o);return o;}
let lever;function addProbes(){if(raw)return;if(name==='lever-box'){lever=new T.Group();lever.position.set(0,.35,-.35);probeRoot.add(lever);const rod=probe(new T.CylinderGeometry(.06,.06,.75,12),[0,.2,.3]);rod.rotation.x=Math.PI/2-.5;probeRoot.remove(rod);lever.add(rod);const ball=probe(new T.SphereGeometry(.17,16,12),[0,.38,.62],0xc95435);probeRoot.remove(ball);lever.add(ball);}if(name==='shaft-motor'){probe(new T.CylinderGeometry(.08,.08,.5,20),[0,.25,-.25],0xc0b8a7);probe(new T.BoxGeometry(.06,.04,.2),[0,.45,-.25],0xc95435);}if(name==='socket-board'){for(const x of [-1.45,-.6,.3,1.2])for(const z of [.75,1.5])probe(new T.CylinderGeometry(.09,.09,.10,12),[x,.1,z]);}}
function draw(){const h=Math.max(100,innerHeight-document.querySelector('header').offsetHeight);renderer.setSize(innerWidth,h);const displayBounds=bounds.clone();if(probeRoot.visible)displayBounds.expandByObject(probeRoot);const displaySpan=displayBounds.getSize(new T.Vector3()),displayCentre=displayBounds.getCenter(new T.Vector3());const aspect=innerWidth/h,half=Math.max(displaySpan.y,displaySpan.x/aspect,displaySpan.z)*.73;camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();const dirs=[[3,2.6,4],[.001,6,.001],[0,0,6],[0,0,-6],[6,0,0]];camera.position.copy(displayCentre).add(new T.Vector3(...dirs[view]).normalize().multiplyScalar(10));camera.up.set(0,1,0);if(view===1)camera.up.set(0,0,-1);camera.lookAt(displayCentre);camera.updateMatrixWorld(true);let extentX=0,extentY=0;for(const x of [displayBounds.min.x,displayBounds.max.x])for(const y of [displayBounds.min.y,displayBounds.max.y])for(const z of [displayBounds.min.z,displayBounds.max.z]){const v=new T.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse);extentX=Math.max(extentX,Math.abs(v.x));extentY=Math.max(extentY,Math.abs(v.y));}const framedHalf=Math.max(extentY,extentX/aspect)*1.12;camera.left=-framedHalf*aspect;camera.right=framedHalf*aspect;camera.top=framedHalf;camera.bottom=-framedHalf;camera.updateProjectionMatrix();renderer.render(scene,camera);status.textContent=`${name} · ${raw?'RAW':'FINAL'} · ${stats.triangles} tri · ${stats.materials} mat\nBBox ${span.toArray().map(x=>x.toFixed(3)).join(' × ')} · ракурс ${view} · положение ${phase}`;}
try{const url=raw?`/assets-src/raw/factory-2026-10-27/${name}.glb`:`/models/${name}.glb`;const response=await fetch(url);if(!response.ok)throw Error(`${response.status} ${url}`);const bytes=await response.arrayBuffer();const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);const original=window.createImageBitmap;window.createImageBitmap=undefined;let promise;try{promise=loader.parseAsync(bytes,'')}finally{window.createImageBitmap=original}const gltf=await promise;asset=gltf.scene;scene.add(asset);asset.updateMatrixWorld(true);bounds=new T.Box3().setFromObject(asset);centre=bounds.getCenter(new T.Vector3());span=bounds.getSize(new T.Vector3());let triangles=0;const mats=new Set(),nodes=[];asset.traverse(o=>{nodes.push({name:o.name,position:o.position.toArray()});if(o.isMesh){triangles+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;for(const m of [].concat(o.material)){m.envMapIntensity=1.2;mats.add(m)}}});stats={triangles,materials:mats.size,nodes,bytes:bytes.byteLength,bounds:{min:bounds.min.toArray(),max:bounds.max.toArray()}};document.body.dataset.loaded='true';document.body.dataset.model=name;document.body.dataset.stats=JSON.stringify(stats);addProbes();document.querySelector('#view').onclick=()=>{view=(view+1)%5;draw()};document.querySelector('#probes').onclick=()=>{probeRoot.visible=!probeRoot.visible;draw()};document.querySelector('#pose').onclick=()=>{phase=(phase+1)%3;if(lever)lever.rotation.z=[0,-.55,.55][phase];const coil=asset.getObjectByName('load-coil');if(coil)coil.visible=phase!==1;asset.traverse(o=>{if(o.name.startsWith('wheel-'))o.rotation.z=phase*Math.PI*.45});draw()};addEventListener('resize',draw);draw();}catch(e){status.textContent='Ошибка загрузки: '+e.message;document.body.dataset.error=e.message;console.error(e)}
</script></html>
