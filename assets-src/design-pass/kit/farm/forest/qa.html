<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ферма — карточки леса</title><style>*{box-sizing:border-box}body{margin:0;background:#19231c;color:#f6f2da;font:15px system-ui}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap}select{padding:7px;font:inherit}main{padding:12px;max-width:1060px;margin:auto}h1{font-size:21px;margin:8px 0}p{font-size:13px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{width:310px;max-width:100%;padding:5px;background:#344739}.art{width:300px;height:350px;max-width:100%;position:relative;display:flex;align-items:flex-end;justify-content:center;background:#8bab3f;border-bottom:2px solid #ffb559}.art img{width:300px;max-width:100%;height:300px;object-fit:contain}.thumb{height:142px}.thumb img{width:128px;height:128px}.facts{font:12px monospace;white-space:pre-wrap;margin:6px 0}.path{background-repeat:repeat-y;background-size:87px 350px;background-position:center -175px}.ref{width:300px;max-width:100%}#status{min-height:18px}</style><header><label>Группа <select id="group"><option value="oak">Дубы</option><option value="pine">Сосны и тень</option><option value="path">Дорожка C</option></select></label><label>Фон <select id="background"><option value="grass">Трава</option><option value="black">Чёрный</option><option value="white">Белый</option></select></label><label>Масштаб <select id="scale"><option value="300">300 px</option><option value="128">128 px</option></select></label></header><main><p id="viewport"></p><p id="status" role="status"></p><h1>Карточки леса: рисунок, альфа и нижний контакт</h1><p>Оранжевая линия — нижняя граница карточки. Тень отдельная. Это просмотр ассетов, не реальная игровая сцена.</p><div class="cards" id="cards"></div></main><script>
const groups={oak:['tree-oak-card-a','tree-oak-card-b','tree-oak-card-c'],pine:['tree-pine-card-a','tree-pine-card-b','blob-shadow'],path:['path-strip-c']};let seq=0;const data=fetch('manifest.json').then(r=>r.json());
async function show(){const id=++seq,group=document.querySelector('#group').value,bg=document.querySelector('#background').value,small=document.querySelector('#scale').value==='128';document.querySelector('#status').textContent='Загрузка';const rows=(await data).images;const imgs=await Promise.all(groups[group].map(async name=>{let image=new Image();image.src='textures/'+name+'.webp';await image.decode();return {image,name,row:rows.find(r=>r.name===name)};}));if(id!==seq)return;const cards=document.querySelector('#cards');cards.replaceChildren();for(const {name,image,row}of imgs){const card=document.createElement('section');card.className='card';const title=document.createElement('strong');title.textContent=name;card.append(title);const art=document.createElement('div');art.className='art'+(small?' thumb':'');art.style.backgroundColor=bg==='black'?'#000':bg==='white'?'#fff':'#8bab3f';if(name==='path-strip-c'){art.classList.add('path');art.style.backgroundImage='url('+image.src+')';}else art.append(image);card.append(art);const facts=document.createElement('div');facts.className='facts';facts.textContent=JSON.stringify({size:[row.width,row.height],bytes:row.bytes,alphaMax:row.alpha.max,alphaMean:Math.round(row.alpha.mean),bounds:row.alphaBounds,bottomMargin:row.contactMarginBottom},null,2);card.append(facts);cards.append(card);}document.querySelector('#status').textContent='Готово '+group+' '+bg+' '+(small?'128':'300');document.querySelector('#viewport').textContent='Viewport '+innerWidth+'×'+innerHeight+'; content '+document.documentElement.scrollWidth;}
for(const s of document.querySelectorAll('select'))s.onchange=show;window.addEventListener('resize',()=>{document.querySelector('#viewport').textContent='Viewport '+innerWidth+'×'+innerHeight+'; content '+document.documentElement.scrollWidth});show();
</script></html>
