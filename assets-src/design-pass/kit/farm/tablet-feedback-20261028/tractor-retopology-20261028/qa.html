<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Трактор · ретопология колёс</title><style>body{margin:0;background:#e9e5dc;color:#25342f;font:13px system-ui}header{height:80px;padding:8px;box-sizing:border-box}button,select{padding:6px;margin-right:4px}canvas{display:block}#status{font-size:11px;margin-top:5px}</style><header><select id="source"><option value="originals">Исходный</option><option value="candidate">Кандидат</option><option value="original-mask">Маска исходника</option><option value="mask">Новые поверхности</option></select><button id="view">Ракурс</button><button id="phase">Поворот колёс</button><div id="status">Загрузка…</div></header><script type="module">
import * as T from'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{MeshoptDecoder}from'three/addons/libs/meshopt_decoder.module.js';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';
const q=new URLSearchParams(location.search),source=q.get('source')||'candidate',present=q.has('present');let view=+(q.get('view')||0),phase=+(q.get('phase')||0),asset,sceneRoot,bounds,bodyBaseline=[],stats;document.querySelector('#source').value=source;if(present)document.querySelector('header').style.display='none';const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#e9e5dc');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x897a68,1.3));const light=new T.DirectionalLight(0xffffff,2.5);light.position.set(-3,7,6);scene.add(light);const camera=new T.OrthographicCamera(-1,1,1,-1,.01,100),wheelNodes=[];
function bodyVertices(){const out=[];asset.traverse(o=>{if(o.isMesh&&o.name==='tractor-body'){const a=o.geometry.attributes.position;for(let i=0;i<a.count;i++)out.push(new T.Vector3().fromBufferAttribute(a,i).applyMatrix4(o.matrixWorld))}});return out;}
function render(){const h=innerHeight-(present?0:80);renderer.setSize(innerWidth,h);const center=bounds.getCenter(new T.Vector3()),directions=[[3,2.8,5],[6,0,0],[-6,0,0],[.001,6,.001],[0,0,6],[0,0,-6],[3,-3,5],[-3,2.8,-5]];camera.position.copy(center).add(new T.Vector3(...directions[view]).normalize().multiplyScalar(20));camera.up.set(0,1,0);if(view===3)camera.up.set(0,0,-1);camera.lookAt(center);camera.updateMatrixWorld(true);let ex=0,ey=0;for(const x of[bounds.min.x,bounds.max.x])for(const y of[bounds.min.y,bounds.max.y])for(const z of[bounds.min.z,bounds.max.z]){const p=new T.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse);ex=Math.max(ex,Math.abs(p.x));ey=Math.max(ey,Math.abs(p.y));}const aspect=innerWidth/h,half=Math.max(ey,ex/aspect)*1.14;camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();wheelNodes.forEach(o=>o.rotation.x=phase*Math.PI/180);asset.updateMatrixWorld(true);renderer.render(scene,camera);const bodyNow=bodyVertices(),bodyMaxMovement=Math.max(0,...bodyNow.map((v,i)=>v.distanceTo(bodyBaseline[i]))),wheels=wheelNodes.map(o=>({name:o.name,rotationX:o.rotation.x,pivot:o.getWorldPosition(new T.Vector3()).toArray(),axis:new T.Vector3(1,0,0).transformDirection(o.parent.matrixWorld).toArray()}));document.querySelector('#status').textContent=`${source} · ${stats.triangles} tri · вид ${view} · колёса ${phase}°${source.includes('mask')?' · серый: сохранено; малиновый: срез; оранжевый: новая поверхность':''}`;document.body.dataset.loaded='true';document.body.dataset.result=JSON.stringify({source,view,phase,stats,wheels,bodyVertices:bodyNow.length,bodyMaxMovement,bounds:{min:bounds.min.toArray(),max:bounds.max.toArray()},viewport:[innerWidth,innerHeight],overflow:document.documentElement.scrollWidth>innerWidth});}
try{const bin=await(await fetch(`./${source}/tractor.glb`)).arrayBuffer(),loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder),saved=window.createImageBitmap;window.createImageBitmap=undefined;let promise;try{promise=loader.parseAsync(bin,'')}finally{window.createImageBitmap=saved}sceneRoot=(await promise).scene;sceneRoot.rotation.y=Math.PI;asset=new T.Group();asset.add(sceneRoot);asset.updateMatrixWorld(true);let b=new T.Box3().setFromObject(sceneRoot);sceneRoot.scale.setScalar(3.8/b.getSize(new T.Vector3()).z);asset.updateMatrixWorld(true);b.setFromObject(sceneRoot);const c=b.getCenter(new T.Vector3());sceneRoot.position.set(-c.x,-b.min.y,-c.z);scene.add(asset);asset.updateMatrixWorld(true);bounds=new T.Box3().setFromObject(asset);let tri=0;const mats=new Set();asset.traverse(o=>{if(o.name.startsWith('wheel-'))wheelNodes.push(o);if(o.isMesh){tri+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;for(const m of[].concat(o.material)){m.envMapIntensity=1.2;mats.add(m)}}});stats={triangles:tri,materials:mats.size,bytes:bin.byteLength};bodyBaseline=bodyVertices();render();document.querySelector('#source').onchange=e=>{q.set('source',e.target.value);location.search=q};document.querySelector('#phase').onclick=()=>{phase=(phase+45)%360;render()};document.querySelector('#view').onclick=()=>{view=(view+1)%8;render()};addEventListener('resize',render);}catch(e){document.body.dataset.error=e.message;document.querySelector('#status').textContent=e.message;console.error(e)}
</script></html>
