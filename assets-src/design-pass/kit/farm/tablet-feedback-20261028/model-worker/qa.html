<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Котёнок и трактор · проверка моделей</title><style>body{margin:0;background:#eae6da;color:#24332f;font:13px system-ui}header{padding:8px;height:80px;box-sizing:border-box}button{padding:5px 9px;margin-right:4px}canvas{display:block}#stats{font-size:11px;margin-top:4px}</style><header><button id="source">До / после</button><button id="view">Ракурс</button><button id="phase">Поворот колёс</button><button id="kind">Модель</button><div id="stats">Загрузка…</div></header><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{MeshoptDecoder}from'three/addons/libs/meshopt_decoder.module.js';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';import{loadModels,model}from'/src/parts/assets.ts';
const q=new URLSearchParams(location.search),name=q.get('m')||'tractor',source=q.get('source')||'originals',loft=q.has('loft');let view=+(q.get('view')||0),phase=+(q.get('phase')||0),asset,stats,bounds;
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#eae6da');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.add(new T.HemisphereLight(0xffffff,0x897a68,1.3));const light=new T.DirectionalLight(0xffffff,2.5);light.position.set(-3,7,6);scene.add(light);const camera=new T.OrthographicCamera(-1,1,1,-1,.01,100);let nodes=[];if(q.has('present'))document.querySelector('header').style.display='none';
function fit(s,opts){s.rotation.y=opts.rotateY||0;const holder=new T.Group();holder.add(s);holder.updateMatrixWorld(true);let b=new T.Box3().setFromObject(s),size=b.getSize(new T.Vector3()),scale=opts.height?opts.height/size.y:opts.depth?opts.depth/size.z:1;s.scale.setScalar(scale);holder.updateMatrixWorld(true);b.setFromObject(s);const c=b.getCenter(new T.Vector3());s.position.set(-c.x,-b.min.y,-c.z);return holder;}
function render(){const h=innerHeight-(q.has('present')?0:80);renderer.setSize(innerWidth,h);const center=bounds.getCenter(new T.Vector3()),directions=[[3,2.8,5],[6,0,0],[-6,0,0],[.001,6,.001],[0,0,6],[0,0,-6],[3,-3,5]];camera.position.copy(center).add(new T.Vector3(...directions[view]).normalize().multiplyScalar(20));camera.up.set(0,1,0);if(view===3)camera.up.set(0,0,-1);camera.lookAt(center);camera.updateMatrixWorld(true);let ex=0,ey=0;for(const x of[bounds.min.x,bounds.max.x])for(const y of[bounds.min.y,bounds.max.y])for(const z of[bounds.min.z,bounds.max.z]){const p=new T.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse);ex=Math.max(ex,Math.abs(p.x));ey=Math.max(ey,Math.abs(p.y));}const aspect=innerWidth/h,half=Math.max(ey,ex/aspect)*1.14;camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();asset.traverse(o=>{if(o.name.startsWith('wheel-'))o.rotation.x=phase*Math.PI/180});asset.updateMatrixWorld(true);renderer.render(scene,camera);document.querySelector('#stats').textContent=`${name} · ${source} · ${stats.triangles} tri · вид ${view} · колёса ${phase}°`;document.body.dataset.result=JSON.stringify({name,source,loft,view,phase,stats,nodes,bounds:{min:bounds.min.toArray(),max:bounds.max.toArray()},viewport:[innerWidth,innerHeight],overflow:document.documentElement.scrollWidth>innerWidth});document.body.dataset.loaded='true';}
try{const opts=name==='kitten'?{height:.75}:{depth:3.8,rotateY:Math.PI};if(source==='public'){await loadModels([name]);asset=model(name,opts);if(!asset)throw Error('Production loader failed');document.body.dataset.runtimeLoader='src/parts/assets.ts';}else{const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder),bin=await(await fetch(`./${source}/${name}.glb`)).arrayBuffer(),old=window.createImageBitmap;window.createImageBitmap=undefined;let p;try{p=loader.parseAsync(bin,'')}finally{window.createImageBitmap=old}asset=fit((await p).scene,opts);}scene.add(asset);let triangles=0;const mats=new Set();asset.traverse(o=>{nodes.push({name:o.name,position:o.position.toArray(),rotation:o.rotation.toArray(),scale:o.scale.toArray()});if(o.isMesh){triangles+=(o.geometry.index?.count||o.geometry.attributes.position.count)/3;for(const m of[].concat(o.material)){m.envMapIntensity=1.2;mats.add(m);if(q.has('wire'))m.wireframe=true;}}});stats={triangles,materials:mats.size};if(loft&&name==='kitten'){await loadModels(['hayloft']);const hay=model('hayloft',{});if(!hay)throw Error('Missing hayloft');scene.add(hay);asset.position.set(.3,1.95,.2);asset.rotation.y=-.6;bounds=new T.Box3().setFromObject(hay).union(new T.Box3().setFromObject(asset));}else bounds=new T.Box3().setFromObject(asset);render();document.querySelector('#source').onclick=()=>{q.set('source',source==='originals'?'candidate':'originals');location.search=q};document.querySelector('#view').onclick=()=>{view=(view+1)%7;render()};document.querySelector('#phase').onclick=()=>{phase=(phase+45)%360;render()};document.querySelector('#kind').onclick=()=>{q.set('m',name==='kitten'?'tractor':'kitten');location.search=q};addEventListener('resize',render);}catch(e){document.body.dataset.error=e.message;document.querySelector('#stats').textContent=e.message;console.error(e)}
</script></html>
