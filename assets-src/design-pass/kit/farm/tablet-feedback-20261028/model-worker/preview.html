<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Котёнок на сеновале · до и после</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#eae6da;color:#28342f;font:16px system-ui}h1{font-size:28px;margin:0 0 8px}p{margin:0 0 20px;color:#536158}main{display:grid;grid-template-columns:1fr 1fr;gap:22px}section{border:1px solid #d3d0c5;border-radius:14px;overflow:hidden}h2{font-size:18px;margin:18px 18px 0}iframe{display:block;border:0;width:100%;height:600px}footer{margin-top:16px;font-size:14px}@media(max-width:650px){body{padding:12px}main{gap:8px}iframe{height:430px}h1{font-size:23px}h2{margin:12px;font-size:16px}}</style><h1>Котёнка стало легче заметить</h1><p>Бело-серый окрас выделяется на рыжем сеновале.</p><main><section><h2>До</h2><iframe src="qa.html?m=kitten&amp;source=originals&amp;loft=1&amp;present=1"></iframe></section><section><h2>После</h2><iframe src="qa.html?m=kitten&amp;source=public&amp;loft=1&amp;present=1"></iframe></section></main><footer>Размер, форма и положение котёнка сохранены.</footer><script>const timer=setInterval(()=>{const frames=[...document.querySelectorAll('iframe')];if(frames.every(f=>f.contentDocument?.body?.dataset.loaded==='true')){document.body.dataset.loaded='true';clearInterval(timer)}},100);</script></html>
