<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ферма: дом и вход</title><style>body{margin:0;font:13px system-ui;background:#e9ead8;color:#263c35}header{box-sizing:border-box;height:100px;padding:8px}button,select{padding:6px;margin:2px}canvas{display:block}#status{font-size:11px;overflow-wrap:anywhere}@media(max-width:600px){header{height:140px}}</style><header><b>Дом · проверка карточки и точки трубы</b><br><select id="view" aria-label="Вид"><option value="house">Дом</option><option value="row">Здания рядом</option><option value="pigsty">Вход свинарника</option></select><button id="version">Показать прежний дом</button><button id="anchor">Точка дыма</button><div id="status">Загрузка…</div></header><script type="module">
import * as T from 'three';
import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';
import {loadModels,model} from '/src/parts/assets.ts';
import {cards,loadKit,kitPieces} from '/src/kit.ts';
const V=new T.Vector3(0,1,.78).normalize(),U=new T.Vector3(0,V.z,-V.y);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#dbe5ba');const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.75;scene.add(new T.HemisphereLight('#fffaf0','#d9c5ac',.4));const sun=new T.DirectionalLight('#fff3df',3);sun.position.set(-7,12,5);scene.add(sun);const fill=new T.DirectionalLight('#e8f2ff',1.1);fill.position.set(8,6,-6);scene.add(fill);
const camera=new T.OrthographicCamera(-1,1,1,-1,.1,200);let view='house',newHouse=true,markerOn=false;const old={},specs={farmhouse:[-38.5,-25.5,11],barn:[-16,-27,10.5],coop:[8,-23.5,4.6],pigsty:[27,-26.5,10]};
await loadKit('farm',['farmhouse-card']);const tex=kitPieces('farm','farmhouse-card')[0];if(!tex)throw Error('farmhouse card missing from kit');const loader=new T.TextureLoader();
const grass=await loader.loadAsync('/textures/kit/farm/grass-main-a.webp');grass.colorSpace=T.SRGBColorSpace;grass.wrapS=grass.wrapT=T.RepeatWrapping;grass.repeat.set(10,7);const ground=new T.Mesh(new T.PlaneGeometry(120,84),new T.MeshStandardMaterial({map:grass,color:'#c4d79f',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.02;scene.add(ground);
let house,marker,contract,bounds={};
function render(){if(!house)return;const HH=document.querySelector("header").getBoundingClientRect().height;renderer.setSize(innerWidth,innerHeight-HH);const aspect=innerWidth/(innerHeight-HH);const target=view==='house'?new T.Vector3(-38.5,3,-25):view==='pigsty'?new T.Vector3(27,2,-25):new T.Vector3(-20,3,-25);const half=view==='row'?Math.max(10,35/aspect):Math.max(6.8,7/aspect);camera.position.copy(target).addScaledVector(V,90);camera.lookAt(target);camera.left=-half*aspect;camera.right=half*aspect;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();camera.updateMatrixWorld();for(const [n,o]of Object.entries(old))o.visible=n==='farmhouse'?!newHouse:true;house.visible=newHouse;marker.visible=newHouse&&markerOn;renderer.render(scene,camera);const p=marker.position.clone().project(camera);const screen=[(p.x+1)*innerWidth/2,(1-p.y)*(innerHeight-HH)/2+HH];const result={loaded:true,newHouse,view,markerOn,viewport:[innerWidth,innerHeight],overflow:document.documentElement.scrollWidth>innerWidth,sourcePixels:[1350,1165],texturePixels:[tex.image.width,tex.image.height],contract,anchorScreen:screen,modelBounds:bounds,drawCalls:renderer.info.render.calls};document.body.dataset.result=JSON.stringify(result);document.body.dataset.loaded='true';document.querySelector('#status').textContent=`${newHouse?'Рисованный дом':'Прежняя модель'} · ширина силуэта 11 · труба ${contract.chimneyWorld.map(x=>x.toFixed(3)).join(', ')} · ${innerWidth}×${innerHeight}`;}
try{await loadModels(Object.keys(specs));for(const[n,[x,z,w]]of Object.entries(specs)){const o=model(n,{width:w,rotateY:-Math.PI/2});if(!o)throw Error('No model '+n);o.position.set(x,0,z);old[n]=o;scene.add(o);o.updateMatrixWorld(true);const b=new T.Box3().setFromObject(o);bounds[n]={min:b.min.toArray(),max:b.max.toArray()};}
const fullWidth=11*1350/1302,frontZ=bounds.farmhouse.max[2],origin=new T.Vector3(-38.5,0,frontZ).addScaledVector(U,-(1-1135/1165)*(tex.image.height/tex.image.width)*fullWidth);house=cards([{x:origin.x,z:origin.z,size:fullWidth}],[tex]);house.position.y=origin.y;scene.add(house);
// Map source pixels onto the actual full-canvas card. Height is based on decoded WebP aspect.
function pixelPoint(px,py){return origin.clone().add(new T.Vector3((px/1350-.5)*fullWidth,0,0)).addScaledVector(U,(1-py/1165)*(tex.image.height/tex.image.width)*fullWidth);}
const chimney=pixelPoint(1120,42);marker=new T.Mesh(new T.SphereGeometry(.085,12,8),new T.MeshBasicMaterial({color:0xe73cda,depthTest:false}));marker.position.copy(chimney);marker.renderOrder=99;scene.add(marker);contract={fullCanvasWidth:fullWidth,origin:origin.toArray(),sourceGroundPixel:[675,1135],sourceChimneyPixel:[1120,42],chimneyWorld:chimney.toArray(),chimneyLocalToOldHouse:chimney.clone().sub(new T.Vector3(-38.5,0,-25.5)).toArray(),normal:V.toArray(),up:U.toArray(),material:'actual cards(): MeshStandardMaterial, alphaTest .45, DoubleSide',smokeBaked:false};
document.querySelector('#view').onchange=e=>{view=e.target.value;render()};document.querySelector('#version').onclick=()=>{newHouse=!newHouse;document.querySelector('#version').textContent=newHouse?'Показать прежний дом':'Показать рисованный дом';render()};document.querySelector('#anchor').onclick=()=>{markerOn=!markerOn;render()};addEventListener('resize',render);render();}catch(e){document.body.dataset.error=e.message;document.querySelector('#status').textContent=e.message;console.error(e);}
</script></html>
