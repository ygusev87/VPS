<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход свинарника</title><style>body{margin:0;font:13px system-ui;color:#293d31;background:#e6ead6}header{height:100px;padding:8px;box-sizing:border-box}button,select{padding:5px;margin:2px}canvas{display:block}#status{font-size:11px}@media(max-width:600px){header{height:140px}}</style><header><b>Свинарник · пол и подход к двору</b><br><button id="version">Прежний пол</button><button id="path">Убрать подход</button><select id="view" aria-label="Вид"><option value="game">Камера игры</option><option value="front">Вход крупно</option><option value="top">Сверху</option><option value="yard">Проём забора и двор</option></select><div id="status">Загрузка…</div></header><script type="module">
import*as T from'three';import{RoomEnvironment}from'three/examples/jsm/environments/RoomEnvironment.js';import{loadModels,model}from'/src/parts/assets.ts';import{loadKit,kitPieces,ribbons,toned,decal,ovalMask}from'/src/kit.ts';import{fences}from'/src/decor.ts';import{FENCES}from'/src/farm-decor.ts';
const root='/assets-src/design-pass/kit/farm/tablet-feedback-20261028/pigsty-main/';const originalName='../'+root.slice(1)+'originals/pigsty',candidateName='pigsty';const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NeutralToneMapping;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#dbe5ba');scene.environment=new T.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.75;scene.add(new T.HemisphereLight('#fffaf0','#d9c5ac',.4));const sun=new T.DirectionalLight('#fff3df',3);sun.position.set(-7,12,5);scene.add(sun);const fill=new T.DirectionalLight('#e8f2ff',1.1);fill.position.set(8,6,-6);scene.add(fill);const camera=new T.OrthographicCamera(-1,1,1,-1,.1,200),V=new T.Vector3(0,1,.78).normalize();let view='game',fresh=true,pathOn=true,before,after,approach;const loader=new T.TextureLoader();await loadKit('farm',['grass-main','path-strip']);const grass=kitPieces('farm','grass-main',true)[0];grass.repeat.set(6,6);const g=new T.Mesh(new T.PlaneGeometry(70,70),new T.MeshStandardMaterial({map:grass,color:'#c4d79f',roughness:1}));g.rotation.x=-Math.PI/2;g.position.set(27,-.02,-24);scene.add(g);const mudtex=await loader.loadAsync('/textures/farm/pig-mud.webp');mudtex.colorSpace=T.SRGBColorSpace;const mud=decal({x0:22.4,z0:-20.4,x1:33.6,z1:-13.8},mudtex,0,.004);mud.material.alphaMap=ovalMask();scene.add(mud);const pathtex=kitPieces('farm','path-strip',true)[0];approach=toned(ribbons([{pts:[[27,-22.7],[27,-19.5]],w:1}],pathtex,3.6,8.8,.006,-1,.3),'#c8d4f0');scene.add(approach);
function render(){if(!before)return;const HH=document.querySelector('header').getBoundingClientRect().height,h=innerHeight-HH,a=innerWidth/h;renderer.setSize(innerWidth,h);const target=new T.Vector3(27,view==='yard'?1:2,view==='yard'?-20:-25);const dir=view==='top'?new T.Vector3(.001,1,.001):view==='front'?new T.Vector3(0,.2,1).normalize():V;camera.up.set(0,1,0);if(view==='top')camera.up.set(0,0,-1);camera.position.copy(target).addScaledVector(dir,80);camera.lookAt(target);const half=Math.max(view==='yard'?9:7,7/a);camera.left=-half*a;camera.right=half*a;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();before.visible=!fresh;after.visible=fresh;approach.visible=pathOn;renderer.render(scene,camera);const state={loaded:true,fresh,pathOn,view,viewport:[innerWidth,innerHeight],overflow:document.documentElement.scrollWidth>innerWidth,modelSource:candidateName,modelFit:{width:10,rotateY:-Math.PI/2,world:[27,0,-26.5]},approach:{points:[[27,-22.7],[27,-19.5]],w:1,wide:3.6,length:8.8,y:.006,order:-1,overlap:.3,tone:'#c8d4f0',fullBounds:{x:[25.2,28.8],z:[-23,-19.2]},northFenceGap:[24.456,29.584],mud:{x:28,z:-17.1,rx:5.6,rz:3.3},renderedWithActualFenceHelper:true},drawCalls:renderer.info.render.calls};document.body.dataset.loaded='true';document.body.dataset.result=JSON.stringify(state);document.querySelector('#status').textContent=`${fresh?'Земляной пол':'Светлый прежний пол'} · ${pathOn?'подход через проём к грязевому двору':'без подхода'} · ${innerWidth}×${innerHeight}`;}
try{await loadModels([originalName,candidateName,'fence-lite','fence-post-lite','pig']);before=model(originalName,{width:10,rotateY:-Math.PI/2});after=model(candidateName,{width:10,rotateY:-Math.PI/2});if(!before||!after)throw Error('Missing pigsty GLB');before.position.set(27,0,-26.5);after.position.copy(before.position);scene.add(before,after);const nearby=FENCES.filter(line=>line.every(([x,z])=>x>=18&&x<=36&&z<=-10.8&&z>=-21));scene.add(fences(nearby.map(line=>line.map(([x,z])=>new T.Vector3(x,0,z)))));for(const[x,z,w,yaw]of[[24,-18,1.3,-.4],[32,-16,1.1,2.1],[30.5,-16,1.7,.3]]){const p=model('pig',{width:w});if(p){p.position.set(x,0,z);p.rotation.y=yaw;scene.add(p);}}document.querySelector('#version').onclick=()=>{fresh=!fresh;document.querySelector('#version').textContent=fresh?'Прежний пол':'Новый пол';render()};document.querySelector('#path').onclick=()=>{pathOn=!pathOn;document.querySelector('#path').textContent=pathOn?'Убрать подход':'Показать подход';render()};document.querySelector('#view').onchange=e=>{view=e.target.value;render()};addEventListener('resize',render);render();}catch(e){document.body.dataset.error=e.message;document.querySelector('#status').textContent=e.message;console.error(e);}
</script></html>
