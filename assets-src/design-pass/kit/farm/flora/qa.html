<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Флора — прозрачность и мелкий размер</title>
<style>body{margin:0;background:#eee7d9;color:#18213d;font:14px system-ui}header{padding:12px}h1{font-size:21px;margin:4px 0}nav{display:flex;gap:10px;flex-wrap:wrap}a{color:#12655f}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:8px}figure{margin:0;border:1px solid #bba98c}.art{height:328px;display:flex;align-items:flex-end;justify-content:center}.large{width:320px;height:320px;max-width:100%;object-fit:contain}.white{background:#fff}.black{background:#000}.grass{background:#85ae48 url('/public/textures/kit/farm/grass-main-a.webp') repeat;background-size:256px}.small{display:flex;align-items:flex-end;justify-content:space-around;height:82px;border-top:1px solid #aa9}.small img{object-fit:contain}.sizes,figcaption{padding:6px;text-align:center;background:#eee3cf;color:#18213d}.sizes{font-size:11px}pre{padding:12px;white-space:pre-wrap;font-size:11px}.contact{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;padding:8px}.contact img{width:100%;height:120px;object-fit:contain}.contact figcaption{font-size:10px}</style>
<header><h1>Луга · WebP: альфа, основание, мелкий размер</h1><nav id="nav"></nav><p id="caption"></p></header><div id="contact" class="contact"></div><main id="panels" class="panels"></main><pre id="metrics"></pre>
<script type="module">
const manifest=await fetch('manifest.json',{cache:'no-store'}).then(r=>r.json()),names=manifest.assets.map(a=>a.name),selected=new URLSearchParams(location.search).get('asset')??'all';
for(const n of ['all',...names]){const a=document.createElement('a');a.href='?asset='+n;a.textContent=n;nav.append(a);}
const src=n=>'/public/textures/kit/farm/'+n+'.webp?v='+manifest.assets.find(a=>a.name===n).sha256;
if(selected==='all'){
 caption.textContent='Девять вариантов на фактической траве. Это просмотр изображений, не кадр игры.';
 for(const name of names){const f=document.createElement('figure');f.className='grass';const i=new Image();i.src=src(name);i.alt=name;const c=document.createElement('figcaption');c.textContent=name;f.append(i,c);contact.append(f);}
}else{
 const a=manifest.assets.find(x=>x.name===selected);if(!a)throw Error('Unknown asset');caption.textContent=selected+' · '+a.size.join('×')+' · '+a.bytes+' bytes · нижний ряд:32 /48 /64 px';
 for(const [bg,label]of [['white','Белый'],['black','Чёрный'],['grass','grass-main-a']]){
  const f=document.createElement('figure');f.className=bg;const large=document.createElement('div');large.className='art';const i=new Image();i.src=src(selected);i.alt=selected+' / '+label;i.className='large';large.append(i);const small=document.createElement('div');small.className='small';
  for(const s of [32,48,64]){const im=new Image();im.src=src(selected);im.alt=s+'px';im.style.width=s+'px';im.style.height=s+'px';small.append(im);}
  const c=document.createElement('figcaption');c.textContent=label;f.append(large,small,c);panels.append(f);
 }
 metrics.textContent=JSON.stringify({name:a.name,pivot:a.pivot,alpha:a.alpha},null,2);
}
await Promise.all([...document.images].map(i=>i.decode()));document.body.dataset.ready='true';
</script></html>
