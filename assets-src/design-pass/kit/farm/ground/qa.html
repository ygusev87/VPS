<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Набор фермы — проверка текстур</title><style>
*{box-sizing:border-box}body{margin:0;background:#17211a;color:#f5f3df;font:15px system-ui}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap}select,button{font:inherit;padding:8px}main{margin:auto;width:1024px;max-width:100%;padding:10px}h1{font-size:20px;margin:5px 0}p{font-size:13px;margin:6px 0}.samples{display:flex;gap:12px;flex-wrap:wrap}.sample{width:540px;height:540px;max-width:100%;background-color:#8bab3f;position:relative;flex-shrink:0}.reference{width:380px;max-width:100%;align-self:flex-start}.reference img{width:100%}.label{position:absolute;bottom:4px;left:4px;background:#17211abb;padding:4px}.strips{background-size:128px 512px;background-repeat:repeat}.patch{background-size:100% 100%;background-repeat:no-repeat}.grass{background-size:180px 180px;background-repeat:repeat}.alpha-bg{background-color:#8bab3f;background-image:conic-gradient(#d5d0b8 25%,#303b35 0 50%,#d5d0b8 0 75%,#303b35 0);background-size:32px 32px}.detail{position:relative;width:540px;height:540px;max-width:100%;overflow:hidden}.detail img{width:100%;height:100%;object-fit:contain}#report{white-space:pre-wrap;font:12px monospace;padding:8px}body.mobile main{width:390px}.hidden{display:none}
</style><header><label>Ассет <select id="asset"></select></label><label>Ширина <select id="size"><option value="1024">1024 px</option><option value="390">390 px</option></select></label><label>Фон <select id="back"><option value="grass">Трава</option><option value="checker">Контрастная шахматка</option><option value="black">Чёрный</option><option value="white">Белый</option></select></label></header><main><p id="viewport-size"></p><p id="ready" role="status"></p><h1 id="title"></h1><p>Исходный рисунок → WebP. Слева — повторение 3×3 для травы / длина и стык полосы / полное пятно. Справа — ориентир стиля farm-a. Это проверка ассета, не кадр игры.</p><div class="samples"><div id="sample" class="sample"></div><div class="reference"><img src="farm-a.png" alt="Концепт фермы A"><pre id="report"></pre></div></div></main><script>
const names=['grass-main-a','grass-main-b','grass-sunny-a','grass-sunny-b','path-strip-a','path-strip-b','path-patch-a','path-patch-b','path-patch-c'];
const sel=document.querySelector('#asset'),sample=document.querySelector('#sample'),report=document.querySelector('#report');for(const n of names)sel.add(new Option(n,n));
const manifest=fetch('manifest.json').then(r=>r.json());
async function show(){document.querySelector('#ready').textContent='Загрузка';const name=sel.value,m=(await manifest).images.find(x=>x.name===name);document.querySelector('#title').textContent=name;sample.style.backgroundImage='';sample.innerHTML='';sample.className='sample';const url='textures/'+name+'.webp';const loaded=new Image();loaded.src=url;await loaded.decode();if(name.startsWith('grass')){sample.classList.add('grass');sample.style.backgroundImage=`url(${url})`;}else {const b=document.querySelector('#back').value;sample.classList.toggle('alpha-bg',b==='checker');sample.style.backgroundColor=b==='black'?'#000':b==='white'?'#fff':'#8bab3f';const layer=document.createElement('div');layer.style.cssText='position:absolute;inset:0;background-position:center;background-repeat:repeat-y;';layer.style.backgroundImage=`url(${url})`;layer.style.backgroundSize=name.startsWith('path-strip')?'135px 540px':'contain';if(name.startsWith('path-patch'))layer.style.backgroundRepeat='no-repeat';else layer.style.backgroundPosition='center -270px';sample.append(layer);}report.textContent=JSON.stringify({name,dimensions:[m.width,m.height],source:[m.sourceWidth,m.sourceHeight],bytes:m.bytes,alpha:m.alpha,edgeDifference:m.opposingEdgeMeanAbsoluteRgbDifference},null,2);document.querySelector('#ready').textContent='Готово '+name;}
function viewport(){document.querySelector('#viewport-size').textContent='Viewport '+window.innerWidth+'×'+window.innerHeight+'; content width '+document.documentElement.scrollWidth;}window.addEventListener('resize',viewport);viewport();sel.onchange=show;document.querySelector('#back').onchange=show;document.querySelector('#size').onchange=e=>{document.body.classList.toggle('mobile',e.target.value==='390');show();};show();
</script></html>
