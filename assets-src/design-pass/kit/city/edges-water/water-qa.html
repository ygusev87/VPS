<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City water QA</title><style>*{box-sizing:border-box}body{margin:0;background:#eee7db;color:#28352b;font:14px system-ui}header{padding:10px}select{font:inherit;padding:8px}main{padding:8px}canvas{display:block;max-width:100%;height:auto;margin:auto}#status{padding:8px;font:12px monospace}</style><header><label>Проверка <select id="mode"><option value="canal">Канал ·3повтора и2берега</option><option value="quay">Набережная · альфа</option><option value="harbour">Гавань · альфа /10×6</option></select></label></header><main><canvas width="960" height="560"></canvas><p id="note"></p></main><div id="status"></div><script>
const names=['canal-water','quay-strip','harbour-water','paving-main-c'];const imgs={},errors=[];const c=document.querySelector('canvas'),ctx=c.getContext('2d');
window.onerror=(m)=>{errors.push(String(m));status()};function status(){document.querySelector('#status').textContent=JSON.stringify({mode:document.querySelector('select').value,viewport:[innerWidth,innerHeight],scroll:document.documentElement.scrollWidth,loaded:Object.keys(imgs).length,errors});}
function tile(n,x,y,w,h,tw,th){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();for(let yy=y;yy<y+h;yy+=th)for(let xx=x;xx<x+w;xx+=tw)ctx.drawImage(imgs[n],xx,yy,tw,th);ctx.restore()}
function label(t,x,y){ctx.fillStyle='#26332b';ctx.font='16px system-ui';ctx.fillText(t,x,y)}
function bank(center,y,len,ppu,flip){ctx.save();ctx.translate(center,y);if(flip){ctx.translate(0,len);ctx.rotate(Math.PI)}tile('quay-strip',-.6*ppu,0,1.2*ppu,len,1.2*ppu,6*ppu);ctx.restore()}
function draw(){ctx.fillStyle='#eee7db';ctx.fillRect(0,0,960,560);let mode=document.querySelector('select').value,note='';if(mode==='canal'){tile('paving-main-c',0,30,960,530,192,192);for(let [x,p] of [[130,24],[360,12],[520,4],[650,40]]){let y=60,h=Math.min(480,18*p);tile('canal-water',x,y,3*p,h,3*p,6*p);bank(x-.3*p,y,h,p,false);bank(x+3.3*p,y,h,p,true);label(p+'px/ед',x,24)}note='Канал3ед, период6ед; берега1.2ед, центр на0.3ед снаружи воды. Правый берег повёрнут180°. Наименьший вариант — общий вид около4px/ед.';}
if(mode==='quay'){for(let [i,bg] of ['#fff','#111','#20b3c7'].entries()){ctx.fillStyle=bg;ctx.fillRect(12+i*314,36,300,510);tile('quay-strip',30+i*314,36,96,510,96,384);tile('quay-strip',180+i*314,36,24,510,24,120)}label('Белый / чёрный / вода; широкий и игровой вид',12,24);note='Native alpha без threshold/перекраски. При повторе сохранены полукамни на верхнем/нижнем краю.';}
if(mode==='harbour'){for(let [i,bg] of ['#fff','#111','#b9c890'].entries()){ctx.fillStyle=bg;ctx.fillRect(12+i*314,36,300,240);ctx.drawImage(imgs['harbour-water'],22+i*314,60,280,168)}tile('paving-main-c',12,300,936,250,192,192);ctx.drawImage(imgs['harbour-water'],30,320,320,192);ctx.drawImage(imgs['harbour-water'],430,350,160,96);ctx.drawImage(imgs['harbour-water'],680,380,40,24);label('Круглый PNG → игровая эллиптическая гавань10×6',12,24);note='Без земли/лодок/пирса. Проверены белый, чёрный, зелёный и текущая плитка. Размеры32/16/4px на единицу.';}
document.querySelector('#note').textContent=note;status()}
Promise.all(names.map(n=>new Promise((ok,fail)=>{let im=new Image;im.onload=()=>{imgs[n]=im;ok()};im.onerror=()=>{errors.push(n+' failed');fail()};im.src='/textures/'+n+'.webp'}))).then(draw).catch(status);document.querySelector('select').onchange=draw;window.onresize=status;
</script></html>
