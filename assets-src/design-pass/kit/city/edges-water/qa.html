<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City surfaces QA</title><style>*{box-sizing:border-box}body{margin:0;background:#eee7db;color:#28352b;font:14px system-ui}header{padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}select{padding:8px;font:inherit}main{padding:8px}canvas{display:block;max-width:100%;height:auto;margin:auto;border:1px solid #c4b9a5}#status{padding:8px;font:12px monospace}p{margin:6px 0}</style><header><label>Проверка <select id="mode"><option value="compare">Плитка A / C · 64 и128px на8ед</option><option value="repeat">C · повтор3×3</option><option value="kerb">Бордюр · alpha / стыки</option><option value="lawn">Бордюр · газон18×12</option></select></label></header><main><canvas width="960" height="560"></canvas><p id="note"></p></main><div id="status"></div><script>
const names=['paving-main-a','paving-main-c','kerb-strip','lawn-main-a'];let errors=[];const imgs={};const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
window.addEventListener('error',e=>{errors.push(e.message);status()});
function status(){document.querySelector('#status').textContent=JSON.stringify({mode:document.querySelector('select').value,viewport:[innerWidth,innerHeight],scroll:document.documentElement.scrollWidth,loaded:Object.keys(imgs).length,errors});}
function tile(name,x,y,w,h,tw,th=tw){const img=imgs[name];ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();for(let yy=y;yy<y+h;yy+=th)for(let xx=x;xx<x+w;xx+=tw)ctx.drawImage(img,xx,yy,tw,th);ctx.restore();}
function label(s,x,y){ctx.fillStyle='#233428';ctx.font='16px system-ui';ctx.fillText(s,x,y)}
function draw(){const mode=document.querySelector('select').value;ctx.fillStyle='#eee7db';ctx.fillRect(0,0,960,560);let note='';if(mode==='compare'){for(const [i,n] of ['paving-main-a','paving-main-c'].entries()){let x=12+i*474;label(n,x,25);tile(n,x,36,462,190,64);tile(n,x,270,462,270,128);}label('64px / 8 world',16,249);label('128px / 8 world',490,249);note='A слева; C справа. Четыре квадрата на8ед, крупная сетка. Без runtime tint.';}
if(mode==='repeat'){label('C · 3×3 по170px; справа стык при340px',12,24);tile('paving-main-c',12,36,510,510,170);tile('paving-main-c',540,36,408,510,340);note='Повтор без зеркал, blend и модификации пикселей; тонкие фактурные стыки допускаются только после просмотра.';}
if(mode==='kerb'){for(const [i,bg] of ['#fff','#111','#91b45a'].entries()){ctx.fillStyle=bg;ctx.fillRect(12+i*200,36,184,510);tile('kerb-strip',24+i*200,36,64,510,64,512);tile('kerb-strip',120+i*200,36,16,510,16,128);}label('alpha: white / black / green; справа ×3 repeat',12,24);ctx.fillStyle='#879f51';ctx.fillRect(624,36,320,510);tile('kerb-strip',650,36,32,510,32,256);tile('kerb-strip',720,36,64,510,64,512);note='256×2048 на0.5×4ед. Линия64px — увеличение,16px — близкий игровой вид. Период связан с шириной8:1.';}
if(mode==='lawn'){tile('paving-main-c',0,0,960,560,192);tile('lawn-main-a',186,126,432,288,192);const img=imgs['kerb-strip'];for(const [x,y,len,angle] of [[186,126,432,-Math.PI/2],[618,126,288,0],[618,414,432,Math.PI/2],[186,414,288,Math.PI]]){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.beginPath();ctx.rect(-6,0,12,len);ctx.clip();for(let a=0;a<len;a+=96)ctx.drawImage(img,-6,a,12,96);ctx.restore()}label('18×12ед; бордюр0.5ед, период4ед',20,28);note='Проверка фактуры/масштаба и альфа на газоне. Прямоугольные углы схематичны: runtime ribbons/стыки проверяет Claude.';}
document.querySelector('#note').textContent=note;status();}
Promise.all(names.map(n=>new Promise((resolve,reject)=>{let im=new Image;im.onload=()=>{imgs[n]=im;resolve()};im.onerror=()=>{errors.push(n+' failed');reject()};im.src='/textures/'+n+'.webp'}))).then(draw).catch(status);document.querySelector('select').onchange=draw;window.onresize=status;
</script></html>
