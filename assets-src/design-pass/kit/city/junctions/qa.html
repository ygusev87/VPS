<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Город: проверка дорожных стыков</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e1d2;color:#253239;font:15px system-ui}header{padding:10px;display:flex;flex-wrap:wrap;gap:8px}select{font:inherit;padding:6px}main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;padding:0 10px}canvas{display:block;width:100%;height:auto}aside{min-width:0}p{margin:5px 0}#alpha{margin:8px 0}#status{padding:8px;font-size:13px}h1{font-size:18px;margin:8px 10px}@media(max-width:600px){main{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:8px}#alpha{margin:0}aside p{grid-column:1/-1}}</style><h1>Город: дорожные стыки</h1><header><label>Плитка <select id="asset"><option>road-corner</option><option>road-tee</option><option>road-cross</option><option>road-end</option><option>zebra</option></select></label><label>Поворот <select id="turn"><option value="0">0°</option><option value="1">90°</option><option value="2">180°</option><option value="3">270°</option></select></label></header><main><section><canvas id="join" width="768" height="768" aria-label="Плитка с примыкающими прямыми дорогами"></canvas><p>Прямые участки: road-strip-a. Все края сходятся без маскировки.</p></section><aside><canvas id="alpha" width="600" height="200" aria-label="Альфа на белом чёрном и зелёном"></canvas><img id="reference" src="/city-a.png" style="width:100%;height:auto" alt="Принятый стиль города A"><p>Проверка исходной ширины, цвета асфальта, бордюров и поворота. Не игровой кадр.</p></aside></main><div id="status" role="status">Загрузка…</div><script>
const assets=['road-corner','road-tee','road-cross','road-end','zebra','road-strip-a'];let images={};
async function start(){await Promise.all(assets.map(n=>new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>{images[n]=i;resolve()};i.onerror=reject;i.src='/textures/'+n+'.webp'})));draw();}
function draw(){const name=document.querySelector('#asset').value,turn=Number(document.querySelector('#turn').value),cn=document.querySelector('#join'),c=cn.getContext('2d'),N=256,S=768;
 c.fillStyle='#d7c9ae';c.fillRect(0,0,S,S);c.save();c.translate(S/2,S/2);c.rotate(turn*Math.PI/2);c.translate(-S/2,-S/2);
 const st=images['road-strip-a'];const strip=(x,y,r)=>{c.save();c.translate(x+N/2,y+N/2);c.rotate(r*Math.PI/2);c.drawImage(st,0,0,st.width,st.height/2,-N/2,-N/2,N,N);c.restore()};
 const dirs=name==='road-corner'?['S','E']:name==='road-tee'?['W','E','S']:name==='road-end'?['S']:name==='zebra'?['N','S']:['N','E','S','W'];
 for(const d of dirs){if(d==='N')strip(N,0,0);if(d==='S')strip(N,2*N,0);if(d==='W')strip(0,N,1);if(d==='E')strip(2*N,N,1);}
 if(name==='zebra'){strip(N,N,0);c.drawImage(images[name],N+N/14,N+N*2/7,N*6/7,N*3/7);}else c.drawImage(images[name],N,N,N,N);c.restore();
 const a=document.querySelector('#alpha').getContext('2d');['#ffffff','#000000','#8bab3f'].forEach((bg,i)=>{a.fillStyle=bg;a.fillRect(i*200,0,200,200);const h=name==='zebra'?100:200;a.drawImage(images[name],i*200,(200-h)/2,200,h)});
 document.querySelector('#status').textContent='Готово '+name+' · '+(turn*90)+'° · ширина '+document.documentElement.clientWidth+' / scroll '+document.documentElement.scrollWidth;
}
document.querySelectorAll('select').forEach(s=>s.onchange=draw);window.onresize=()=>{if(images['road-strip-a'])draw()};start().catch(e=>document.querySelector('#status').textContent='Ошибка загрузки: '+e.message);
</script></html>
