<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Парк — альфа и геометрия</title>
<style>body{margin:0;background:#eee7d9;color:#18213d;font:14px system-ui}header{padding:10px}h1{font-size:20px;margin:2px 0}nav{display:flex;gap:10px;flex-wrap:wrap}a{color:#12655f}main{padding:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}figure{margin:0;min-width:0}figcaption{font-size:12px;padding:5px}.pad{padding:12px}.park{position:relative;width:100%;aspect-ratio:33/17}.park img{position:absolute;width:100%;height:100%;inset:0}.white{background:white}.black{background:black}.paving-a{background:url('qa/reference-paving-a.webp');background-size:240px}.paving-c{background:url('qa/reference-paving-c.webp');background-size:240px}.outline{position:absolute;border:2px solid #067aff;border-radius:50%;box-sizing:border-box;pointer-events:none}.basin{border:2px dashed #d41b24}.measured{border:2px dotted #e78800}.zone{border:1px dashed #ba1676;border-radius:50%;position:absolute;box-sizing:border-box;pointer-events:none}.zone span{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:10px;background:#fff9;white-space:nowrap;color:#671044}.caption{font-size:12px;line-height:1.5}details{margin:12px 0}pre{font-size:11px;white-space:pre-wrap}.guide main{padding:0}.guide header,.guide .caption,.guide details{display:none}.guide .park{width:100vw;height:100vh;aspect-ratio:auto}.guide .outline{border-width:3px}.guide.fill .outline{background:#067aff;border:0}.guide .pad{padding:0}.guide figcaption{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:18px}.zone span{font-size:7px}}
</style><header><h1>Парк · фактический WebP</h1><nav><a href="?view=alpha">Четыре фона</a><a href="?view=geometry">Геометрия 33×17</a><a href="?view=runtime">Геометрия 33,6×17,6</a></nav><p id="summary"></p></header><main id="main"></main>
<script type="module">
const[m,l]=await Promise.all([fetch('manifest.json',{cache:'no-store'}).then(r=>r.json()),fetch('layout.json',{cache:'no-store'}).then(r=>r.json())]);const view=new URLSearchParams(location.search).get('view')??'alpha',src='/public/textures/kit/city/park-lawn.webp?v='+m.sha256;
document.body.classList.toggle('guide',view==='guide');document.body.classList.toggle('fill',new URLSearchParams(location.search).get('fill')==='1');summary.textContent=m.size.join('×')+' · '+m.bytes+' bytes · исходник '+m.sourceSize.join('×');
function panel(bg,label){const f=document.createElement('figure'),p=document.createElement('div'),park=document.createElement('div'),img=new Image(),c=document.createElement('figcaption');p.className='pad '+bg;park.className='park';img.src=src;img.alt='park-lawn';park.append(img);p.append(park);c.textContent=label;f.append(p,c);return{f,park};}
function ellipse(parent,cx,cy,dx,dy,cls){const e=document.createElement('div');e.className=cls;e.style.left=(cx-dx/2)*100+'%';e.style.top=(cy-dy/2)*100+'%';e.style.width=dx*100+'%';e.style.height=dy*100+'%';parent.append(e);return e;}
if(view==='alpha'){const g=document.createElement('div');g.className='grid';for(const[bg,name]of[['white','Белый'],['black','Чёрный'],['paving-a','Текущий paving A'],['paving-c','Контрастный paving C']])g.append(panel(bg,name).f);main.append(g);}
else{const {f,park}=panel(view==='guide'?'white':'paving-c',view==='runtime'?'Фактический decal: grow0.3 с каждой стороны':'Номинальное игровое покрытие33×17');main.append(f);const width=view==='runtime'?33.6:33,depth=view==='runtime'?17.6:17;if(view!=='guide')park.style.aspectRatio=width+'/'+depth;ellipse(park,.5-3/width,.5+1/depth,6.8/width,6.8/depth,'outline');if(view!=='guide'){ellipse(park,.5-3/width,.5+1/depth,6.4/width,6.4/depth,'outline basin');ellipse(park,...m.geometry.uvCentre,m.geometry.worldDiameter[0]/33,m.geometry.worldDiameter[1]/17,'outline measured');for(const z of l.clearZones){const e=ellipse(park,.5+z.x/width,.5+z.z/depth,z.radius*2/width,z.radius*2/depth,'zone');const label=document.createElement('span');label.textContent=z.name;e.append(label);}}}
const text=document.createElement('p');text.className='caption';text.textContent='Синий: нужное свободное место6,8ед. Красный: модельный радиус3,2. Оранжевый: измеренная площадка. Розовые зоны: устройства, без дорожек. Разметка существует только на странице QA и не входит в WebP.';main.append(text);const d=document.createElement('details'),s=document.createElement('summary'),pre=document.createElement('pre');s.textContent='Измерения';pre.textContent=JSON.stringify({alpha:m.alpha,geometry:m.geometry,transform:m.transform},null,2);d.append(s,pre);main.append(d);
await Promise.all([...document.images].map(i=>i.decode()));for(const name of ['a','c']){const image=new Image();image.src='qa/reference-paving-'+name+'.webp';await image.decode();}document.body.dataset.ready='true';
</script></html>
