<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Парк: проверка совмещения</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#e9e3d8;color:#173f38}h1{font-size:18px;margin:10px}p{margin:8px 10px}main{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}figure{margin:0;background:white;min-width:0}svg{width:100%;display:block;background:#d3cebc}figcaption{padding:8px}#status{font:11px monospace;overflow-wrap:anywhere}@media(max-width:600px){main{grid-template-columns:1fr}svg{max-height:220px}}</style><h1>Парк: совместить декаль с фонтаном</h1><p>Зелёный — бассейн R3,2; красный — запас 0,1. Сдвигается только изображение целиком, фонтан остаётся на месте.</p><main id="panels"></main><p>Нижний ряд — участок около фонтана. Розовые круги — зоны устройств; серая рамка — поле. Это предложение размещения, а не проверка игровой сцены.</p><p id="status"></p><script type="module">
const m=await fetch('/measurements.json').then(r=>r.json());const l=await fetch('/layout.json').then(r=>r.json());const ns='http://www.w3.org/2000/svg';let errors=[],loaded=0;
function update(){document.getElementById("status").textContent=JSON.stringify({viewport:[innerWidth,innerHeight],scroll:document.documentElement.scrollWidth,loaded,errors,offset:m.aligned.offset,margin:m.fittedAlignedBasinMargin});}
for(const zoom of [false,true])for(const shift of [[0,0],m.aligned.offset]){const f=document.createElement('figure'),svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',zoom?'-8 -4 10 10':'-17.3 -9.1 34.6 18.2');const make=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));svg.append(e);return e;};const im=make('image',{href:'/park.webp',x:-16.8+shift[0],y:-8.8+shift[1],width:33.6,height:17.6,preserveAspectRatio:'none'});im.onload=()=>{loaded++;update()};im.onerror=()=>{errors.push('park');update()};make('rect',{x:-16.5,y:-8.5,width:33,height:17,fill:'none',stroke:'#555','stroke-width':.04});for(const z of l.clearZones)make('circle',{cx:z.x,cy:z.z,r:z.radius,fill:'none',stroke:'#ba1676','stroke-width':.04});make('circle',{cx:-3,cy:1,r:3.2,fill:'none',stroke:'#008859','stroke-width':.055});make('circle',{cx:-3,cy:1,r:3.3,fill:'none',stroke:'#db2839','stroke-width':.045,'stroke-dasharray':'.13 .09'});const c=document.createElement('figcaption');c.textContent=(shift[0]?'После совмещения: +0,0926 / +0,2602':'Текущее размещение: 0 / 0')+(zoom?' · приближение':'');f.append(svg,c);panels.append(f);}
window.onerror=e=>{errors.push(String(e));update()};window.onresize=update;update();
</script></html>
