<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Город — рельсы</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;font:14px system-ui;color:#22313b;background:#eeeade}h1{font-size:20px;margin:0 0 8px}button,select{font:inherit;padding:6px}header{display:flex;gap:8px;flex-wrap:wrap}.panels{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}.card{border:1px solid #b8b3a6;background:white;padding:8px;flex:1;min-width:200px}.sample{height:590px;background:#ded7c2;position:relative;overflow:hidden}.strip{width:calc(var(--s)*4px);height:100%;background:url('/public/textures/kit/city/tram-rails-strip.webp') 0 0/calc(var(--s)*4px) calc(var(--s)*8px) repeat-y;margin:auto}.mark{position:absolute;top:calc(var(--s)*8px);border-top:1px dashed #df573e;width:100%}.bounds{font-size:12px}.railguide{position:absolute;height:100%;top:0;width:1px;background:#ff2e7166;left:calc(50% + var(--x)*var(--s)*1px)}.stripbox{position:relative;width:calc(var(--s)*4px);margin:auto;height:100%}.paving{background:url('/public/textures/kit/city/paving-main-c.webp') 0 0/300px}.white{background:#fff}.dark{background:#25323b}p{margin:4px 0 8px}@media(max-width:500px){.card{min-width:0;flex-basis:100%}.sample{height:590px}}</style><body><h1>Трамвайная улица · 4×8 ед.</h1><header><label>Масштаб <select id="scale"><option value="32">32 px / ед.</option><option value="70">70 px / ед.</option></select></label><label>Фон <select id="bg"><option value="paving">Плитка</option><option value="white">Белый</option><option value="dark">Тёмный</option></select></label><button id="guides">Показать метки</button><span id="dimensions"></span></header><p>Повтор вдоль улицы; метки показывают границу тайла и центры колеи1.5. Это проверка ассета, не игровой кадр.</p><div class="panels"><div class="card"><p class="bounds">tram-rails-strip512×2048 · ширина4 · repeat8</p><div class="sample" id="sample"><div class="stripbox"><div class="strip"></div><div id="lines" hidden><i class="mark"></i><i class="railguide" style="--x:-.75"></i><i class="railguide" style="--x:.75"></i></div></div></div></div></div><script>function draw(){document.body.style.setProperty('--s',document.getElementById('scale').value);document.getElementById('sample').className='sample '+document.getElementById('bg').value;document.getElementById('dimensions').textContent=innerWidth+'×'+innerHeight;}document.getElementById('scale').onchange=draw;document.getElementById('bg').onchange=draw;document.getElementById('guides').onclick=()=>{const e=document.getElementById('lines');e.hidden=!e.hidden;};onresize=draw;draw();</script></body></html>
