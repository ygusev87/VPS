<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дорожки фермы</title><style>body{margin:0;background:#eee7db;font:14px system-ui;color:#25372f}header{display:flex;gap:10px;align-items:center;padding:8px}button,select{font:inherit;padding:5px}iframe{display:block;border:0;transform:scale(.75);transform-origin:top left}pre{max-height:150px;overflow:auto;white-space:pre-wrap;font-size:11px;margin:8px}</style><header><b>Дорожки фермы</b><select id="size"><option value="1180,820">1180×820</option><option value="390,844">390×844</option><option value="1024,768">1024×768</option></select><select id="area"><option value="wide">Вся ферма</option><option value="yard">Двор</option><option value="pond">Пруд</option><option value="garden">Огород</option><option value="gate">Ворота</option></select><button id="show" disabled>Показать</button><button id="scan" disabled>Все задания</button><span id="status">Загрузка</span></header><iframe id="game" src="/qa-game.html?q=2" width="1180" height="820"></iframe><pre id="report"></pre><script type="module">const $=id=>document.getElementById(id),frame=$('game');async function show(){try{const r=await frame.contentWindow.roadQA.show($('area').value);$('report').textContent=JSON.stringify(r,null,2);$('status').textContent=r.contextLost?'Потерян контекст':'Готово'}catch(e){$('status').textContent='Ошибка';$('report').textContent=e.stack}}$('show').onclick=show;$('scan').onclick=async()=>{$('status').textContent='Проверяются задания';const r=await frame.contentWindow.roadQA.scan();$('report').textContent=JSON.stringify(r,null,2);$('status').textContent='Проверка завершена'};$('size').onchange=async()=>{[frame.width,frame.height]=$('size').value.split(',');await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));await show()};const timer=setInterval(()=>{if(frame.contentWindow.roadQA?.ready){clearInterval(timer);$('show').disabled=false;$('scan').disabled=false;show()}},100);</script></html>
