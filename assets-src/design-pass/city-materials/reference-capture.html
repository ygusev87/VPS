<!doctype html><html lang="ru"><meta charset="utf-8"><style>body{margin:0;font:14px system-ui;background:#eee5d3}header{height:36px;display:flex;gap:12px;align-items:center}iframe{border:0;display:block}pre{white-space:pre-wrap}</style><header><button id="start" disabled>Город</button><select id="view"><option value="all">Общий вид</option><option value="street">Улица</option><option value="edge">Край</option></select><select id="phase"><option value="day">День</option><option value="night">Ночь</option></select><button id="focus">Зафиксировать</button><span id="status">Загрузка</span></header><iframe id="game" width="1040" height="650" src="/?q=1"></iframe><pre id="report"></pre><script type="module">
import {Vector3} from '/node_modules/three/build/three.module.js';
const $=id=>document.getElementById(id),f=$('game');let g;
const paint=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
async function focus(){if(!f.contentDocument.querySelector('#qa-hide')){const st=f.contentDocument.createElement('style');st.id='qa-hide';st.textContent='#hud,.build-tag{display:none!important}';f.contentDocument.head.append(st);}g.map.picked=true;const coords=$('view').value==='all'?[[-57,-43],[57,43]]:$('view').value==='street'?[[-33,-35],[30,-12]]:[[-58,18],[-26,42]];const ps=coords.map(([x,z])=>new Vector3(x,0,z));g.stage.setInsets({top:8,bottom:8,left:8,right:8});for(let i=0;i<8;i++){g.map.hooks.focus(ps);g.map.hooks.focus(ps,true);await paint();}g.stage.render();$('status').textContent='Готово: '+$('view').value;$('report').textContent=JSON.stringify({viewport:[f.width,f.height],phase:g.map.phase,view:$('view').value,camera:g.stage.camera.position.toArray(),insets:g.stage.insets,nightAmount:g.map.nightAmount});}
$('start').onclick=async()=>{await g.startMap('city',true);g.voice.stop();const style=f.contentDocument.createElement('style');style.textContent='#hud,.build-tag{display:none!important}';f.contentDocument.head.append(style);g.map.setPhase($('phase').value);await focus();};$('focus').onclick=focus;$('view').onchange=focus;$('phase').onchange=async()=>{g.map.setPhase($('phase').value);g.voice.stop();await focus();};const t=setInterval(()=>{g=f.contentWindow.__game;if(g){clearInterval(t);$('start').disabled=false;$('status').textContent='Готов к запуску';}},100);
</script></html>
