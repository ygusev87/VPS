<!doctype html><html lang="ru"><meta charset="utf-8"><title>Проверка материалов</title><style>body{margin:0;background:#dfe5e0;font:14px system-ui}header{height:44px;padding:4px;box-sizing:border-box}button{height:36px;margin-right:8px}iframe{display:block;border:0;background:white}</style><header><button data-size="390,844">390 × 844</button><button data-size="1024,768">1024 × 768</button><button data-size="1180,820">1180 × 820</button></header><iframe title="Материалы города" src="material-review.html" width="390" height="844"></iframe><script>for(const button of document.querySelectorAll('button'))button.onclick=()=>{const [w,h]=button.dataset.size.split(',');const frame=document.querySelector('iframe');frame.width=w;frame.height=h};</script></html>
