<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пожарная часть — настоящее вечернее задание</title><style>body{margin:0;background:#e5dfd4;color:#26393c;font:14px system-ui}header{height:48px;box-sizing:border-box;padding:8px;display:flex;gap:9px}button,select{font:inherit}iframe{border:0;display:block}pre{white-space:pre-wrap;margin:8px;max-width:1180px}</style>
<header><select id="size"><option value="1180,660">1180×660</option><option value="390,844">390×844</option></select><button id="reset">Вечер заново</button><button id="parts">Поставить детали</button><button id="connect">Подключить</button><button id="fireview">Двор</button><button id="status">Состояние</button></header>
<iframe id="game" width="1180" height="660" src="/?q=1"></iframe><pre id="report">Локальный QA: настоящий main.ts. Выбираем вечер; завершёнными ставим только другие вечерние задания. Пожар и спасение кота должны завершиться обычной симуляцией.</pre>
<script>
const frame=document.querySelector('#game'),report=document.querySelector('#report');let engine,ladder,pump,trace=[],recording=null;
function get(){const g=frame.contentWindow.__game;if(!g)throw Error('Игра загружается');return g;}
function terminals(part,g){return part.terminals.map(t=>{const v=t.attachPoint();return{world:v.toArray(),screen:g.stage.project(v)};});}
function poles(g){return [[24,17.5],[40.5,12.5]].map(([x,z])=>g.world.parts.find(p=>p.kind==='pole'&&Math.abs(p.root.position.x-x)<.01&&Math.abs(p.root.position.z-z)<.01));}
function snapshot(){const g=get(),p=g.map?.progress(),cat=g.map?.critters?.get('cat');report.textContent=JSON.stringify({phase:p?.phase,fire:p?.fire,catSaved:p?.catSaved,catDown:g.map?.catDown,cat:cat?{position:cat.group.position.toArray(),base:cat.base}:null,needs:g.map?.needs?.map(n=>({name:n.critter.name,phase:n.phase,done:n.done})),engine:engine?{powered:engine.powered,level:engine.state.level,terminals:terminals(engine,g)}:null,ladder:ladder?{reach:ladder.reach,level:ladder.state.level,terminals:terminals(ladder,g)}:null,pump:pump?{pumping:pump.pumping,level:pump.state.level,terminals:terminals(pump,g)}:null,poles:poles(g).map(p=>p?{position:p.root.position.toArray(),terminals:terminals(p,g)}:null),wires:g.world.wires.length,canvas:[frame.width,frame.height],trace,quality:'q=1; desktop IAB, no iPad/FPS claim'},null,2);}
async function action(fn){try{await fn();snapshot();}catch(e){report.textContent=e.stack;}}
document.querySelector('#reset').onclick=()=>action(async()=>{const g=get();await g.startMap('city',true);const p=g.map.progress();g.map.resume({...p,phase:'evening',fire:0,catSaved:false,done:g.map.needs.map(n=>n.phase==='evening'&&n.critter.name!=='firefighter')});g.voice.stop();engine=ladder=pump=null;trace=[];clearInterval(recording);});
document.querySelector('#parts').onclick=()=>action(()=>{const g=get();if(!engine){engine=g.world.addPart('firetruck',25.5,13.5,{appear:false});ladder=g.world.addPart('ladder',43.5,9.5,{appear:false});pump=g.world.addPart('pump',44,14,{appear:false});}g.map.refocus(true);});
document.querySelector('#connect').onclick=()=>action(()=>{const g=get();if(!engine)throw Error('Поставьте детали');const[a,b]=poles(g);if(!a||!b)throw Error('Нет исходного столба');for(const[p,part]of[[a,engine],[b,ladder],[b,pump]])for(const[i,j]of[[0,0],[1,1]]){const x=p.terminals[i],y=part.terminals[j];if(!g.world.wires.some(w=>(w.a===x&&w.b===y)||(w.a===y&&w.b===x)))g.connect(x,y);}clearInterval(recording);let last='';recording=setInterval(()=>{const m=g.map,p=m.progress(),key=[p.phase,Math.floor(m.catDown*10),Math.floor(p.fire*10)].join(':');if(key!==last){const c=m.critters.get('cat');trace.push({phase:p.phase,fire:p.fire,catDown:m.catDown,catSaved:p.catSaved,reach:ladder.reach,catPosition:c.group.position.toArray(),catBase:c.base});last=key;}if(p.catSaved&&p.fire===1)clearInterval(recording);},100);});
document.querySelector('#fireview').onclick=()=>action(()=>{const g=get(),n=g.map.needs.find(n=>n.critter.name==='firefighter');g.map.hooks.focus(g.map.view(n),true);});
document.querySelector('#status').onclick=()=>action(()=>{});
document.querySelector('#size').onchange=e=>{const[w,h]=e.target.value.split(',');frame.width=w;frame.height=h;};
</script></html>
