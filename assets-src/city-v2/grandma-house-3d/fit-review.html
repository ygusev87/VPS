<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дом бабушки — примерка GLB</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4efe6;color:#283b3d;font:14px/1.45 system-ui}header{padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:6px 10px}canvas{display:block;width:100%;height:min(68vh,620px);touch-action:none}pre{white-space:pre-wrap;padding:10px 14px;margin:0}p{margin:0;padding:8px 14px;max-width:900px}label{display:flex;gap:7px;align-items:center}</style>
<header><strong>Примерка дома · отдельный стенд</strong><label>Ракурс<select id="view"><option value="game">Игровой</option><option value="right">Правая стена +X</option><option value="front">Фасад +Z</option><option value="three">Три четверти</option><option value="back">Задняя стена −Z</option></select></label><label><input type="checkbox" id="showBalcony" checked>Балкон и бабушка</label><label><input type="checkbox" id="adjust">Вариант подгонки (предложение)</label></header><canvas id="stage"></canvas><pre id="report">Загрузка…</pre><p>Ширина полного габарита6.2, фронт после поворота−π/2. Касание модели показывает координаты поверхности относительно центра дома. Точка стыка: (3.1,1.95,0.25). Это стенд масштаба, не проверка производительности игры.</p>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';
const canvas=document.querySelector('#stage'),report=document.querySelector('#report'),view=document.querySelector('#view');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.NeutralToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color('#f4efe6');
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.7;
scene.add(new THREE.HemisphereLight('#fffaf0','#d9c5ac',2.2));const sun=new THREE.DirectionalLight('#fff3df',3);sun.position.set(-4,8,6);scene.add(sun);
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
async function load(url){const r=await fetch(url);if(!r.ok)throw Error(url+': '+r.status);const data=await r.arrayBuffer();return new Promise((ok,no)=>{const old=window.createImageBitmap;window.createImageBitmap=undefined;try{loader.parse(data,'',ok,no);}finally{window.createImageBitmap=old;}});}
function fit(src,{width,height,yaw=0}){const inner=src.clone(true);inner.rotation.y=yaw;const holder=new THREE.Group().add(inner);holder.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(inner),size=b.getSize(new THREE.Vector3());inner.scale.setScalar(width?width/size.x:height/size.y);holder.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(inner);const c=b.getCenter(new THREE.Vector3());inner.position.set(-c.x,-b.min.y,-c.z);return holder;}
const material=color=>new THREE.MeshStandardMaterial({color,roughness:.7});
const box=(w,h,d,color,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));m.position.set(x,y,z);return m;};
const balcony=new THREE.Group();balcony.position.set(3.9,0,.25);balcony.add(box(1.6,.14,1.3,'#e8e0d0',0,1.88,0),box(1.6,.5,.06,'#ffffff',0,2.2,.62));for(const x of [-.7,.7])balcony.add(box(.12,1.95,.12,'#d8cdbd',x,.975,.55));scene.add(balcony);
const floor=box(14,.06,11,'#e2d5bd',1,-.04,0);scene.add(floor);
const camera=new THREE.OrthographicCamera(),target=new THREE.Vector3(1,3,0),dirs={game:[0,1,.78],right:[1,0,0],front:[0,0,1],three:[1,.65,1],back:[0,0,-1]};let house,granny,base='';
function render(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);const span=Math.max(10,12*h/w);camera.left=-span*w/h/2;camera.right=span*w/h/2;camera.top=span/2;camera.bottom=-span/2;camera.near=.1;camera.far=100;camera.position.copy(target).addScaledVector(new THREE.Vector3(...dirs[view.value]).normalize(),24);camera.lookAt(target);camera.updateProjectionMatrix();renderer.render(scene,camera);}
try{const params=new URLSearchParams(location.search);const raw=await load(params.get('model')??'candidate/grandma-house.glb');house=fit(raw.scene,{width:6.2,yaw:Number(params.get('yaw')??-Math.PI/2)});scene.add(house);granny=fit((await load('/models/grandma.glb')).scene,{height:1.5});granny.position.set(3.55,1.95,.25);scene.add(granny);house.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(house),size=b.getSize(new THREE.Vector3());base=`Исходный габарит X/Y/Z: ${size.toArray().map(n=>n.toFixed(3)).join(' / ')}\nНастил: y1.950, левый край x3.100. Нужный порог: z0.250.\nКлипы: ${raw.animations.length}.`;report.textContent=base;render();}catch(e){report.textContent=e.message;console.error(e);}
document.querySelector('#adjust').onchange=e=>{if(house)house.scale.y=e.target.checked ? 0.8764 : 1;const deck=balcony.children[0];deck.scale.x=e.target.checked?1.9/1.6:1;deck.position.x=e.target.checked?-.15:0;report.textContent=base+(e.target.checked?'\nПРЕДЛОЖЕНИЕ: высота корпуса ×0.8764, настил продлён к стене на0.30; якоря и внешний край сохранены.':'\nИсходная примерка: поправки выключены.');render();};
view.onchange=render;document.querySelector('#showBalcony').onchange=e=>{balcony.visible=e.target.checked;if(granny)granny.visible=e.target.checked;render();};window.addEventListener('resize',render);
canvas.addEventListener('pointerdown',e=>{if(!house)return;const r=canvas.getBoundingClientRect(),mouse=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1),ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);const hit=ray.intersectObject(house,true)[0];if(hit)report.textContent=base+'\nПоверхность X/Y/Z: '+hit.point.toArray().map(n=>n.toFixed(4)).join(' / ');});
</script></html>
