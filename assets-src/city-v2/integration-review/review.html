<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Город · ребёнок и лодка</title><style>body{margin:0;background:#eee7dc;font:14px system-ui;color:#21313d}header{padding:8px;display:flex;gap:8px;flex-wrap:wrap}button,select{font:inherit;padding:6px}iframe{border:0;display:block}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:1100px}</style><header><select id="size"><option value="1024,768">1024×768</option><option value="390,844">390×844</option></select><button id="load" disabled>Загрузить город</button><select id="target"><option value="school">Дети у школы</option><option value="square">Дети на площади</option><option value="harbor">Дети у гавани</option><option value="boat">Лодка у моста</option></select><button id="show">Показать</button><button id="school">Цикл школы</button><button id="bridge">Проход моста</button><button id="tap">Считать UI-тап</button><b id="status">Ожидание</b></header><iframe id="game" width="1024" height="768" src="/?q=2"></iframe><pre id="report"></pre><script type="module">
import * as THREE from 'three';const $=id=>document.getElementById(id),frame=$('game'),out=$('report'),status=$('status'),source=await fetch('/snapshot.json').then(r=>r.json());let g,map,uiBefore,bridge;const inputs=[],errors=[];const paint=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>requestAnimationFrame(r))));
function box(o){o.updateWorldMatrix(true,true);return new THREE.Box3().setFromObject(o);}function xyz(v){return v.toArray().map(n=>+n.toFixed(6));}function sample(name){const c=map.critters.get(name),b=box(c.group);let tris=0,meshes=0;c.group.traverse(o=>{if(o.isMesh&&o.material.colorWrite!==false){meshes++;tris+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;}});return{name,meshes,tris,visible:c.group.visible,position:xyz(c.group.position),yaw:c.group.rotation.y,spin:c.spin,hop:c.hop,min:xyz(b.min),max:xyz(b.max)};}
function output(data){out.textContent=JSON.stringify({source,viewport:[+frame.width,+frame.height],overflow:frame.contentDocument.documentElement.scrollWidth>+frame.width,contextLost:g.stage.renderer.getContext().isContextLost(),errors,...data},null,2);}
function run(f){return async()=>{status.textContent='Проверка';try{await f();status.textContent='Готово';}catch(e){out.textContent=e.stack;status.textContent='Ошибка';console.error(e);}};}
async function focus(points){for(let i=0;i<4;i++){map.hooks.focus(points);map.hooks.focus(points,true);await paint();}g.stage.render();}
function screen(c){const p=box(c.group).getCenter(new THREE.Vector3()).project(g.stage.camera),rect=g.stage.canvas.getBoundingClientRect(),outer=frame.getBoundingClientRect();return{x:outer.x+rect.x+(p.x*.5+.5)*rect.width,y:outer.y+rect.y+(-p.y*.5+.5)*rect.height};}
$('load').onclick=run(async()=>{g=frame.contentWindow.__game;await g.startMap('city',true);g.voice.stop();map=g.map;map.update=()=>{};map.hint=()=>null;map.picked=true;frame.contentWindow.addEventListener('error',e=>errors.push(e.message));frame.contentWindow.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));for(const type of ['pointerdown','pointerup'])g.stage.canvas.addEventListener(type,e=>inputs.push({type,trusted:e.isTrusted,pointerType:e.pointerType}),true);output({children:[...map.critters.keys()].filter(x=>/^child\d*$/.test(x)).map(sample),boat:sample('boat')});await show();});
async function show(){const target=$('target').value;let names=target==='school'?['child3','child4','child5']:target==='square'?['child','child2']:target==='harbor'?['child6','child7']:['boat'];if(target==='boat'){map.boat=10/29;map.time=0;map.updateBoat(0);if(!bridge)bridge=g.world.addPart('drawbridge',35.9,0,{locked:true,appear:false});bridge.animate=()=>{};bridge.up=.850001;bridge.span.rotation.z=bridge.up*1.15;}const pts=names.map(n=>map.critters.get(n).group.position.clone());if(target==='boat')pts.push(new THREE.Vector3(35.9,0,0),new THREE.Vector3(31,-0,-4.5));else{const c=pts[0];pts.push(c.clone().add(new THREE.Vector3(-2,0,-3)),c.clone().add(new THREE.Vector3(2,0,2)));}await focus(pts);uiBefore=sample(names[0]);inputs.length=0;output({target,objects:names.map(sample),screen:screen(map.critters.get(names[0])),note:'For UI check, click this actual canvas character; this button does not call tap.'});}
$('show').onclick=run(show);
$('school').onclick=run(async()=>{const need=map.needs.find(n=>n.critter.name==='child3');need.done=true;map.schooling=0;const samples=[];for(let i=0;i<240;i++){map.time=i/120;map.updateSchool(1/120);for(const n of ['child3','child4','child5'])map.animateCritter(map.critters.get(n),1/120);if(i%12===0||i===239)samples.push(['child3','child4','child5'].map(sample));}await focus([new THREE.Vector3(9,0,-21),new THREE.Vector3(13,0,-26)]);output({schooling:map.schooling,samples,feetMinimum:Math.min(...samples.flat().filter(s=>s.visible).map(s=>s.min[1])),allModelTriangles:samples.flat().every(s=>s.tris===3800),method:'Actual updateSchool + animateCritter, task done flag seeded in isolated QA; not full task walkthrough.'});});
$('bridge').onclick=run(async()=>{if(!bridge)bridge=g.world.addPart('drawbridge',35.9,0,{locked:true,appear:false});bridge.animate=()=>{};bridge.up=.850001;bridge.span.rotation.z=bridge.up*1.15;const b=map.critters.get('boat');let collisions=0,minY=Infinity,maxTop=-Infinity,maxSide=0;const hitPhases=[];const bm=[];bridge.body.traverse(o=>{if(o.isMesh&&o.geometry.type==='BoxGeometry'){o.geometry.computeBoundingBox();bm.push(o);}});const triangle=new THREE.Triangle(),local=new THREE.Vector3(),inverse=new THREE.Matrix4();for(let i=0;i<=240;i++){map.time=i/43;map.boat=i/240;map.updateBoat(0);b.group.updateWorldMatrix(true,true);bridge.root.updateWorldMatrix(true,true);const bounds=box(b.group);minY=Math.min(minY,bounds.min.y);maxTop=Math.max(maxTop,bounds.max.y);maxSide=Math.max(maxSide,Math.abs(bounds.min.x-37),Math.abs(bounds.max.x-37));let hit=false;for(const obstacle of bm){if(!box(obstacle).intersectsBox(bounds))continue;inverse.copy(obstacle.matrixWorld).invert();b.group.traverse(o=>{if(!o.isMesh)return;const transform=inverse.clone().multiply(o.matrixWorld),pos=o.geometry.attributes.position,idx=o.geometry.index;for(let j=0;j<(idx?.count??pos.count)&&!hit;j+=3){for(let k=0;k<3;k++){local.fromBufferAttribute(pos,idx?idx.getX(j+k):j+k).applyMatrix4(transform);[triangle.a,triangle.b,triangle.c][k].copy(local);}if(obstacle.geometry.boundingBox.intersectsTriangle(triangle)){hit=true;break;}}});}if(hit){collisions++;hitPhases.push(i/240);}}map.boat=10/29;map.updateBoat(0);await focus([new THREE.Vector3(34,0,-2),new THREE.Vector3(38,0,2)]);output({bridgeUp:bridge.up,steps:241,collisionsWithBoxMeshes:collisions,hitPhases,minY,maxTop,maxSide,canalHalfWidth:1.6,remainingBankClearance:1.6-maxSide,boat:sample('boat'),testedObstacleMeshes:bm.map(x=>x.name||x.geometry.type),method:'Actual model vertices against actual bridge BoxGeometry in local space over route; cylinder ornaments and full electrical task are not covered.'});});
$('tap').onclick=run(async()=>{g.voice.stop();output({before:uiBefore,after:sample(uiBefore.name),inputs,method:'Reads state only; no synthetic critter tap.'});});$('size').onchange=run(async()=>{const[w,h]=$('size').value.split(',');frame.width=w;frame.height=h;await paint();if(g)await show();});const ready=setInterval(()=>{if(frame.contentWindow.__game){$('load').disabled=false;status.textContent='Готов к загрузке';clearInterval(ready);}},100);
</script></html>
