<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Магазин — ночное задание в игре</title><style>body{margin:0;background:#e5dfd4;color:#26393c;font:14px system-ui}header{padding:8px;display:flex;gap:9px;flex-wrap:wrap}button,select{padding:6px;font:inherit}iframe{border:0;display:block}pre{white-space:pre-wrap;margin:8px;max-width:1180px}</style>
<header><label>Размер <select id="size"><option value="1180,660">1180×660</option><option value="390,844">390×844</option></select></label><button id="night">Ночное задание заново</button><button id="parts">Поставить звонок и домино</button><button id="connect">Соединить цепь</button><button id="status">Снять состояние</button></header>
<iframe id="game" width="1180" height="660" src="/?q=1"></iframe><pre id="report">Дождитесь загрузки игры. Кнопки сверху — только инструменты QA; в игровом интерфейсе их нет. Используется настоящий main.ts и публичная модель.</pre>
<script>
const frame=document.querySelector('#game'),report=document.querySelector('#report');let bell,domino,game;
function get(){const g=frame.contentWindow.__game;if(!g)throw Error('Игра ещё загружается');return g;}
function snapshot(){const g=get(),p=g.map?.progress();report.textContent=JSON.stringify({phase:p?.phase,raccoonChased:p?.raccoonChased,done:p?.done,bell:bell?{level:bell.state.level,ringing:bell.ringing,terminals:bell.terminals.map(t=>{const p=t.attachPoint(),s=g.stage.project(p);return {world:p.toArray(),screen:s};})}:null,domino:domino?{standing:domino.standing,closed:domino.closed}:null,wires:g.world.wires.length,canvas:[frame.width,frame.height],quality:'q=1; desktop browser; no iPad/FPS claim'},null,2);}
async function action(fn){try{await fn();snapshot();}catch(e){report.textContent=e.stack;}}
document.querySelector('#night').onclick=()=>action(async()=>{game=get();await game.startMap('city',true);const p=game.map.progress();game.map.resume({...p,phase:'night',raccoonChased:false,done:p.done.map(()=>false)});game.voice.stop();bell=domino=null;});
document.querySelector('#parts').onclick=()=>action(()=>{const g=get();if(!bell){bell=g.world.addPart('bell',50.5,-29.5,{appear:false});domino=g.world.addPart('domino',48,-33,{appear:false});}g.map.refocus(true);});
document.querySelector('#connect').onclick=()=>action(()=>{const g=get();if(!bell||!domino)throw Error('Сначала поставьте детали');const pole=g.world.parts.find(p=>p.kind==='pole'&&Math.abs(p.root.position.x-53)<.01&&Math.abs(p.root.position.z+31)<.01);if(!pole)throw Error('Не найден исходный столб');for(const[a,b]of[[pole.terminals[0],domino.terminals[0]],[domino.terminals[1],bell.terminals[0]],[bell.terminals[1],pole.terminals[1]]])if(!g.world.wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a)))g.connect(a,b);});
document.querySelector('#status').onclick=()=>action(()=>{});
document.querySelector('#size').onchange=e=>{const[w,h]=e.target.value.split(',');frame.width=w;frame.height=h;};
</script></html>
