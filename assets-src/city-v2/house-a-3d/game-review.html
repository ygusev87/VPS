<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Дом A — четыре экземпляра и клеммы города</title>
<style>body{margin:0;background:#e7e1d6;color:#26393c;font:14px system-ui}header{height:48px;box-sizing:border-box;padding:8px;display:flex;gap:8px}button,select{font:inherit}iframe{border:0;display:block}pre{white-space:pre-wrap;margin:8px;max-width:1180px}table{border-collapse:collapse;margin:8px}td,th{border:1px solid #aaa;padding:5px;text-align:left}.bad{background:#ffcfb8}.good{background:#d3eacb}</style>
<header><select id="size"><option value="1180,660">1180×660</option><option value="390,844">390×844</option></select><button id="start" disabled>Город заново</button><select id="pole"></select><button id="focus">Осмотреть</button><button id="scan">Проверить все</button><button id="control">Старая крыша: контроль</button><select id="house"><option value="0">Дом NW</option><option value="1">Дом NE</option><option value="2">Дом SW</option><option value="3">Дом SE</option></select><button id="houseview">Дом</button><button id="clearance">Зазоры домов</button></header>
<iframe id="game" width="1180" height="660" src="/?q=1"></iframe><div id="summary">Дождитесь загрузки main.ts. Локальный QA, в игре этих кнопок нет.</div><table id="rows"></table><pre id="report"></pre>
<script type="module">
import * as THREE from 'three';
import {boxHouse} from '/src/storymap.ts';
import {loadModels,model} from '/src/parts/assets.ts';
import {DECOR} from '/src/city-decor.ts';
const entries=[['LIGHT_POLE',10.5,19.5,'car'],['SUB_POLE',-23.5,31.5,'tram'],['BAKERY_POLE',-12.5,-17,'baker'],['PARK_POLE',-28.5,-4.5,'car4'],['WASH_POLE',-34.5,5.5,'car7'],['CRANE_POLE',-31,17,'builder'],['HOUSE_POLE',-34,-23,'grandma'],['BRIDGE_POLE',31,-4.5,'boat'],['KITTEN_POLE',-8.5,1,'kitten'],['CLUB_POLE',40.5,-11.5,'child6'],['STATION_POLE',24,17.5,'firefighter'],['FIRE_POLE',40.5,12.5,'firefighter'],['SHOP_POLE',53,-31,'shopkeeper'],['SCHOOL_POLE',20.5,-19.2,'child3']];
const frame=document.querySelector('#game'),report=document.querySelector('#report'),summary=document.querySelector('#summary'),rows=document.querySelector('#rows'),select=document.querySelector('#pole');
for(const [i,e] of entries.entries()){const o=document.createElement('option');o.value=i;o.textContent=e[0];select.append(o);}
const get=()=>{const g=frame.contentWindow.__game;if(!g)throw Error('Игра ещё загружается');return g;};
const paint=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
const round=n=>Math.round(n*1e5)/1e5;
function ancestor(obj,pred){for(let o=obj;o;o=o.parent)if(pred(o))return true;return false;}
function materialAt(hit){const m=hit.object.material;return Array.isArray(m)?m[hit.face?.materialIndex??0]:m;}
function describe(hit,g){const object=hit.object,p=hit.point,material=materialAt(hit);const critter=[...g.map.critters.values()].find(c=>ancestor(object,o=>o===c.group));const dynamic=!!critter||ancestor(object,o=>o.userData.life==='extra');const nearby=DECOR.flatMap(d=>d.items.map(([x,z,yaw,s])=>({model:d.model,center:[x,z],distance:round(Math.hypot(p.x-x,p.z-z))}))).sort((a,b)=>a.distance-b.distance).slice(0,2);return{mesh:object.name||object.type,objectId:object.id,instanceId:hit.instanceId??null,point:p.toArray().map(round),distance:round(hit.distance),material:{transparent:material.transparent,opacity:material.opacity,depthTest:material.depthTest},dynamic,critter:critter?.name??null,life:object.userData.life??null,nearbyDecor:nearby};}
function visibleHit(hit){const m=materialAt(hit);return !ancestor(hit.object,o=>!o.visible)&&m?.visible!==false&&m.opacity>0.01&&m.depthTest!==false;}
async function inspect(index,control=false){const g=get(),[name,x,z,who]=entries[index],need=g.map.needs.find(n=>n.critter.name===who);if(!need)throw Error('Missing need '+who);const p=g.map.progress();g.map.resume({...p,phase:need.phase,fire:0,catSaved:false,done:p.done.map(()=>false)});g.voice.stop();g.map.focused=need;g.map.picked=true;g.map.hooks.focus(g.map.view(need),true);await paint();g.map.hooks.focus(g.map.view(need),true);g.stage.scene.updateMatrixWorld(true);g.stage.camera.updateMatrixWorld(true);
 const pole=g.world.parts.find(p=>p.kind==='pole'&&Math.abs(p.root.position.x-x)<.01&&Math.abs(p.root.position.z-z)<.01);if(!pole)throw Error('Missing pole '+name);
 let oldHouse;if(control){oldHouse=boxHouse('#f6b0a0','#3f86d6',5,3.4,4);oldHouse.position.set(26,0,21);oldHouse.name='QA old house-b before fa703b3';g.map.scenery.add(oldHouse);oldHouse.updateMatrixWorld(true);}
 const meshes=[];g.map.scenery.traverse(o=>{if(o.isMesh)meshes.push(o);});const camera=g.stage.camera.getWorldPosition(new THREE.Vector3()),ray=new THREE.Raycaster();const terms=pole.terminals.map(t=>{const point=t.attachPoint(),toward=camera.clone().sub(point),distance=toward.length();ray.set(point,toward.normalize());ray.near=.015;ray.far=distance;const hits=ray.intersectObjects(meshes,false).filter(visibleHit).map(h=>describe(h,g));const opaque=hits.filter(h=>h.material.opacity>=.9&&!h.dynamic),dynamic=hits.filter(h=>h.dynamic),transparent=hits.filter(h=>h.material.opacity<.9&&!h.dynamic);const s=g.stage.project(point),insets=g.stage.insets;return{terminal:t.key??t.id,world:point.toArray().map(round),screen:{x:round(s.x),y:round(s.y)},insideCanvas:s.x>=0&&s.y>=0&&s.x<=+frame.width&&s.y<=+frame.height,insidePlayArea:s.x>=insets.left&&s.x<=+frame.width-insets.right&&s.y>=insets.top&&s.y<=+frame.height-insets.bottom,opaqueHits:opaque.slice(0,4),dynamicHits:dynamic.slice(0,2),transparentHits:transparent.slice(0,2)};});
 if(oldHouse){oldHouse.removeFromParent();oldHouse.traverse(o=>{if(o.isMesh){o.geometry.dispose();const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>m.dispose());}});}
 return{name,control,centerXZ:[x,z],task:who,phase:need.phase,camera:camera.toArray().map(round),insets:g.stage.insets,terminals:terms};}
function show(results){const data={historicalRoofControl:results.some(r=>r.control),source:'Actual main.ts q=1; current local scene via THREE.Raycaster',buildLabel:frame.contentDocument.querySelector('.build-tag')?.textContent??'unavailable',viewport:[+frame.width,+frame.height],checkedPoles:results.length,blockedTerminals:results.flatMap(r=>r.terminals).filter(t=>t.opaqueHits.length).length,outsideCanvas:results.flatMap(r=>r.terminals).filter(t=>!t.insideCanvas).length,outsidePlayArea:results.flatMap(r=>r.terminals).filter(t=>!t.insidePlayArea).length,results,limitations:['Rays use actual focused perspective camera and loaded scenery meshes; sprites/own pole excluded.','Opaque=opacity>=.9, visible hierarchy/material, depthTest enabled. This is a conservative geometry check, not pixel segmentation.','Moving critters/life extras are listed separately.','No player-added parts/wires; those can create later occlusion.','Desktop IAB, not physical iPad or touch/FPS/PWA test.']};report.textContent=JSON.stringify(data,null,2);summary.textContent=`Столбов ${data.checkedPoles}; клемм за непрозрачной декорацией ${data.blockedTerminals}; вне холста ${data.outsideCanvas}; вне рабочей области ${data.outsidePlayArea}.`;rows.replaceChildren();const header=document.createElement('tr');for(const s of ['Столб','Задание','Клемма A','Клемма B']){const th=document.createElement('th');th.textContent=s;header.append(th);}rows.append(header);for(const r of results){const tr=document.createElement('tr');for(const s of [r.name,r.task,...r.terminals.map(t=>t.opaqueHits.length?'ПЕРЕКРЫТА':!t.insidePlayArea?'ВНЕ ОБЛАСТИ':'Видна')]){const td=document.createElement('td');td.textContent=s;td.className=s==='Видна'?'good':s==='ПЕРЕКРЫТА'||s==='ВНЕ ОБЛАСТИ'?'bad':'';tr.append(td);}rows.append(tr);}return data;}
async function action(fn){try{await fn();}catch(e){report.textContent=e.stack;summary.textContent='Ошибка проверки';console.error(e);}}
document.querySelector('#start').onclick=()=>action(async()=>{await get().startMap('city',true);get().voice.stop();summary.textContent='Город загружен, выберите столб или запустите все проверки.';});
document.querySelector('#focus').onclick=()=>action(async()=>show([await inspect(+select.value)]));
document.querySelector('#scan').onclick=()=>action(async()=>{const results=[];for(let i=0;i<entries.length;i++){summary.textContent='Проверяется '+entries[i][0];results.push(await inspect(i));}show(results);});
document.querySelector('#control').onclick=()=>action(async()=>show([await inspect(10,true)]));
document.querySelector('#size').onchange=async e=>{const[w,h]=e.target.value.split(',');frame.width=w;frame.height=h;await paint();summary.textContent='Размер изменён. Повторите осмотр или все проверки.';};

const ready=setInterval(()=>{if(frame.contentWindow.__game){document.querySelector('#start').disabled=false;clearInterval(ready);}},100);
const houseEntry=DECOR.find(d=>d.model==='house-a');
document.querySelector('#houseview').onclick=()=>action(async()=>{
 const g=get(),[x,z,yaw]=houseEntry.items[+document.querySelector('#house').value],p=g.map.progress();g.map.resume({...p,phase:'day',done:p.done.map(()=>false)});g.voice.stop();g.map.picked=true;const pts=[new THREE.Vector3(x-6,0,z-5),new THREE.Vector3(x+6,0,z+5)];g.map.hooks.focus(pts,true);await paint();g.map.hooks.focus(pts,true);summary.textContent=`Дом ${x}, ${z}; yaw ${yaw}.`;
});
document.querySelector('#clearance').onclick=()=>action(async()=>{
 await loadModels(['house-a']);const src=model('house-a',houseEntry.fit);if(!src)throw Error('No house-a GLB');const g=get();g.stage.scene.updateMatrixWorld(true);const sourceBox=new THREE.Box3().setFromObject(src),up=new THREE.Vector3(0,1,0);
 const houses=houseEntry.items.map(([x,z,yaw,s],i)=>{const b=sourceBox.clone().applyMatrix4(new THREE.Matrix4().compose(new THREE.Vector3(x,0,z),new THREE.Quaternion().setFromAxisAngle(up,yaw),new THREE.Vector3(s,s,s)));return {i,b};});
 const gap=(a,b)=>Math.hypot(Math.max(a.min.x-b.max.x,0,b.min.x-a.max.x),Math.max(a.min.z-b.max.z,0,b.min.z-a.max.z));
 const circle=(x,z,r)=>new THREE.Box3(new THREE.Vector3(x-r,0,z-r),new THREE.Vector3(x+r,10,z+r));
 const reservations=g.map.needs.flatMap(n=>[n,...n.more].map(slot=>({name:n.critter.name+':'+(slot.kinds?.join(',')??'slot'),b:circle(slot.spot.x,slot.spot.z,2),kind:'task-square4'})));
 for(const p of g.world.parts)reservations.push({name:p.kind,kind:'actual-part-bbox',b:new THREE.Box3().setFromObject(p.root)});
 for(const c of g.map.critters.values())if(!c.roams)reservations.push({name:c.name,kind:'fixed-critter-current-bbox',b:new THREE.Box3().setFromObject(c.group)});
 const results=houses.map(({i,b})=>({instance:houseEntry.items[i],box:{min:b.min.toArray(),max:b.max.toArray()},nearest:reservations.map(r=>({name:r.name,kind:r.kind,gap:round(gap(b,r.b))})).sort((a,b)=>a.gap-b.gap).slice(0,8),overlaps:reservations.filter(r=>gap(b,r.b)===0).map(r=>({name:r.name,kind:r.kind}))}));
 const batches=[];g.map.scenery.traverse(o=>{if(o.isInstancedMesh&&o.geometry.index?.count===6474*3){const matrices=[];for(let i=0;i<o.count;i++){const m=new THREE.Matrix4();o.getMatrixAt(i,m);matrices.push(m.elements);}batches.push({count:o.count,trianglesEach:o.geometry.index.count/3,matrices});}});
 report.textContent=JSON.stringify({viewport:[+frame.width,+frame.height],houses:results,houseBatches:batches,reservations:reservations.length,limitations:['Task reservations are conservative4x4 squares; initial fixed critter poses only.','No arbitrary player parts or all animated trajectories.']},null,2);summary.textContent=`Домов ${results.length}; пересечений ${results.reduce((n,r)=>n+r.overlaps.length,0)}; пакетов дома ${batches.length}, экземпляров ${batches.reduce((n,b)=>n+b.count,0)}.`;
});
</script></html>
