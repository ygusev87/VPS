<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ревью новых деталей — реальная игра</title>
<style>body{margin:0;background:#e5dfd4;color:#26393c;font:14px system-ui}header{box-sizing:border-box;height:48px;display:flex;align-items:center;gap:8px;padding:6px;white-space:nowrap}button,select{font:inherit;padding:5px}iframe{border:0;display:block}pre{white-space:pre-wrap;margin:10px;max-width:1180px}</style>
<header><select id="size" aria-label="Размер"><option value="1180,660">1180×660</option><option value="390,844">390×844</option></select><button id="gallery">Четыре детали</button><button id="kettle">Чайник крупно</button><button id="party">Праздник</button><button id="connect">Питание</button><button id="off">Отключить</button><button id="status">Состояние</button></header>
<iframe id="game" width="1180" height="660" src="/?q=1"></iframe><pre id="report">QA: дождитесь игры. Кнопки работают с настоящим main.ts; нет подмены моделей или материала. Размер только iframe. Съёмка q=1, настольный браузер.</pre>
<script type="module">
import * as THREE from 'three';
const frame=document.querySelector('#game'),report=document.querySelector('#report');let scene='none',trace=[],lastKey='',began=0;
const get=()=>{const g=frame.contentWindow.__game;if(!g)throw Error('Игра ещё загружается');return g};
const at=(kind,x,z)=>({kind,fx:x/6.5,fz:z/4.4});
function fit(){const g=get(),pts=[];for(const p of g.world.parts){const c=p.root.position;pts.push(c.clone().add(new THREE.Vector3(-p.radius,0,-p.radius*.8)),c.clone().add(new THREE.Vector3(p.radius,0,p.radius*.8)));}g.stage.frame(pts,true);}
async function action(fn){try{await fn();for(let i=0;i<3;i++)await new Promise(requestAnimationFrame);snapshot();}catch(e){report.textContent=e.stack;}}
function begin(){trace=[];lastKey='';began=performance.now();get().voice.stop();}
function setup(kind){scene=kind;const g=get();if(kind==='party')g.startLevel(g.MACHINES.find(x=>x.id==='m-party'),true,false);else{const parts=kind==='kettle'?[at('battery',-2,1.4),at('kettle',1,0)]:[at('battery',-4,2.6),at('balloon',-2,-1.6),at('skittles',1,-1.6),at('garland',3.6,1.6),at('kettle',-.3,1.6)];g.startLevel({...g.FREE_PLAY,id:'qa-toys-'+kind,fixed:true,parts},true,false);}begin();}
function connect(){const g=get(),find=k=>g.world.parts.find(p=>p.kind===k),loops=scene==='party'?[['battery','launcher'],['battery','balloon','garland']]:[['battery','garland'],['battery','kettle']];for(const loop of loops){const parts=loop.map(find);if(parts.some(p=>!p))continue;const source=parts[0],plus=source.terminals.find(t=>t.polarity==='plus')||source.terminals[0],minus=source.terminals.find(t=>t.polarity==='minus')||source.terminals[1];let a=plus;for(const p of parts.slice(1)){wire(a,p.terminals[0]);a=p.terminals[1];}wire(a,minus);}function wire(a,b){if(!g.world.wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a)))g.connect(a,b);}}
function state(p){const s={kind:p.kind,level:p.state.level,current:p.state.current,closed:p.closed,triggered:p.triggered};if(p.kind==='balloon'){s.popped=p.popped;s.ballVisible=p.ball.visible;s.leverAngle=p.leverAngle;}if(p.kind==='skittles'){s.down=p.down;s.angles=p.pins.map(x=>x.angle);}if(p.kind==='kettle'){s.heat=p.heat;s.boiling=p.boiling;s.lidY=p.lid.position.y;s.lidZ=p.lid.rotation.z;s.steam=p.puffs.map(x=>x.material.opacity);}if(p.kind==='garland')s.emissive=p.bulbs.map(x=>x.m.emissiveIntensity);return s;}
function sample(){const g=get(),s={atSeconds:+((performance.now()-began)/1000).toFixed(2),wires:g.world.wires.length,goal:g.levelGoal(),won:g.won,parts:g.world.parts.map(state)};const key=JSON.stringify(s.parts.map(p=>[p.kind,p.level>.2,p.popped,p.down,p.boiling,p.closed,Math.floor((p.heat||0)*4)]))+s.goal;if(key!==lastKey&&scene!=='none'){lastKey=key;trace.push(structuredClone(s));if(trace.length>60)trace.shift();}return s;}
function visible(o){for(let p=o;p;p=p.parent)if(!p.visible)return false;return true;}
function snapshot(){const g=get(),s=sample(),cam=g.stage.camera;g.stage.scene?.updateMatrixWorld(true);const bodies=g.world.parts.flatMap(p=>{const exclude=new Set();for(const t of p.terminals)t.post.traverse(o=>exclude.add(o));const out=[];p.body.traverse(o=>{if(o.isMesh&&!exclude.has(o)&&visible(o))out.push(o)});return out;});s.scene=scene;s.viewport=[+frame.width,+frame.height];s.quality='q=1; desktop IAB; not iPad/PWA/FPS';s.triggers=g.world.parts.filter(p=>['balloon','skittles'].includes(p.kind)).map(p=>({kind:p.kind,screen:g.stage.project(p.kind==='balloon'?p.ball.getWorldPosition(new THREE.Vector3()):p.pins[2].g.getWorldPosition(new THREE.Vector3()))}));s.terminals=g.world.parts.flatMap(p=>p.terminals.map(t=>{const pos=t.attachPoint(),screen=g.stage.project(pos),delta=cam.position.clone().sub(pos),d=delta.length(),ray=new THREE.Raycaster(pos.clone().addScaledVector(delta.clone().normalize(),.025),delta.normalize(),0,d-.025),hits=ray.intersectObjects(bodies,false).filter(h=>{const m=Array.isArray(h.object.material)?h.object.material[h.face.materialIndex]:h.object.material;return m.opacity>=.9&&m.depthTest!==false;});return{kind:p.kind,key:t.key,world:pos.toArray(),screen,inside:screen.x>=0&&screen.x<=+frame.width&&screen.y>=0&&screen.y<=+frame.height,bodyOccluders:hits.map(h=>({name:h.object.name||h.object.type,distance:h.distance}))}}));s.trace=trace;report.textContent=JSON.stringify(s,null,2);}
document.querySelector('#gallery').onclick=()=>action(()=>setup('gallery'));
document.querySelector('#kettle').onclick=()=>action(()=>setup('kettle'));
document.querySelector('#party').onclick=()=>action(()=>setup('party'));
document.querySelector('#connect').onclick=()=>action(connect);
document.querySelector('#off').onclick=()=>action(()=>{const g=get();for(const w of [...g.world.wires])g.world.removeWire(w)});
document.querySelector('#status').onclick=()=>action(()=>{});
document.querySelector('#size').onchange=()=>action(async()=>{const[w,h]=document.querySelector('#size').value.split(',');frame.width=w;frame.height=h;for(let i=0;i<3;i++)await new Promise(requestAnimationFrame);if(scene!=='none')fit();});
setInterval(()=>{if(scene!=='none')sample()},150);
</script></html>
