<!doctype html><html lang="ru"><meta charset="utf-8"><title>Модели — до и после</title><style>body{margin:0;background:#f6eddd;font:13px system-ui;color:#18213d}header{padding:8px;display:flex;gap:8px;align-items:center}select{padding:6px}#grid{display:grid;grid-template-columns:repeat(2,400px);gap:4px}section{display:flex;position:relative;padding-top:20px}b{position:absolute;top:0;left:4px}figure{margin:0;position:relative}img{width:200px;height:200px}figcaption{position:absolute;bottom:0;left:5px;background:#f6edddcc;padding:2px}@media(max-width:500px){header{flex-wrap:wrap}#grid{grid-template-columns:1fr}section{min-width:0}figure{width:50%}img{width:100%;height:auto;aspect-ratio:1}}</style><header><strong>Проверка моделей</strong><select id="group" aria-label="Группа"></select><select id="view" aria-label="Ракурс"><option value="game">В игре</option><option value="top">Сверху</option><option value="front">Сбоку (+z)</option><option value="right">Спереди (+x)</option><option value="threequarter">Три четверти</option></select><span id="status">Загрузка…</span></header><main id="grid"></main><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';
const params=new URLSearchParams(location.search),beforeDir=params.get('before')??'/assets-src/raw/mobile-models-2026-10-25/',afterDir=params.get('after')??'/models/',afterSuffix=params.get('afterSuffix')??'';
const all=params.get('models')?.split(',')??['barn','coop','cow','dog','doghouse','duck','fox','hen','pig','rabbit','sheep','tractor','sack','fox-rig','pole','pump','solar','heater','battery','bell','button','buzzer','cannon','carousel','drum','dynamo','firetruck','floorfan','helicopter','knife','laser','led','magnet','mirror','motor','musicbox','panel','propeller','racecar','sails','socket','target','tester','trafficlight','tuba','windgen','windmill'];
const group=document.querySelector('#group'),view=document.querySelector('#view'),status=document.querySelector('#status'),grid=document.querySelector('#grid');
for(let i=0;i<all.length;i+=9)group.add(new Option(`${i+1}–${Math.min(i+9,all.length)}: ${all[i]}`,String(i)));
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(400,400);renderer.toneMapping=THREE.NeutralToneMapping;
const env=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture,loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const views={game:new THREE.Vector3(0,1,.78),top:new THREE.Vector3(0,1,.001),front:new THREE.Vector3(0,.12,1),right:new THREE.Vector3(1,.2,0),threequarter:new THREE.Vector3(1,.65,.85)},cache=new Map();
async function load(dir,n){const key=dir+n;if(!cache.has(key))cache.set(key,loader.loadAsync(`${dir}${n}.glb`));return cache.get(key);}
async function render(){group.disabled=view.disabled=true;status.textContent='Загрузка…';grid.replaceChildren();try{for(const n of all.slice(+group.value,+group.value+9)){const before=await load(beforeDir,n),after=await load(afterDir,n+afterSuffix),box=new THREE.Box3().setFromObject(before.scene),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),section=document.createElement('section'),label=document.createElement('b');label.textContent=n;section.append(label);for(const [g,title] of [[before,'До'],[after,'После']]){const scene=new THREE.Scene();scene.background=new THREE.Color('#f6eddd');scene.environment=env;scene.add(new THREE.DirectionalLight('#fff',2).translateY(5).translateZ(3));scene.add(g.scene);const camera=new THREE.PerspectiveCamera(30,1,.01,100);camera.position.copy(center).addScaledVector(views[view.value].clone().normalize(),size.length()*1.65);camera.lookAt(center);renderer.render(scene,camera);const f=document.createElement('figure'),img=new Image(),caption=document.createElement('figcaption');img.src=renderer.domElement.toDataURL();caption.textContent=title;f.append(img,caption);section.append(f);scene.remove(g.scene);g.scene.traverse(o=>{if(!o.isMesh)return;o.geometry.dispose();for(const m of Array.isArray(o.material)?o.material:[o.material]){for(const value of Object.values(m))if(value?.isTexture)value.dispose();m.dispose();}});}grid.append(section);cache.clear();}status.textContent='Готово';}catch(e){status.textContent=e.message;console.error(e);}group.disabled=view.disabled=false;}
group.onchange=view.onchange=render;render();
</script></html>
