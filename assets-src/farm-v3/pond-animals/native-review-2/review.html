<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лягушка и ворона · повторная native QA</title>
<style>body{margin:0;background:#eee7dc;color:#21313d;font:14px system-ui}header{padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;max-width:1180px}button,select{padding:6px;font:inherit}iframe{display:block;border:0}pre{white-space:pre-wrap;max-width:1180px;margin:8px}#status{padding:6px 8px}</style>
<header><b>Актуальная игра · точные фазы</b><select id="size"><option value="1180,660">1180×660</option><option value="390,844">390×844</option></select><button id="start" disabled>Загрузить ферму</button><label>Лягушка <select id="frogTime"><option value="-1">На берегу</option><option value="0.35">Вершина прыжка</option><option value="0.75">В воде, скрыта</option><option value="3.6">Возвращение</option></select></label><button id="frog">Проверить прыжок</button><button id="frogSweep">Весь цикл лягушки</button><label>Ворона <select id="crowTime"><option value="0">Подлёт</option><option value="0.8">Посадка, середина</option><option value="1.65">Касание земли</option><option value="2.6">Крылья сложены</option><option value="6">Идёт к проводу</option><option value="flee-up">Испуг, мах вверх</option><option value="flee-down">Испуг, мах вниз</option></select></label><button id="crow">Проверить ворону</button><button id="crowSweep">Весь цикл вороны</button><label><input type="checkbox" id="close">Крупный план QA</label><label>Плечи <select id="shoulder"><option value="game">Игровая камера</option><option value="front">Передний крупный</option><option value="rear">Задний крупный</option></select></label><button id="tapFrog">Подготовить UI-тап лягушки</button><button id="tapCrow">Подготовить UI-тап вороны</button><button id="tapResult">Считать результат UI-тапа</button><button id="identifyFeather">Идентифицировать перо</button></header>
<div id="status">Кнопки вызывают настоящие Life/Pest из коммита. Общий update карты приостановлен только в этом стенде для точных кадров.</div><iframe id="game" width="1180" height="660" src="/?q=2"></iframe><pre id="report">Ожидание игры…</pre>
<script type="module">
import * as THREE from 'three';
const source=await fetch('/snapshot.json').then(r=>r.json());
const pageErrors=[],inputEvents=[];let uiTapBefore=null,uiTapKind=null;
const $=id=>document.getElementById(id),frame=$('game'),out=$('report'),status=$('status');let g,life,pest,frog,updateLife,updatePest,time=100,seededCrow,which='frog';
const paint=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(()=>requestAnimationFrame(r))));
const round=a=>a.map(n=>+n.toFixed(6));const xyz=v=>round(v.toArray());
function visibleMesh(o){return o.isMesh&&o.material?.colorWrite!==false;}
function bounds(obj){obj.updateWorldMatrix(true,true);const b=new THREE.Box3();obj.traverse(o=>{if(visibleMesh(o)){o.geometry.computeBoundingBox();b.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld));}});return b;}
function bbox(obj){const b=bounds(obj);return{min:xyz(b.min),max:xyz(b.max),size:xyz(b.getSize(new THREE.Vector3()))};}
function meshes(obj){const result=[];obj.traverse(o=>{if(visibleMesh(o))result.push({name:o.name,triangles:(o.geometry.index?.count??o.geometry.attributes.position.count)/3});});return result;}
async function focus(at,radius=3){if($('close').checked)radius=.65;const pts=[at.clone().add(new THREE.Vector3(-radius,0,-radius)),at.clone().add(new THREE.Vector3(radius,0,radius))];for(let i=0;i<4;i++){g.map.hooks.focus(pts);g.map.hooks.focus(pts,true);await paint();}if($('close').checked){g.stage.frame(pts,true,160);await paint();}if(which==='crow'&&$('shoulder').value!=='game'){const sculpt=pest.body.children.find(c=>!!c.getObjectByName('wing-left'));sculpt.updateWorldMatrix(true,true);const center=bounds(sculpt).getCenter(new THREE.Vector3());const offset=$('shoulder').value==='front'?new THREE.Vector3(1.7,1.4,1.7):new THREE.Vector3(-1.7,1.4,-1.7);offset.transformDirection(pest.root.matrixWorld).multiplyScalar(2.75);g.stage.camera.position.copy(center).add(offset);g.stage.camera.lookAt(center);g.stage.camera.near=.03;g.stage.camera.updateProjectionMatrix();g.stage.camera.updateMatrixWorld();}g.stage.render();}
function show(data){out.textContent=JSON.stringify({revision:source.revision,models:source.models,quality:g.stage.quality,contextLost:g.stage.renderer.getContext().isContextLost(),errors:pageErrors,frameRect:frame.getBoundingClientRect().toJSON(),camera:{position:xyz(g.stage.camera.position),direction:xyz(g.stage.camera.getWorldDirection(new THREE.Vector3())),fov:g.stage.camera.fov},build:frame.contentDocument.querySelector('.build-tag')?.textContent,viewport:[+frame.width,+frame.height],closeup:$('close').checked,shoulderView:$('shoulder').value,...data},null,2);}
function action(fn){return async()=>{status.textContent='Выполняется';try{await fn();status.textContent='Готово';}catch(e){status.textContent='Ошибка QA';out.textContent=e.stack;console.error(e);}};}
$('start').onclick=action(async()=>{g=frame.contentWindow.__game;await g.startMap('farm',true);g.voice.stop();const map=g.map;map.update=()=>{};frame.contentWindow.addEventListener('error',e=>pageErrors.push(e.message));frame.contentWindow.addEventListener('unhandledrejection',e=>pageErrors.push(String(e.reason)));for(const type of ['pointerdown','pointerup'])g.stage.canvas.addEventListener(type,e=>inputEvents.push({type,isTrusted:e.isTrusted,pointerType:e.pointerType,x:e.clientX,y:e.clientY}),true);life=map.life;pest=map.pest;frog=life.toys.find(t=>t.kind==='frog');if(!frog||!pest)throw Error('Missing integrated animal');updateLife=life.update.bind(life);updatePest=pest.update.bind(pest);map.picked=true;status.textContent='Ферма из закреплённого HEAD загружена; рендер настоящий, время животных управляется кнопками.';await focus(frog.home,3);show({ready:true,frog:meshes(frog.parts.frog),crow:meshes(pest.root)});});
function frogReset(){frog.t=-1;frog.parts.frog.visible=true;frog.parts.frog.position.set(0,0,0);}
function sampleFrog(){const f=frog.parts.frog,sculpt=f.children[0];frog.root.updateMatrixWorld(true);const jump=frog.parts.frog.userData.out.clone().transformDirection(frog.root.matrixWorld),forward=new THREE.Vector3(1,0,0).transformDirection(sculpt.matrixWorld);return {kind:'frog',t:frog.t,visible:f.visible,position:xyz(f.position),world:xyz(f.getWorldPosition(new THREE.Vector3())),bounds:bbox(f),forward:xyz(forward),jump:xyz(jump),facingDot:forward.dot(jump),triangles:meshes(f).reduce((s,m)=>s+m.triangles,0),rootYaw:frog.root.rotation.y,padY:frog.root.children.find(o=>o.isMesh)?.position.y};}
function runFrog(duration){frogReset();life.tap(frog.parts.frog.children[0]);let elapsed=0;while(elapsed<duration-1e-8){const dt=Math.min(1/120,duration-elapsed);updateLife(dt,g.map.nightAmount,g.stage.camera.position);elapsed+=dt;}g.voice.stop();}
$('frog').onclick=action(async()=>{which='frog';const t=+$('frogTime').value;if(t<0)frogReset();else runFrog(t);await focus(frog.home,3);show(sampleFrog());});
$('frogSweep').onclick=action(async()=>{which='frog';frogReset();const before=sampleFrog();life.tap(frog.parts.frog.children[0]);const samples=[];for(let i=0;i<480;i++){updateLife(1/120,g.map.nightAmount,g.stage.camera.position);samples.push(sampleFrog());}const after=sampleFrog();g.voice.stop();await focus(frog.home,3);show({kind:'frog-cycle',before,after,samples,minimumVisibleY:Math.min(...samples.filter(x=>x.visible).map(x=>x.bounds.min[1])),facingMinimum:Math.min(...samples.map(x=>x.facingDot)),returnDelta:after.world.map((v,i)=>v-before.world[i])});});
async function setupCrow(){const poles=g.world.parts.filter(p=>p.kind==='pole').sort((a,b)=>a.root.position.distanceTo(frog.home)-b.root.position.distanceTo(frog.home));if(poles.length<2)throw Error('Need actual poles');if(!seededCrow){g.connect(poles[0].terminals[0],poles[1].terminals[0]);g.step(2);const wire=g.world.wires.at(-1);const at=wire.pointAt(.5).clone().setY(0);seededCrow={wire,at,to:at.clone().add(new THREE.Vector3(2.6,0,0)),from:at.clone().add(new THREE.Vector3(-3.4,6,0))};}
 Object.assign(pest,{act:'land',t:0,wire:seededCrow.wire,ruffle:0,dizzy:0});pest.at.copy(seededCrow.at);pest.to.copy(seededCrow.to);pest.from.copy(seededCrow.from);pest.root.visible=true;pest.root.position.copy(pest.from);pest.root.rotation.set(0,0,0);pest.body.rotation.set(0,0,0);pest.body.position.set(0,0,0);pest.body.scale.setScalar(1);pest.feather.visible=false;for(const w of pest.wings)w.rotation.copy(w.userData.fold);time=100;}
function stepCrow(seconds,records){let elapsed=0;while(elapsed<seconds-1e-8){const dt=Math.min(1/120,seconds-elapsed);time+=dt;updatePest(dt,time);if(records)records.push(sampleCrow());elapsed+=dt;}g.voice.stop();}
function sampleCrow(){pest.root.updateMatrixWorld(true);const sculpt=pest.body.children.find(c=>!!c.getObjectByName('wing-left'));const wings=pest.wings.map(w=>{const pivot=w.getWorldPosition(new THREE.Vector3()),local=sculpt.worldToLocal(pivot.clone());return{name:w.name,rotation:round([w.rotation.x,w.rotation.y,w.rotation.z]),pivotInSculpt:xyz(local),worldPivot:xyz(pivot),bounds:bbox(w),meshes:meshes(w)};});return {kind:'crow',act:pest.act,t:+pest.t.toFixed(6),clock:+time.toFixed(6),visible:pest.root.visible,root:xyz(pest.root.position),bodyY:pest.body.position.y,bounds:bbox(sculpt),wings,bodyMeshes:meshes(sculpt.getObjectByName('body'))};}
$('crow').onclick=action(async()=>{which='crow';await setupCrow();const selected=$('crowTime').value;if(selected.startsWith('flee')){stepCrow(2.6);pest.tap();const target=selected==='flee-up'?1:-1;const dt=((target>0?Math.PI/2:3*Math.PI/2)-((time*24)%(Math.PI*2))+Math.PI*2)%(Math.PI*2)/24+Math.PI*2/24;stepCrow(dt);}else stepCrow(+selected);await focus(pest.root.position.clone().setY(0),3);show({scenario:'Controlled land path beside an actual wire between two existing poles; original update/tap methods, automatic choose bypassed.',...sampleCrow()});});
$('crowSweep').onclick=action(async()=>{which='crow';await setupCrow();const landing=[];stepCrow(2.8,landing);const settled=sampleCrow();pest.tap();const fleeing=[];stepCrow(2.3,fleeing);await focus(seededCrow.to,3);show({kind:'crow-cycle',scenario:'Controlled initial land trajectory and real tap; original source update methods.',settled,landing,fleeing});});

function targetScreen(kind){const obj=kind==='frog'?frog.parts.frog:pest.body,center=bounds(obj).getCenter(new THREE.Vector3()),screen=g.stage.project(center),rect=frame.getBoundingClientRect();return {game:[screen.x,screen.y],outer:[rect.left+screen.x,rect.top+screen.y],world:xyz(center)};}
$('tapFrog').onclick=action(async()=>{which='frog';uiTapKind='frog';$('close').checked=false;$('shoulder').value='game';frogReset();await focus(frog.home,3);uiTapBefore=sampleFrog();inputEvents.length=0;show({kind:'ui-tap-prepared',target:uiTapKind,before:uiTapBefore,screen:targetScreen(uiTapKind),instruction:'Click the actual animal on the game canvas; no Life.tap call has been made by this button.'});});
$('tapCrow').onclick=action(async()=>{which='crow';uiTapKind='crow';$('close').checked=false;$('shoulder').value='game';await setupCrow();stepCrow(2.6);await focus(pest.root.position.clone().setY(0),3);uiTapBefore=sampleCrow();inputEvents.length=0;show({kind:'ui-tap-prepared',target:uiTapKind,before:uiTapBefore,screen:targetScreen(uiTapKind),instruction:'Click the actual bird on the game canvas; no Pest.tap call has been made by this button.'});});
$('tapResult').onclick=action(async()=>{g.voice.stop();show({kind:'ui-tap-result',target:uiTapKind,before:uiTapBefore,after:uiTapKind==='frog'?sampleFrog():sampleCrow(),events:inputEvents,method:'Observed trusted pointer events through the unchanged game Input + StoryMap raycast. This button reads state only.'});});


$('identifyFeather').onclick=action(async()=>{const f=pest.feather;f.updateWorldMatrix(true,true);const sculpt=pest.body.children.find(c=>!!c.getObjectByName('wing-left'));show({kind:'feather-identity',sameObjectAsPestFeather:f===pest.feather,objectName:f.name,type:f.type,geometry:{type:f.geometry.type,parameters:f.geometry.parameters,triangles:(f.geometry.index?.count??f.geometry.attributes.position.count)/3},material:{type:f.material.type,color:'#'+f.material.color.getHexString(),roughness:f.material.roughness},visible:f.visible,parentIsScenery:f.parent===g.map.scenery,insideCrowRoot:!!pest.root.getObjectById(f.id),insideSculpt:!!sculpt.getObjectById(f.id),position:xyz(f.position),rotation:round([f.rotation.x,f.rotation.y,f.rotation.z]),effectClock:f.userData.t,bounds:bbox(f),crow:sampleCrow(),source:{file:'src/pest.ts',constructorLine:57,tapEnablesLine:148,updateBeginsLine:205,sha256:source.sha256['src/pest.ts']},meaning:'Original separately falling feather after the crow is scared. Not a GLB mesh, detached wing, or QA marker.'});});

$('size').onchange=action(async()=>{const[w,h]=$('size').value.split(',');frame.width=w;frame.height=h;await paint();status.textContent='Размер изменён. Нажмите кнопку проверки заново для кадра.';});
$('close').onchange=()=>status.textContent='Крупный план QA изменяет только камеру. Нажмите проверку заново.';
const ready=setInterval(()=>{if(frame.contentWindow.__game){$('start').disabled=false;clearInterval(ready);}},100);
</script></html>
