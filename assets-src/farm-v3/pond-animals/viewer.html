<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лягушка и ворона — QA</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4efe6;color:#24353c;font:14px system-ui}header{padding:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:flex;gap:4px;align-items:center}select,button{font:inherit;padding:6px}canvas{display:block;width:100%;height:66vh;min-height:320px}pre{white-space:pre-wrap;margin:0;padding:10px}input{max-width:130px}p{padding:0 10px}</style>
<header><b>Животные пруда · QA</b><label>Модель<select id="animal"><option value="frog">Лягушка</option><option value="crow">Ворона</option></select></label><label>Источник<select id="source"><option value="candidate">Кандидат</option><option value="raw">Исходник</option></select></label><label>Вид<select id="view"><option value="three">Три четверти</option><option value="front">Спереди +X</option><option value="back">Сзади −X</option><option value="side">Сбоку +Z</option><option value="top">Сверху</option><option value="bottom">Снизу</option><option value="game">Игровой угол</option></select></label><label>Крылья<select id="pose"><option value="neutral">Раскрыты</option><option value="up">Вверх 55°</option><option value="down">Вниз 55°</option><option value="fold">Сложены</option><option value="flap">Махать</option><option value="left">Только левое</option><option value="right">Только правое</option></select></label><label><input id="axes" type="checkbox" checked>Оси</label><label><input id="bodyOnly" type="checkbox">Только тело</label></header>
<canvas id="stage"></canvas><pre id="report">Загрузка…</pre><p>Красная ось +X — нос, зелёная +Y — верх, синяя +Z — левая сторона животного. QA отдельного ассета; не проверка интеграции и FPS на iPad.</p>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';
const $=s=>document.getElementById(s),canvas=$('stage'),report=$('report');
const params=new URLSearchParams(location.search);for(const n of ['animal','source','view','pose'])if(params.has(n))$(n).value=params.get(n);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.toneMapping=THREE.NeutralToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color('#f4efe6');scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),.04).texture;scene.environmentIntensity=.6;
const hemi=new THREE.HemisphereLight('#fffaf0','#c4baa7',2),sun=new THREE.DirectionalLight('#fff4e6',2.6);sun.position.set(3,5,4);scene.add(hemi,sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:'#dbd5bc',roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.015;scene.add(ground);
const axis=new THREE.AxesHelper(1.2);scene.add(axis);const camera=new THREE.OrthographicCamera();
let model,baseBox,baseSize,left,right,meshCount,triangles,serial=0;
const round=a=>a.map(v=>+v.toFixed(6));
async function load(){const token=++serial;report.textContent='Загрузка…';try{const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);const old=window.createImageBitmap;window.createImageBitmap=undefined;let gltf;try{gltf=await loader.loadAsync(`${$('source').value}/${$('animal').value}.glb`);}finally{window.createImageBitmap=old;}if(token!==serial)return;if(model)scene.remove(model);model=gltf.scene;scene.add(model);model.updateMatrixWorld(true);baseBox=new THREE.Box3().setFromObject(model);baseSize=baseBox.getSize(new THREE.Vector3());left=model.getObjectByName('wing-left');right=model.getObjectByName('wing-right');meshCount=0;triangles=0;model.traverse(o=>{if(o.isMesh){meshCount++;triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;}});render(0);}catch(e){report.textContent=e.stack;console.error(e);}}
function pose(t){for(const [wing,side] of [[left,1],[right,-1]])if(wing){wing.visible=!$('bodyOnly').checked;wing.rotation.set(0,0,0);const p=$('pose').value;let a=0;if(p==='up')a=-55*Math.PI/180;if(p==='down')a=55*Math.PI/180;if(p==='left'&&side===1)a=-.9;if(p==='right'&&side===-1)a=-.9;if(p==='flap')a=Math.sin(t*.012)*.75;if(p==='fold'){wing.rotation.y=-side*1.05;a=.28;}wing.rotation.x=side*a;}}
function render(t=0){if(!model)return;pose(t);const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);const span=Math.max(baseSize.y*1.4,Math.max(baseSize.x,baseSize.z)*1.3*h/w,.8),center=baseBox.getCenter(new THREE.Vector3());camera.left=-span*w/h/2;camera.right=span*w/h/2;camera.top=span/2;camera.bottom=-span/2;camera.near=.001;camera.far=100;camera.up.set(0,1,0);const view=$('view').value;let dir={three:[1,.7,1],front:[1,0,0],back:[-1,0,0],side:[0,0,1],top:[0,1,0],bottom:[0,-1,0],game:[0,1,.78]}[view];if(view==='top')camera.up.set(0,0,-1);if(view==='bottom')camera.up.set(0,0,1);camera.position.copy(center).addScaledVector(new THREE.Vector3(...dir).normalize(),10);camera.lookAt(center);camera.updateMatrixWorld(true);const corners=[];for(const x of [baseBox.min.x,baseBox.max.x])for(const y of [baseBox.min.y,baseBox.max.y])for(const z of [baseBox.min.z,baseBox.max.z])corners.push(new THREE.Vector3(x,y,z).applyMatrix4(camera.matrixWorldInverse));const projectedW=Math.max(...corners.map(v=>v.x))-Math.min(...corners.map(v=>v.x)),projectedH=Math.max(...corners.map(v=>v.y))-Math.min(...corners.map(v=>v.y)),framed=Math.max(projectedH*1.25,projectedW*1.25*h/w,.1);camera.left=-framed*w/h/2;camera.right=framed*w/h/2;camera.top=framed/2;camera.bottom=-framed/2;camera.updateProjectionMatrix();ground.visible=view!=='bottom';axis.visible=$('axes').checked;renderer.render(scene,camera);model.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(model),pivots={};for(const wing of [left,right])if(wing)pivots[wing.name]={world:round(wing.getWorldPosition(new THREE.Vector3()).toArray()),rotation:round([wing.rotation.x,wing.rotation.y,wing.rotation.z])};report.textContent=JSON.stringify({model:$('animal').value,source:$('source').value,viewport:[w,h],triangles,meshCount,bounds:{min:round(b.min.toArray()),max:round(b.max.toArray())},restSize:round(baseSize.toArray()),pivots,pose:$('pose').value},null,2);}
for(const n of ['animal','source'])$(n).onchange=load;for(const n of ['view','pose','axes','bodyOnly'])$(n).onchange=()=>render();window.addEventListener('resize',()=>render());renderer.setAnimationLoop(t=>{if($('pose').value==='flap')render(t);});load();
</script></html>
