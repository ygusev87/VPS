<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ферма A · плотность</title>
<style>body{margin:0;background:#eee7db;font:14px system-ui;color:#25372f}header{display:flex;gap:12px;align-items:center;padding:8px}button,select{font:inherit;padding:5px}iframe{display:block;border:0}pre{max-height:180px;overflow:auto;white-space:pre-wrap;font-size:12px;margin:8px}</style>
<header><b>Плотность фермы A</b><select id="size"><option value="1180,660">1180×660</option><option value="390,844">390×844</option></select><select id="mode"><option value="before">До</option><option value="after">Кандидат</option></select><select id="area"><option value="wide">Вся ферма</option><option value="yard">Загоны</option><option value="garden">Огород и цветы</option><option value="field">Поле</option><option value="north">Север</option></select><button id="show" disabled>Показать</button><span id="status">Загрузка</span></header>
<iframe id="game" src="/qa-game.html?q=1" width="1180" height="660"></iframe><pre id="report"></pre>
<script type="module">
const $=id=>document.getElementById(id),frame=$('game');
async function show(){try{const report=await frame.contentWindow.densityQA.show($('mode').value,$('area').value);$('report').textContent=JSON.stringify(report,null,2);$('status').textContent=report.contextLost?'Потерян WebGL-контекст':'Готово';}catch(e){$('status').textContent='Ошибка';$('report').textContent=String(e);}}
$('show').onclick=show;
$('size').onchange=async()=>{[frame.width,frame.height]=$('size').value.split(',');await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));await show();};
const timer=setInterval(()=>{if(frame.contentWindow.densityQA?.ready){clearInterval(timer);$('show').disabled=false;show();}},100);
</script></html>
