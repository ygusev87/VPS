<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Герои фермы: проверка скелета</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6eddd;font:14px system-ui;color:#18213d}header{display:flex;gap:8px;padding:10px;flex-wrap:wrap}select,button{padding:8px}#status{padding:8px}#views{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.view{height:520px;position:relative;border:1px solid #c7baa1;border-radius:12px;overflow:hidden}b{position:absolute;top:8px;left:8px;z-index:2;background:#f6edddcc}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}header,#status{position:relative;z-index:2}@media(max-width:600px){.view{height:300px}}</style>
<header><label>Ракурс <select id="view"><option value="side">Сбоку +Z</option><option value="back">Сбоку −Z</option><option value="front">Спереди +X</option><option value="game">В игре</option><option value="quarter">Три четверти</option></select></label><label>Движение <select id="pose"><option value="rest">Исходная поза</option><option value="head">Голова вниз 15°</option><option value="look">Взгляд вбок 15°</option><option value="tail">Хвост 20°</option><option value="frontLeg">Передняя нога 15°</option><option value="hindLeg">Задняя нога 1 · 15°</option><option value="otherHind">Задняя нога 2 · 15°</option></select></label><label><input type="checkbox" id="bones"> Кости</label><button id="play">Анимировать</button></header>
<div id="status">Загрузка…</div><div id="views"><div class="view" id="before"><b>Статичная</b></div><div class="view" id="after"><b>Со скелетом</b></div></div><canvas id="render"></canvas><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';import {MeshoptDecoder} from 'three/examples/jsm/libs/meshopt_decoder.module.js';import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';
const q=s=>document.querySelector(s),params=new URLSearchParams(location.search),name=params.get('model')??'cow',view=q('#view'),pose=q('#pose'),bones=q('#bones'),status=q('#status'),play=q('#play');
const r=new T.WebGLRenderer({canvas:q('#render'),antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.toneMapping=T.NeutralToneMapping;
const environment=new T.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture,loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
try{
let source,rig;const bitmap=window.createImageBitmap;window.createImageBitmap=undefined;
try{source=await loader.loadAsync('/models/'+name+'.glb');rig=await loader.loadAsync(params.get('rig')??'/models/'+name+'-rig.glb')}finally{window.createImageBitmap=bitmap}
let mesh,skinCount=0;rig.scene.traverse(o=>{if(o.isSkinnedMesh){mesh=o;skinCount++}});if(!mesh)throw Error('Нет skinned mesh');
const rest=new Map(mesh.skeleton.bones.map(b=>[b.name,b.quaternion.clone()]));
const entries=[['before',source.scene],['after',rig.scene]].map(([id,model])=>{
 const scene=new T.Scene();scene.background=new T.Color('#eee4d3');scene.environment=environment;scene.add(new T.HemisphereLight(0xffffff,0x8a7757,1));
 const light=new T.DirectionalLight(0xffffff,2);light.position.set(-3,5,4);scene.add(light);
 const holder=new T.Group();model.rotation.y=0;holder.add(model);holder.updateMatrixWorld(true);let box=new T.Box3().setFromObject(model),scale=1/box.getSize(new T.Vector3()).x;model.scale.setScalar(scale);holder.updateMatrixWorld(true);box.setFromObject(model);const center=box.getCenter(new T.Vector3());model.position.set(-center.x,-box.min.y,-center.z);holder.updateMatrixWorld(true);scene.add(holder);
 const helper=new T.SkeletonHelper(model);helper.material.depthTest=false;helper.renderOrder=10;scene.add(helper);
 const axes=new T.AxesHelper(.28);axes.position.set(-.6,.001,.35);scene.add(axes);
 return{el:q('#'+id),scene,helper,model,camera:new T.PerspectiveCamera(28,1,.001,100)};
});
const frameBox=new T.Box3().setFromObject(entries[0].model),frameCenter=frameBox.getCenter(new T.Vector3()),frameRadius=frameBox.getSize(new T.Vector3()).length()/2;
const directions={side:[0,.12,1],back:[0,.12,-1],front:[1,.12,0],game:[0,1,.78],quarter:[1,.55,.85]};
const controls=await(await fetch('./'+name+'-controls.json')).json();
let playing=false,start=0,phase=1;
function apply(){for(const b of mesh.skeleton.bones)b.quaternion.copy(rest.get(b.name));rig.scene.updateMatrixWorld(true);const c=controls[pose.value];if(c){const b=mesh.skeleton.bones.find(b=>(b.userData.name??b.name)===c[0]);if(!b)throw Error('Нет кости '+c[0]);const axis=new T.Vector3(...c[1]).applyQuaternion(b.parent.getWorldQuaternion(new T.Quaternion()).invert());b.quaternion.premultiply(new T.Quaternion().setFromAxisAngle(axis,c[2]*Math.PI/180*phase))}rig.scene.updateMatrixWorld(true);mesh.skeleton.update();mesh.computeBoundingBox();status.textContent='Готово · '+skinCount+' skinned mesh · '+mesh.skeleton.bones.length+' костей · '+(c?c[0]:'bind pose')}
pose.onchange=()=>{playing=false;phase=1;play.textContent='Анимировать';apply()};play.onclick=()=>{playing=!playing;start=performance.now();play.textContent=playing?'Остановить':'Анимировать'};apply();
r.setAnimationLoop(now=>{if(playing){phase=Math.sin((now-start)/700);apply()}r.setSize(innerWidth,innerHeight,false);r.setScissorTest(false);r.clear();r.setScissorTest(true);for(const e of entries){const b=e.el.getBoundingClientRect();if(b.bottom<0||b.top>innerHeight)continue;e.helper.visible=bones.checked;const center=frameCenter;e.camera.position.copy(center).addScaledVector(new T.Vector3(...directions[view.value]).normalize(),frameRadius/Math.sin(14*Math.PI/180)*1.1*Math.max(1,b.height/b.width));e.camera.lookAt(center);e.camera.aspect=b.width/b.height;e.camera.updateProjectionMatrix();r.setViewport(b.left,innerHeight-b.bottom,b.width,b.height);r.setScissor(b.left,innerHeight-b.bottom,b.width,b.height);r.render(e.scene,e.camera)}});
}catch(e){status.textContent='Ошибка: '+e.message;console.error(e)}
</script></html>
