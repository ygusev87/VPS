<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка анимации лисы</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6eddd;color:#18213d;font:14px system-ui}header{padding:12px 18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}button{padding:8px 16px;border:1px solid #a69980;border-radius:8px;background:#fffaf0}#status{padding:0 18px 12px}#views{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px}.view{height:190px;position:relative;border:1px solid #cbbfae;border-radius:12px;overflow:hidden}.large{grid-column:span 2;height:320px}.label{position:absolute;top:8px;left:10px;z-index:2;background:#f6eddddf;padding:4px;border-radius:4px}#render{position:fixed;inset:0;pointer-events:none}header,#status{position:relative;z-index:2}@media(max-width:600px){#views{grid-template-columns:repeat(2,1fr)}.large{height:230px;grid-column:span 2}.view:not(.large){height:180px}}</style>
<header><strong>Лиса · проверка GLB</strong><button id="play">Пауза</button><button id="speed">Скорость ×1</button><button id="phase0">Фаза 0%</button><button id="phase25">Фаза 25%</button><button id="phase50">Фаза 50%</button><button id="phase75">Фаза 75%</button></header><div id="status">Загрузка…</div><div id="views"></div><canvas id="render"></canvas>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/examples/jsm/libs/meshopt_decoder.module.js';
import {clone} from 'three/examples/jsm/utils/SkeletonUtils.js';
import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';
const r=new THREE.WebGLRenderer({canvas:document.querySelector('#render'),antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,1.5));r.toneMapping=THREE.NeutralToneMapping;
const environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture;
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
try{
const gltf=await loader.loadAsync('/models/fox-rig.glb');const clip=gltf.animations[0];if(!clip)throw Error('Нет анимации');
const originalBox=new THREE.Box3().setFromObject(gltf.scene);const size=originalBox.getSize(new THREE.Vector3());const center=originalBox.getCenter(new THREE.Vector3());
const specs=[['Вид игры · анимация',null,[0,1,.78]],['Вид сбоку +z · анимация',null,[0,.22,1]],['0% цикла',0,[0,.25,1]],['25% цикла',.25,[0,.25,1]],['50% цикла',.5,[0,.25,1]],['75% цикла',.75,[0,.25,1]]];
const views=specs.map(([title,phase,dir],i)=>{const el=document.createElement('div');el.className='view'+(i<2?' large':'');const label=document.createElement('div');label.className='label';label.textContent=title;el.append(label);document.querySelector('#views').append(el);const scene=new THREE.Scene();scene.background=new THREE.Color('#e9dfcb');scene.environment=environment;scene.add(new THREE.HemisphereLight(0xffffff,0x7d6a53,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-3,5,4);scene.add(light);const model=clone(gltf.scene);scene.add(model);const mixer=new THREE.AnimationMixer(model);mixer.clipAction(clip).play();const cam=new THREE.PerspectiveCamera(28,1,.001,100);cam.position.copy(center).addScaledVector(new THREE.Vector3(...dir).normalize(),size.length()*1.7);cam.lookAt(center);const axes=new THREE.AxesHelper(size.length()*.5);axes.position.y=originalBox.min.y;scene.add(axes);return{el,scene,mixer,cam,phase};});
let playing=true,speed=1,t=0,last=performance.now();document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Пауза':'Продолжить';};document.querySelector('#speed').onclick=()=>{speed=speed===1?2:1;document.querySelector('#speed').textContent='Скорость ×'+speed;};for(const percent of [0,25,50,75])document.querySelector('#phase'+percent).onclick=()=>{playing=false;t=clip.duration*percent/100;document.querySelector('#play').textContent='Продолжить';};
let skins=0;gltf.scene.traverse(o=>{if(o.isSkinnedMesh)skins++});document.querySelector('#status').textContent=`${clip.name} · ${clip.duration.toFixed(2)} с · skinned mesh: ${skins} · габариты ${size.toArray().map(x=>x.toFixed(3)).join(' × ')} · оси: X красная, Y зелёная, Z синяя`;
r.setAnimationLoop(now=>{const dt=Math.min((now-last)/1000,.05);last=now;if(playing)t+=dt*speed;r.setSize(innerWidth,innerHeight,false);r.setScissorTest(false);r.clear();r.setScissorTest(true);for(const v of views){const b=v.el.getBoundingClientRect();if(b.bottom<0||b.top>innerHeight)continue;const bottom=innerHeight-b.bottom;r.setViewport(b.left,bottom,b.width,b.height);r.setScissor(b.left,bottom,b.width,b.height);v.cam.aspect=b.width/b.height;v.cam.updateProjectionMatrix();v.mixer.setTime(v.phase===null?t:clip.duration*v.phase);r.render(v.scene,v.cam);}});
}catch(e){document.querySelector('#status').textContent='Ошибка: '+e.message;console.error(e)}
</script></html>
