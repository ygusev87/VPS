<!doctype html><html lang="ru"><meta charset="utf-8"><title>Ферма — проверка сценария</title><style>body{margin:0;background:#e4dfd5;color:#18213d;font:13px system-ui}header{padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}button,select{padding:7px;border:1px solid #b8a88e;border-radius:6px;background:#fffaf0}#status{padding:4px 10px;min-height:38px;white-space:pre-wrap}#holder{position:relative;margin:0 10px}iframe{border:0;transform-origin:top left;position:absolute;left:0;top:0;background:#f6eddd}</style>
<header><strong>Проверка фермы</strong><select id="size" aria-label="Размер экрана"><option value="1180,820">Планшет 1180×820</option><option value="1024,768">Планшет 1024×768</option><option value="390,844">Телефон 390×844</option></select><button id="start">Начать ферму</button><button id="place">Поставить помощника</button><button id="connect">Соединить цепь</button><button id="step">Прогнать 10 секунд</button><button id="focus">Показать текущую задачу</button><button id="overview">Обзор карты</button></header><div id="status">Ожидаю загрузку игры…</div><div id="holder"><iframe id="game" src="/" title="Игра на тестовом экране"></iframe></div>
<script type="module">
const frame=document.querySelector('#game'),state=document.querySelector('#status'),holder=document.querySelector('#holder');let selected=null,log='';
function dimensions(){const [w,h]=document.querySelector('#size').value.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';const s=Math.min(1,(innerWidth-20)/w,(innerHeight-100)/h);frame.style.transform=`scale(${s})`;holder.style.width=w*s+'px';holder.style.height=h*s+'px';}dimensions();window.onresize=dimensions;document.querySelector('#size').onchange=dimensions;
const g=()=>frame.contentWindow.__game;
const xy=p=>`(${p.x.toFixed(1)}, ${p.z.toFixed(1)})`;
function status(){const a=g();if(!a)return;const f=a.farm;if(!f){state.textContent='Игра загружена. Нажмите «Начать ферму».';return;}const n=f.current();state.textContent=`${f.phase} · ${f.score.join('/')} · ${n?n.critter.name+' / '+n.icon+' · круг '+xy(n.spot)+' · животное '+xy(n.critter.home):'переход/финал'}\n${log}`;}
function run(fn){return async()=>{try{await fn();}catch(e){log='Ошибка QA: '+e.message;console.error(e);}status();};}
document.querySelector('#start').onclick=run(async()=>{selected=null;log='Новый сценарий';await g().startFarm();});
document.querySelector('#place').onclick=run(()=>{const a=g(),f=a.farm,n=f.current();if(!n)throw Error('Сейчас переход между фазами');let part;if(n.kinds.length===0)part=a.world.parts.find(p=>p.kind==='gate');else part=a.world.addPart(n.icon,n.spot.x,n.spot.z,{appear:false});const source=f.nearestSource(part.root.position);selected={n,part,source};if(n.icon==='button'){const bell=a.world.addPart('bell',n.spot.x+2.8,n.spot.z+1.2,{appear:false});selected.bell=bell;}log=`Поставлен ${part.kind} ${xy(part.root.position)}; источник ${source.kind} ${xy(source.root.position)}. Провода ещё не подключены.`;});
document.querySelector('#connect').onclick=run(()=>{const a=g();if(!selected)throw Error('Сначала поставьте помощника');const {part,source,bell}=selected;if(selected.connected)throw Error('Эта цепь уже подключена');a.connect(source.terminal('a'),part.terminal('a'));if(bell){a.connect(part.terminal('b'),bell.terminal('a'));a.connect(bell.terminal('b'),source.terminal('b'));}else a.connect(part.terminal('b'),source.terminal('b'));selected.connected=true;log=`Соединено: ${source.kind} → ${part.kind}${bell?' → bell':''}.`;});
document.querySelector('#step').onclick=run(()=>{const a=g();for(let i=0;i<200;i++){a.step(1);a.farm.update(.05);}log+=' Прогнано 10 секунд симуляции.';});
document.querySelector('#focus').onclick=run(()=>g().farm.refocus(true));
document.querySelector('#overview').onclick=run(()=>frame.contentDocument.querySelector('button[aria-label="Показать всё"]').click());
setInterval(status,300);
</script></html>
