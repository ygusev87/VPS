<!doctype html><meta charset="utf-8"><title>Акценты: крупно и в игре</title><style>body{margin:16px;background:#e6e4cf;font:16px system-ui;color:#18213d}section{display:flex;align-items:center;gap:32px;margin:20px 0}figure{margin:0}img{display:block}figcaption{font-size:12px}</style><h3>Акценты: вид сверху под углом</h3><p id="status">Загрузка…</p><div id="out"></div><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';import {MeshoptDecoder} from 'three/examples/jsm/libs/meshopt_decoder.module.js';import {RoomEnvironment} from 'three/examples/jsm/environments/RoomEnvironment.js';
const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(400,400);r.toneMapping=T.NeutralToneMapping;const env=new T.PMREMGenerator(r).fromScene(new RoomEnvironment(),.04).texture,l=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
try{for(const name of ['rock-cluster','flower-cluster']){const g=(await l.loadAsync('/models/'+name+'.glb')).scene,box=new T.Box3().setFromObject(g),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3()),s=new T.Scene();s.background=new T.Color('#c8d4a2');s.environment=env;s.add(new T.DirectionalLight('#fff',2).translateY(5).translateZ(3));s.add(g);const c=new T.PerspectiveCamera(30,1,.01,100);c.position.copy(center).addScaledVector(new T.Vector3(0,1,.78).normalize(),size.length()*1.65);c.lookAt(center);r.render(s,c);const url=r.domElement.toDataURL(),row=document.createElement('section');for(const px of [240,80,32]){const f=document.createElement('figure'),i=new Image(),caption=document.createElement('figcaption');i.src=url;i.width=i.height=px;caption.textContent=name+' · '+px+'px';f.append(i,caption);row.append(f);}document.querySelector('#out').append(row);g.traverse(o=>{if(o.isMesh){o.geometry.dispose();for(const m of Array.isArray(o.material)?o.material:[o.material]){for(const t of Object.values(m))if(t?.isTexture)t.dispose();m.dispose();}}});}}catch(e){document.querySelector('#status').textContent=e.message;throw e;}document.querySelector('#status').textContent='Готово. Реальный игровой размер цветочной группы — около 20–30px.';r.dispose();</script>
